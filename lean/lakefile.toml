name = "lara"
defaultTargets = ["Lara", "lara-driver", "presentation-shape"]

# Mechanized reference semantics for the LARA claim-support calculus.
# No Mathlib dependency yet: the frozen nf/≡ carve-out (spec §9 result 11) is
# provable in core Lean 4. Mathlib is added later for result 5 (grounded
# least-fixpoint), which needs its order-theory / Finset machinery.

[[lean_lib]]
name = "Lara"

# The executable semantics driver (M3 plan, Task 0 Step 3 — the Lean side of
# the N11 differential anchor). A thin decode → call → encode shim over the
# theorem-bearing definitions of the `Lara` library.
[[lean_exe]]
name = "lara-driver"
root = "Lara.DriverMain"

# The admission differential driver (metatheory plan Task 3 — the Lean side
# of scripts/admission-differential.sh). Reads one test-only fixture under
# fixtures/admission/, runs the proved admission judgment, and prints the
# canonical outcome encoding.
[[lean_exe]]
name = "admission-driver"
root = "Lara.AdmissionDriverMain"

# The presentation-shape parity driver (result-12 plan Task 2 — the Lean side of
# scripts/check-presentation-parity.sh). Prints the normalized ordered TSV
# inventory of the presentation AST's surface-reachable shape, which the gate
# diffs against the Haskell inventory emitted by scripts/presentation-shape.hs.
[[lean_exe]]
name = "presentation-shape"
root = "Lara.PresentationParityMain"

# Exhaustive cross-language parity driver for Lara.Update's four constructor-side
# precondition deciders. scripts/update-differential.sh diffs its canonical TSV
# against the Haskell emitter.
[[lean_exe]]
name = "update-preconditions"
root = "Lara.UpdatePreconditionParityMain"
