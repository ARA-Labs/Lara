    content: >
      Defeat-layer findings (#3): real attacks are rare (4/194 decisions) and exclusively
      undercuts in this sample; rebut/undermine unexercised. The attack-candidate walk must
      cover the WHOLE trace, not only dead_end nodes (counter-evidence found in experiment
      nodes: fix_embedding; score-filtered runs: triton_cumsum). Inverse phenomenon exists:
      dead-end-as-support (restricted_mlm C14). Mandatory-CQ gaps are pervasive (39%) and
      must surface as holes, not defeat edges, or nearly every claim is spuriously attacked.
    context: "m0/annotation-summary.md §2-§3."
