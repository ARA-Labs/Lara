  provenance: user-revised
  content: 'A kernel-attestation verifier''s real trust guarantee is the fixed point of its commit gate,
    which can be strictly weaker than the architecture its write-up describes. Auditing rit''s shipping
    path (admit.gate) found four advertised aggregate guarantees unwired, stubbed, or unreachable — one
