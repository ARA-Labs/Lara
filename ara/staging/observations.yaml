  provenance: ai-suggested
  content: >
    Generalizing an observation along a parameter is free exactly when the underlying transport
    concludes an *equality* of the observed object rather than a pointwise agreement between two
    observed objects. The extensionality hypothesis a pointwise-agreement transport needs is
    precisely what an equality transport does not, so a generic result that assumed it anyway
    would be strictly weaker than the specific result it claims to generalize — and would not
    deserve the same name. The corollary for design: locate the single lemma the whole family of
    results funnels through, and check whether its conclusion is an equation. If it is, the family
    generalizes along any reader of the object with no new hypotheses.
