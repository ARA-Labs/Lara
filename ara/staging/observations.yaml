- id: O22
  timestamp: 2026-07-31T21:30
  provenance: ai-suggested
  content: 'In a dual-implementation (frozen-twin) architecture where one side carries the soundness proofs,
    any semantic hardening of a shared definition must land on BOTH sides in the same change-set — and
    the divergence class to watch is exactly the one no test can reach: inputs excluded by upstream validation.
    The dangling-member defense (unresolvable member => conflict) went into Haskell groupConsistent but
    not Lean consistentB, so the twins disagreed on a class of units unreachable past both R14-validating
    doors; every fixture and property stayed green while three theorems mechanized the obsolete semantics.
    Per the project rule that Lean proofs carry soundness for frozen definitions, the twin must agree
    by construction, not by decoder gating. Practical rule: a semantics change to a mirrored definition
    is incomplete until the twin definition and its affected theorems are updated, even when the behavior
    difference is unobservable end-to-end.

    '
