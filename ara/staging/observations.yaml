  provenance: ai-suggested
  content: >
    A seeded artifact generator can make its own refactors mechanically
    checkable, but only if the seed key and the selection rule are wired to the
    things a refactor is likely to disturb. Lara.Mutate keys its stream on
    (base, operator) THROUGH opName, and picks sites from each enumerator's
    output in list order. Both couplings are usually described as constraints -
    do not rename an operator, do not reorder a list. Under an output-preserving
    refactor they invert into a detector: the failure modes a large cut-and-paste
    actually produces (a reordered sum-type constructor, a reordered entry in an
    operator table, a reordered list comprehension, a renamed symbol) are exactly
    the ones that move committed bytes, so a byte-diff of the regenerated corpus
    is a near-complete test for move errors without a single new assertion. The
    generalization: when a frozen artifact is derived deterministically from
    source, the refactor gate is free, and its strength is a function of how much
    of the source's structure the derivation is sensitive to. A generator keyed
    on stable integers with order-independent selection would have caught none
    of these.
