  provenance: ai-suggested
  content: 'The R7/R13 boundary for certificate defects: tampering with a cert''s theory digest lands
    in R7 (CertifierUnallowlisted - the (backend, version, digest) triple is no longer in the rule''s
    certifiers allowlist), not R13. R13 is reachable only when the certificate is allowlisted but replay
    fails (payload corruption) or at the replay preflight (duplicate/unknown selected backend). Assurance
    misuse and replay failure are different trust boundaries even though both involve certificates.

    '
