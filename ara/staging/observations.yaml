- id: O170
  timestamp: "2026-09-11T07:40"
  provenance: ai-suggested
  content: >
    An incremental link (fold one member at a time, saturating each step's boundary)
    and a one-shot batch link (saturate every cross-member pair of the merged material)
    produce the same attacks and arguments whenever each member is well-formed on its own
    and identities are hygienic. The reason is that a member's derivations keep their
    conclusions in every environment extending the member's own, so the per-step and
    whole-map conclusion caches agree on every member argument. The equivalence needs no
    premise beyond what acceptance already needs.
  context: >
    Issue #321. Proved as batch_atts_mem_iff_fold / batch_args_mem_iff_fold in
    lean/Lara/Map/Link.lean; the generalization beyond this calculus is not tested.
  potential_type: claim
  bound_to: [N321_batch_link]
