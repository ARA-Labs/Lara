- id: O21
  timestamp: 2026-07-31T10:30
  provenance: ai-suggested
  content: 'A trusted checker with more than one front door must enforce every admission-tier well-formedness
    invariant at EACH door (or behind a shared choke point), not only at one. LARA''s .sexp path validates
    duplicate-report group R14 well-formedness at the wire decoder; the .lara path (parse → elaborate
    → runCheck, no wire round-trip) omitted it, so a misspelled group member was silently dropped and
    an intended R9 rejection became an accept — the two front doors disagreed on the same logical artifact.
    For a data-integrity feature this is the worst failure mode (silent under-rejection). General rule:
    an invariant enforced at one entry point is a per-door obligation, and a differential/CI check should
    exercise every door on the same malformed input, not just the wire one.

    '
  context: 'PR #45 review finding 1 (fenfenai, reproduced): fixed by Elaborate.validateGroups mirroring
