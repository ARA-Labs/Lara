- id: O23
  timestamp: 2026-08-01T01:11
  provenance: ai-suggested
  content: 'Reinstatement vs contested is decided by the declared attack SET, not the attack kinds available,
    and the lever is the completeness scan''s scope: attack completeness is arg-conclusion-level over
    declared contrary pairs (firstMissingConflictInfo), so a symmetric contrary pair forces mutual edges
    (any two args concluding the pair''s sides are locked into a 2-cycle -> contested), a ONE-directional
    contrary permits an unattackable defender (-> reinstatement), and exceptions are outside the scan
    entirely (undercut edges are always voluntary - the same vocabulary yields E4''s reinstatement chain
    or E5''s contested cycle depending on one declared edge).

    '
