- id: O113
  timestamp: "2026-09-02T00:00"
  provenance: ai-suggested
  content: >
    A bridge-global partial translation (translate : B -> Query src -> Option
    (Query tgt)) cannot express a resolution that depends on the target world.
    Concrete breaking case: a source atom naming an entity by an obsolete
    alias, where one target world under the bridge carries the ontology version
    that resolves it and another does not; a single global Option must answer
    once for both and is wrong at one. The edge-indexed successor is a relation
    Translate b w v src tgt : Prop, which additionally admits the ambiguity
    Option forbids. This is a contract change rather than a refinement:
    mem_compare_iff_sat_dia and compare_translationUndefined_iff are both
    stated against the Option form and the executable compare takes a single
    Option as its first guard.
  context: >
