  content: >
    The ground vocabulary of a first-order corpus is dominated by nullary
    constants, which surface grepping cannot see: inference over corpus-v1 found
    196 constructors of which 187 are nullary. A nullary constant has no
    argument positions, so its sort is only recoverable from the predicate and
    constructor positions it occupies — which makes union-find over occurrences
    the minimum viable census tool, not an optimisation over a sweep.
