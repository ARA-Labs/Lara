  provenance: ai-executed
  content: >
    A `file.lean:NNN` cross-reference in a docstring is a silent-rot citation: nothing
    compiles it, so it survives any edit that shifts lines and goes on pointing at
    whatever now sits there. Repairing a set of them by computing a line *delta* fails
    the moment a later edit in the same session shifts lines again — the repair is
    correct only against the tree state it was computed from. Repair by resolving each
    citation to the declaration NAME it intends and re-reading that name's current line,
    which is idempotent and survives further edits; then re-run the resolver after the
    last edit, not before it.
  context: >
    The §2A refactor moved ~200 lines between two modules and later grew two module
    headers. Both review stages caught citation rot: the spec review found 7 sites
