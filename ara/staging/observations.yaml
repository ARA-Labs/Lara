  content: >
    Whether a strict backend's goal family needs a declared contrary pair is decided by WHAT its
    goals are settled against. A family settled against data carried in the goal itself — ord@1's
    two numerals — cannot have two conflicting members accepted, so exclusivity is a theorem and
    a contrary declaration would add nothing. A family settled against a value the PREMISE
    supplies — insp@1's declared inventory — can, because two units may declare different
    premises for the same subject, so the conflict is real and only the attack layer can carry
    it. Under Path B the placement is then forced rather than chosen: a strict-reachable
    conclusion may not overlap a contrary side, so the conflict must sit on a defeasible bridge's
    conclusions one layer up.
