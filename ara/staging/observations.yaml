  content: >
    PW0's accept field is an arbitrary Prop with no posited connection to any
    checker, certificate, soundness condition, or even to the candidate
    relation R. The outer model therefore names an applicability judgment it
    does not constrain, and every T2 normality law holds regardless of what
    accept means. Supplying that connection is exactly the structural-bridge
    work of T6 (#191), so the T6 exit decision is not an extension of PW0 but
    the discharge of PW0's largest open hypothesis.
