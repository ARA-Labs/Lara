  content: >
    When a module is split and the ROOT is what owns the shared vocabulary its
    new siblings consume, the usual source-compatibility move - leave the root
    as a facade re-exporting everything - is structurally unavailable rather than
    merely undesirable. Every sibling imports the root, so a root importing them
    back closes a cycle; preserving the old import surface requires interposing a
    further Core layer beneath both, which is new public surface bought for
    compatibility alone. The consequence worth stating is a sequencing one: with
    no facade available there is also no partially-split intermediate state that
    compiles, so the move must land atomically, and reviewability has to come
    from an explicit move map and output gates rather than from small commits.
    The alternative shape - splitting so the shared vocabulary sinks into a leaf
    and the root becomes the facade - keeps compatibility but inverts which
    module names the namespace.
