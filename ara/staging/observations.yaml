  provenance: ai-suggested
  content: >
    A composite test fixture built by composing component generators must
    have its published expectation re-derived from the composed artifact, not
    from the components that built it. A check that re-runs the component
    enumerators with the same comprehension shape is an identity, not an
    oracle: it catches ordering and typing drift between components but is
    blind to whether the composition applied them at all. The workable
    inverse is to subtract one component from the artifact and require the
    system to report the next one — for a two-defect mutant, revert the head
    defect and require the checker to reject at the tail — which reduces the
    composite's obligation to a prediction the component is already
    independently gated on.
  context: >
