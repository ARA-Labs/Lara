  content: >
    When a mechanized definition already has a language mirror pinned by a
    cross-language golden, the cheapest way to give it a production observable
    is to call that mirror from the shipped path — not to reimplement it where
    the production traversal happens to be. Reuse makes the shipped output the
    same artifact the golden pins; a fused reimplementation would owe its own
    agreement argument against the mechanization, adding a drift surface the
    accountability claim then has to carry. The price paid instead is
    recomputation, which is safe exactly when the recomputed oracle is a pure
    function of arguments the checker already fixed.
  context: >
    N315. Issue #204's first phrasing was to fuse collection into
    `inferSupport`'s traversal; the landed design calls
    `Lara.Strict.Deps.certDeps` from `Lara.Driver.unitCertDeps` instead. The
    same purity argument `assuranceError` uses for re-asking the oracle on the
