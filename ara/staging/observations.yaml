- id: O91
  timestamp: "2026-08-26T16:22"
  provenance: ai-suggested
  content: >
    The forcing runs one way only. conflictComplete constrains which edges
    must be present; it does not say an edge implies contrariety between its
    endpoints' conclusions. Reading Attack.HasAttack: only rebut matches the
    source conclusion against the target's conclusion. Undercut matches
    against an exception pattern for a rule occurrence inside the target and
    needs no contrary at all; undermine matches against a leaf proposition
    inside the target. Both produce edges invisible to a conclusion labelling.
    A sufficiency proof must therefore *construct* attacks behind an edge
    rather than read them off the labels, which is a strictly harder
    obligation than the necessity direction and is where an M1 attempt is
    most likely to fail.
  context: >
