  provenance: ai-suggested
  content: >
    What caps a mutation-localization metric at ceiling is where the ground
    truth is validated, not how the defects are structured. If the answer key
    is gated against the system under test before it is published, the metric
    is confirmatory by construction no matter how adversarial the inputs are:
    a disagreement between key and system fails the generation gate rather
    than lowering the score, so the failure mode the metric was built to
    detect is precisely the one it cannot report. Enriching the input
    distribution (off-site manifestation, multiple defects, cross-stage
    composition) strengthens what the gate asserts but cannot make the number
    move; only ground truth established independently of the system — or a
    measured population admitted without that gate — can. The corollary for
    reporting: such a suite's contribution is stated as the content of its
    gate, and quoting its rate as accuracy evidence is a category error.
  context: >
    #167 review of the #123 discriminating-localization benchmark. C23
    predicted the off-site and multi-defect families would detach
    location_match from 100%; they do not, because prop_siteMatchesChecker
