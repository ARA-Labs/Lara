- id: N313
  type: decision
  title: "Prove #196 by longest-candidate + sublist comparison, not by the maximal-element principle the issue budgeted"
  provenance: ai-suggested
  timestamp: "2026-09-06T14:10"
  choice: >
    Close #196 (general non-emptiness of preferred extensions) by taking a
    maximum-LENGTH admissible member of `(candidates F).filter (admissibleB F)`
    and meeting a competing admissible `T` at its canonical representative
    `canonize F T`, where `List.Sublist.filter` places the maximum inside the
    competitor as a *sublist* rather than as a subset; `List.Sublist.eq_of_length`
    then forces equality. The only new machinery is `exists_max_length`, a
    ten-line finiteness principle in `Lara/Semantics/Sublists.lean`.
    Consequence: the theorem needs no `F.args.Nodup` hypothesis and no Mathlib,
    so the Mathlib-dependency decision the issue expected to force was not
    forced and stays scoped to result 5 as `lean/lakefile.toml` records.
  alternatives:
    - "The route #196 and preferredSem's docstring specified — a ⊆-maximal-element principle over `candidates F`, requiring `F.args.Nodup` plus a subset-implies-shorter fact. Rejected once the sublist framing compiled: `Nodup` is only needed to stop a shorter list from having the same members as a longer one, and a shared carrier already rules that out."
    - "Take the Mathlib dependency the lakefile anticipates for result 5, and import its order/Finset machinery. Rejected: it buys nothing here and would make a core-Lean development depend on Mathlib for a result that does not need it."
    - "State the existence result only for duplicate-free carriers, matching how `groundedSem_singleton` is stated. Rejected: the hypothesis turned out to be unnecessary, and a needless hypothesis on a headline existence theorem is a weaker paper sentence."
  evidence:
    - "lean/Lara/Semantics.lean: preferred_exists, preferred_exists_candidate, preferredSem_enumerate_ne_nil, admissible_nil"
    - "lean/Lara/Semantics/Sublists.lean: exists_max_length"
