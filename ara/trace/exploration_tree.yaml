- id: N199
  type: decision
  title: "lara-syntax@0.8: premise labels as a third name class, split out from the nd@1 feature"
  provenance: user
  timestamp: "2026-08-21T04:00"
  choice: >
    Land #131 alone as lara-syntax@0.8 rather than bundling it with #132's
    named nd@1 proof terms, and give a certificate premise reference a THIRD
    name class: the premise label the citing rule declares for that slot, sat
    beside the @0.6 declared-leaf and prior-argument classes under the
    unchanged `(prem s)` spelling. Cross-class collision is a hard error
    (CertSlotLabelAmbiguous) even when both classes would resolve to the same
    slot, and CertSlotUnresolved gains the citing RuleId so the message can say
    whose labels were consulted. Labels are per-rule, not per-policy: a nested
    instance's certificate resolves against its own rule's labels, never the
    enclosing one's. The plan's own no-combine constraint drove the split -
    #131 is S-M and #132 is L with its own Lean mechanization, so bundling
    would hold the small feature hostage to the large one.
  alternatives:
    - "Let the label win on a cross-class collision - rejected: it reintroduces the silent preference #129 removed from the discharge resolver."
    - "Carve out agreeing referents (allow the collision when both classes name the same slot) - rejected: whether `base` is ambiguous would then depend on which slot a leaf elsewhere in the artifact happens to fill, which is invisible from the citing line. It would be the first conditional case in an otherwise uniform collision policy; relaxing later is additive, tightening later would be breaking."
    - "Make labels replace the leaf/prior namespace - rejected: labels are optional (`rulePremiseLabels :: [Maybe PremiseLabel]`), so they cannot be universal; a third class beside the other two keeps every pre-@0.8 rule cited exactly as before."
    - "Bundle #131 and #132 into one release - rejected by the plan's split; recorded here because it was the live alternative."
  evidence:
    - "docs/lara-surface-grammar.md Appendix G"
    - "commit 567b639 (resolver + error plumbing)"
    - "commit df2c832 (recursion, conservativity and message pins)"
    - "commit 2384dae (Appendix G, rejection surface, version sweep)"
    - "PR #141"
