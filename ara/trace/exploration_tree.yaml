- id: N183
  type: dead_end
  title: "A prover-local source-identifier classifier cannot faithfully mirror the Haskell lexer"
  provenance: ai-executed
  timestamp: "2026-08-13T22:16"
  hypothesis: >
    Extend Lean's numeralTypo predicate so every reference that cannot start a
    source identifier is rejected before resolver consultation, using Lean's
    local character predicates to recognize valid names.
  failure_mode: >
    The concrete attempt exposed two independent drifts. First, Lean's
    Char.isAlpha is ASCII-only while Haskell Data.Char.isAlpha accepts legal
    Unicode letters such as é, so a prover-local classifier rejected a source
    identifier that Haskell resolved. Second, a numeric-looking-only guard left
    punctuation starts such as #x resolver-reachable, again allowing a
    failure-to-success flip under an all-resolving resolver.
  lesson: >
    Refusal order is not enough when the refusal predicate itself is duplicated
    across runtimes. The executable mirror must receive the production lexical
    decision as data unless both character libraries are proved extensionally
    equal on the supported input domain.
  evidence:
    - src/Lara/Syntax.hs
    - src/Lara/Elaborate/CertSlots.hs
    - lean/Lara/CertSlots.lean
    - test/CertSlotsSpec.hs
  also_depends_on: [N181, N182]
  status: resolved

