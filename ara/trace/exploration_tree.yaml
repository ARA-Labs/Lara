- id: N339
  type: decision
  title: "Ship the occurrence-local instance, or the milestone proves nothing new"
  provenance: ai-executed
  timestamp: "2026-09-08T14:10"
  choice: >
    Build `occRel F` — the identity restricted to `occurrences F` — and derive
    `backend_replacement_parametricity_local` and `_local_sem` from it. The plan's eng review
    had already established why this is not optional polish: `relInj_functional` shows
    `RelInj R` makes `R` a partial FUNCTION as well as injective, so `RelFrag R F₁ F₂` always
    exhibits some total injective `f` with `F₂ = mapAssurFrag f F₁`, and every conclusion the
    relational theorem reaches is already reachable through the existing
    `backend_replacement_congruence` — EXCEPT that such an `f` must satisfy `AssurPreserving f`
    globally and no such extension need exist. The localized hypothesis is therefore the
    milestone's entire mathematical content, and without an instance the PR would ship a
    quantifier shape and demonstrate nothing.
  alternatives:
    - "Ship only the graphOf-instantiated theorems — rejected: relPreserving_graphOf collapses RelPreserving back to the global AssurPreserving, so every instance would run through the very hypothesis the result claims to weaken."
  evidence:
    - "lean/Lara/Context/Parametricity.lean (occRel, relFrag_occRel, backend_replacement_parametricity_local, backend_replacement_parametricity_local_sem)"
