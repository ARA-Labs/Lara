- id: N327
  type: decision
  title: "Parameterize the projection, not the semantics: Outcome α + obsGen"
  provenance: ai-executed
  timestamp: "2026-09-07T16:20"
  choice: >
    Introduce `Outcome α` and
    `obsGen (g : Invariants.StructuredAF → Atom → α)` beside the frozen
    `Observation`/`obs`, so that what varies is the *projection read off the
    linked carrier*, not the semantics. `obs` is `obsGen` at
    `g := Invariants.status canon`; `obsSem sem` is *defined* as
    `obsGen (Invariants.observeSem sem canon)`. The congruence is then proved
    once, in `obsGen_congr`, and `backend_replacement_congruence_sem`,
    `registry_swap_congruence_sem` and
    `backend_replacement_congruence_composed_sem` are one-line instantiations.
    This converts what would have been a docstring remark — that the congruence
    was never a fact about the grounded labelling — into a proved statement.
  alternatives:
