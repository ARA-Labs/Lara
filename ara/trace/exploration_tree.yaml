- id: N328
  type: experiment
  title: "The generic congruence needs no AttackExtensional hypothesis — the issue's cost estimate was wrong"
  provenance: ai-executed
  timestamp: "2026-09-07T16:30"
  result: >
    `obsGen_congr` carries exactly `backend_replacement_congruence`'s
    hypotheses and no others — no `AttackExtensional sem.spec`, no hypothesis on
    `sem` or on `g` at all — and typechecks with the grounded proof unchanged
    apart from the projection identifier. The reason is structural: every M4
    congruence funnels through `compileUnit_link_relabel`, whose conclusion is
    `Invariants.compileUnit acc₂ = Invariants.compileUnit acc₁`, an *equation*
    between carriers rather than a pointwise agreement. `Observation.observe_congr`
    needs `AttackExtensional` because it moves an observation between two
    *distinct* frameworks agreeing pointwise; here the frameworks are equal, so
    no such licence is needed. A generic result that assumed `AttackExtensional`
    anyway would have been strictly weaker than its grounded ancestor. The `Nodup`
    obligation of `ExtensionSemantics.sound` likewise discharges unconditionally,
    by `List.nodup_range`, since `eraseAF`'s carrier is `List.range` by
    definition — the same discharge `Lara.Observation` already makes three times.
    Gates at commit 225cac8: `lake build` 154 jobs exit 0, coverage passed with
    37 declarations, axiom audit passed, zero `sorryAx` and zero `ofReduceBool`.
  evidence:
    - "lean/Lara/Context/Observation.lean:271 (obsGen_congr)"
    - "lean/Lara/Context/Equivalence.lean:586 (compileUnit_link_relabel), :629"
    - "lean/Lara/Observation.lean:406 (observe_congr, which does take hext)"
    - "lean/Lara/Invariants/Observation.lean:90 (observeSem_grounded, no hypothesis)"
    - "ara/evidence/proofs/m4_generic_observation.md"
    - "https://github.com/ARA-Labs/lara/pull/271"
  status: resolved
  also_depends_on: [N327]

- id: N329
  type: decision
  title: "The disagreeing fixtures had to be authored: every pre-existing M4 carrier agrees across all five semantics"
  provenance: ai-executed
  timestamp: "2026-09-07T16:40"
  choice: >
    Build two new links rather than reuse `Examples.Linking`'s. A three-cycle
    (`p ⊣ q`, `q ⊣ s`, `s ⊣ p`; context declares `q`, fragment declares `p` and
    `s` plus the one same-side edge, exports `p`) on which `stableSem` observes
    `ClaimObservation.noExtension` where `groundedSem` observes `contested`; and
    a sink (`p ⊣ q`, `q ⊣ p`, both attacking `s`; fragment exports `s`) on which
    `groundedSem` observes `contested` and `preferredSem` observes `defeated`.
    The agreement of the pre-existing carriers is *proved*, not assumed:
    `obsSem_linking_agrees` and `obsSem_sym_agrees` each pin all five mechanized
    semantics. Each separation carries a disequality conjunct so a collapse is a
    build failure, and each carrier is pinned (`cycle_linked_shape`,
    `sink_linked_shape`) so a fixture that stops linking is distinguishable from
    a separation that collapsed.
  alternatives:
    - >
      Reuse `symCtx`/`symFrag`, the existing two-cycle. Rejected on evidence:
      its observed claim is supported by a node *inside* the cycle, so every
      semantics accepts it in some extension and rejects it in another and the
      skeptical reading is `contested` under all five. The sink observes a node
      *outside* the cycle that every preferred extension attacks — that
      asymmetry is what the separation needs.
    - >
      Ship generic definitions plus the grounded regression only. Rejected: it
      would leave the milestone open to the question that motivated #216, one
      level up — you generalized the observation, but did you show the
      generalization observes anything new?
  evidence:
    - "lean/Lara/Examples/ContextSemantics.lean (obsSem_cycle_stable_ne_grounded, obsSem_sink_preferred_ne_grounded, obsSem_linking_agrees, obsSem_sym_agrees)"
    - "lean/Lara/Examples/Semantics.lean:185 (stableSem_enumerate_threeCycle)"
    - "commit 02a64fd"
    - "ara/evidence/proofs/m4_generic_observation.md"
  status: resolved
  also_depends_on: [N327, N328]

