- id: N327_lara_sources
  type: decision
  title: A world may be a .lara program; the Lean reference reads it through the lara pw-input derivation door
  provenance: ai-suggested
  timestamp: 2026-09-12T01:38+00:00
  choice: 'SOURCE gains (lara PATH). lara pw elaborates it through the .lara door''s own
    steps and uses the bound envelope, re-read through decodeCheckInput; everything that
    stops the program before an envelope exists (unreadable, unparsable, source invalid,
    admission stop, policy quarantine) is world-input, so the fault set does not grow.
    pw-run reports a lara source as world-input. lara pw-input prints the same document
    with every source inline, and the gate compares lara pw on the original with both
    drivers on the derived document, in the style of lara map-input. pw-run 1 keeps its
    version: an added production moves nothing an old reader accepts, and an old reader
    refuses it as malformed world-source.'
  alternatives:
  - 'Bump to pw-run 2: forces every existing document and consumer to change for a
    production they need not use.'
  - 'A Haskell-only .lara door without a derivation: the differential could not cover it.'
  - 'Hand the elaborated CheckInput to the loader directly instead of re-encoding: the
    in-process path and the derived path would no longer agree by construction.'
  evidence:
  - src/Lara/PW/Run.hs
  - app/Main.hs
  - lean/Lara/PW/RunMain.lean
  - fixtures/pw/source/lara.sexp
  status: resolved
  also_depends_on:
