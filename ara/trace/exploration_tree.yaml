  - id: N29
    type: decision
    provenance: user
    timestamp: "2026-07-22T09:30"
    support_level: explicit
    source_refs: ["user directive 2026-07-22", "m0/annotation-summary.md §2"]
    title: "Exercise rebut/undermine via self-authored adversarial reports, not corpus extraction"
    choice: >
      The corpus consists of published, peer-reviewed top-venue papers (NeurIPS/ICML/ICLR
      class) whose polished traces contain essentially no genuine rebuts/undermines. Rather
      than mining the reserve for them, we author adversarial reports / attack cases against
      corpus claims ourselves when testing the language — extending the existing
      rejection-class negative-test discipline to the defeat layer.
    alternatives:
      - "Mine the rebench reserve for naturally-occurring rebuts/undermines — rejected by user: not realistically extractable from top-quality published work"
    evidence: "m0/annotation-summary.md §2 typed-attack profile (4 undercut / 0 rebut / 0 undermine / 190 none)"

  - id: N30
    type: decision
    provenance: user
    timestamp: "2026-07-22T10:37"
    support_level: explicit
    source_refs: ["docs/spec.md §7, §11 task 6", "commits d3902a4, bd78a37 (PR #9)"]
    title: "dead_end nodes lower to support OR attack — elaborator per-node judgment, kernel-agnostic"
    choice: >
      A dead_end trace node may lower to a support leaf/argument instead of a typed attack
      (restricted_mlm C14: a failed line of attempts IS a negative-result claim's primary
      evidence). The choice is the untrusted elaborator's per-node judgment, audited on the
      faithfulness axis. The kernel treats a dead-end-derived leaf as an ordinary
      observed/attested leaf — kernel-invisible, but audit-distinguishable via its refs
      binding to the source dead_end node (provenance never carries logical force, spec §3).
      The refs-distinguishability refinement was affirmed after an explicit logic-theory
      consistency check requested by the user.
