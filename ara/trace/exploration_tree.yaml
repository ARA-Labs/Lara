      - id: N287
        type: dead_end
        provenance: ai-executed
        timestamp: 2026-09-03T04:45
        title: Partial observation is not the right account of contextual rejection
        hypothesis: >
          Observation should be undefined both when the link guard fails and when the checker
          rejects, with admissibility justified by avoiding a definedness mismatch.
        failure_mode: >
          The shared none result made structurally incompatible links observationally equal to
          compatible units rejected by the checker, so CtxEquiv erased which semantic boundary
          failed.
        lesson: >
          Preserve incompatibility, checker rejection, and accepted statuses as separate
          constructors. Admissibility remains load-bearing under forward-only acceptance, but
          because it puts both sides in observed outcomes, not because observation is partial.
