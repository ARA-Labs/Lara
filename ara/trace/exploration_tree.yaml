          acceptance-profile generalization, as it had witnessed the guard, the saturation, the
          merge and the gap-flip.
        failure_mode: >
          A fragment with no assurance is a fixed point of mapAssurFrag for EVERY relabel, so
          congruence_witness reduced to obs X = obs X, and the D6 witness discharged an acceptance
          hypothesis about certificate occurrences on a fragment that had none. Both were accepted
          by the axiom audit and by two prior reviews; only the final integration review, told to
          hunt for vacuity, caught it.
        lesson: >
          For a theorem about certificates, a witness is non-vacuous only if the fixture carries
          one. The repair — a certificate-bearing split, a backend core that renames certificates,
          and a proof that the relabel is not the identity (cert_relabel_moves) — is also the first
          concrete instance of result 9's model in the development.
        status: resolved
      - id: N284
        type: experiment
        provenance: ai-executed
        timestamp: 2026-09-02T23:25
        title: A real backend swap, witnessed
        description: >
          Built a certificate-bearing fragment whose HasSupport is assembled relationally from
          Examples.registry_exact_digest_accepts rather than by evaluating the checker; a backend
          core that unwraps a wrapped certificate before replaying (renameCore, every field passing
          through because the obligations all precompose with the same function); and certSwap,
          which wraps every nd certificate payload.
        result: >
          certSwap is injective (certUnswap is its left inverse) and acceptance-preserving by
          construction; cert_relabel_moves proves it is not the identity on the fragment; and
          cert_congruence_witness applies the headline to it. AxCheck rose to 204 M4 entries after
          the generator was fixed to see theorems indented inside mutual blocks; 1911 audited
          declarations library-wide, audit PASS.
        evidence:
          - lean/Lara/Examples/Linking.lean
          - ara/evidence/proofs/m4_contextual_adequacy.md
        status: resolved
      - id: N285
