- id: N273
  type: decision
  title: "PW0's executable comparison renamed compare -> crossCompare"
  provenance: user
  timestamp: "2026-09-02T00:00"
  choice: >
    Rename the executable comparison from Lara.PW.compare to
    Lara.PW.crossCompare, keeping the nine compare_* theorem names unchanged.
    Core exports Ord.compare into the root namespace, so under open Lara.PW a
    plain compare loses in three ways measured on this branch: `unfold compare`
    fails with "ambiguous term, use fully qualified name", a bare @compare
    reports "Ambiguous term", and an unapplied compare silently resolves to
    Ord.compare. Ordinary applications were never at risk, since argument shape
    disambiguates. The deciding factor is that the T5 proofs reason about
    unfolding this definition and T6 (#191) will be a downstream module that
    opens Lara.PW, so the collision would land on the next module written
    against the interface. The repository declares no Ord instance anywhere, so
    nothing is conceded by leaving compare to core, and the name map records
    that no paper display cites the key yet, so the rename is free now and
    would not be later.
  alternatives:
    - "Keep the name and document the collision, spelling Lara.PW.compare where the shape does not decide."
    - "Also rename the nine compare_* theorems for prefix consistency, at the cost of churning nine audit lines and four name-map rows."
  evidence:
    - "measured before: `unfold compare` -> ambiguous term; `@compare` -> Ambiguous term; bare `compare` -> Ord.compare"
    - "measured after: `unfold crossCompare` resolves, leaving the match unreduced as the proof note documents"
    - "lean/Lara/PW/Compare.lean: crossCompare"
    - "docs/paper-lean-name-map.md: Naming note"
    - "lake build 127 jobs PASS; axiom audit 1612 declarations PASS"
  status: resolved
  also_depends_on: [N271, N272]

- id: N274
  type: decision
  title: "Axiom audit hardened against silently reduced coverage"
  provenance: user
  timestamp: "2026-09-02T00:00"
  choice: >
    Close a hole in the project's central soundness gate, found while renaming
    Lara.PW.compare. A `#print axioms` line naming a declaration that does not
    exist does not remove a report: Lean emits an "Unknown constant" error and
    every other line still reports normally. check-axioms.sh inspected only the
    surviving reports, found nothing wrong with them, and printed "Axiom audit
    passed."; CI compounded this by invoking the pipeline WITHOUT set -o
    pipefail, contrary to the script's own documented usage, so the pipeline
    returned the filter's status and Lean's exit 1 was discarded. Reproduced
    end to end: a file with two bad names exited 0 and reported passed. So a
    theorem could leave the audited set by rename, deletion, or typo and CI
    would stay green over the reduced set. Fix in two independent layers: CI
    now uses the documented pipefail form, and check-axioms.sh itself rejects
    any input containing a Lean error diagnostic, matched on Lean's
    file:line:col shape so that routine linter warnings and the several audited
    theorems with "error" in their names are unaffected. The script-level check
    is what covers the saved-output invocation, where no producer status exists.
  alternatives:
    - "Add set -o pipefail to CI only, leaving the saved-output path unguarded."
    - "Compare the report count against the number of #print axioms lines, which the script cannot see from stdin alone."
  evidence:
    - "before: bash -e -c 'lake env lean bad.lean | check-axioms.sh' -> Axiom audit passed., exit 0"
    - "after: exit 1, offending constants named on stderr"
    - "script-only, no pipefail (saved-output path): exit 1"
    - "scripts/check-axioms.sh, scripts/test-check-axioms.sh (4 new regression cases, 14/14 pass)"
    - ".github/workflows/ci.yml: axiom audit step"
    - "real audit unaffected: 1612 declarations, exit 0"
  status: resolved
  also_depends_on: [N273, N271]

