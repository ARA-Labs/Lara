    segment may now name a rule's premise LABEL (a2.binding.leaf) beside the
    integer spelling (a2.1.leaf), and printProgram :: Program -> String never
    receives the Policy, so the printer cannot choose between the two spellings.
    Recording the authored spelling in the presentation AST is the only option
    that does not make a program file's canonical form depend on a different
    file.

    User signed off, and additionally chose to implement §3.5 in this track
    rather than take the plan's detachable-tail option. The amendment text is
    appended to §7 (not rewritten into it), records the SurfaceStep resolution,
    and states the scope: strictly additive, integer spelling unchanged and
    still canonical for unlabelled premises, and no Unit-reachable type moves.
  alternatives:
  - Detach §3.5 into its own PR and ship D1-D6 first (the plan's own sequencing; rejected as unnecessary once signed off)
  - "Have the printer consult the policy (rejected: makes a program file's canonical form depend on a separate file)"
  - "Pick one spelling as canonical and lose the other's round-trip (rejected: breaks spec result 12 for whichever is not chosen)"
  evidence:
  - docs/lara-surface-grammar.md
  - plans/2026-08-08-lara-syntax-03-surface.md
  status: resolved

- id: N132
  type: dead_end
  title: "A determinism-of-elaboration theorem is not reachable in the Lean development"
  provenance: ai-executed
  timestamp: "2026-08-08T01:35"
  hypothesis: >
    The user asked to "mechanize the theory proofs" and selected, from an
    explicit menu, "D8 plus an elaboration-invariant theorem" -- stated as:
    comparison expansion is deterministic given (scheme, polarity, θ), so the
    elaborator cannot flip an argument order without flipping which system the
    bridge concludes is better.
  failure_mode: >
    Three structural obstacles, all verified before any code was written.
    (1) lean/Lara/Presentation.lean is a closed island: its SupportTerm and
    Policy are wholly distinct inductives from the checker's
    Lara.Support.SupportTerm / Lara.Policy.Policy, and NOTHING maps
    Presentation.Program -> Unit. Its only consumer anywhere imports three
    enums for admission table keys. (2) There is no Lean Unit reachable from
    Presentation: the Lean entry point is the wire decoder Lara.Driver.decodeUnit
    on an ALREADY-ELABORATED .sexp, and Driver.lean calls itself "a THIN decode
    -> call -> encode shim". (3) Lara/Admission.lean:16 explicitly excludes the
    elaborator from what Lean proves ("the concrete .lara parser, the structural
    elaborator, and the replay identity are validated by Haskell tests").
    Reaching the literal statement would require defining a Lean elaborator and
    validating it differentially against the Haskell one -- a project of its own,
    outside what the plan authorises.
  lesson: >
    The Haskell<->Lean anchor in this development is the SERIALIZED
    POST-ELABORATION Unit, not the surface program. Any proposed theorem about a
    surface-to-Unit transformation has to cross that anchor and therefore needs a
    Lean elaborator first. Check what the mechanization's entry point actually is
    before promising a theorem about a stage that sits upstream of it.
  status: resolved

- id: N133
  type: decision
  title: "Mechanize the direction-of-goodness contract instead, and say plainly what it does not cover"
  provenance: ai-suggested
  timestamp: "2026-08-08T01:44"
  choice: >
    Substituted a reachable theorem for the unreachable one and disclosed the
    narrowing to the user rather than delivering something that merely sounds
    like what was asked. lean/Lara/Comparison.lean states Appendix B.3's 2x2
    lookup table as goalOf and the intended research meaning as Better --
    SEPARATELY, so their agreement is a real statement rather than a
    restatement. goalOf_iff_better proves the generated ord@1 goal holds exactly
    when "ours is better than base" under the measurand's declared polarity.
    goalOf_polarity_swap and goalOf_polarity_mismatch_excl turn plan §1.2's
    hazard into formal statements: the two polarities generate the SAME relation
    on TRANSPOSED operands, and under a strict relation both can never hold, so
    a mis-declared polarity certifies the OPPOSITE claim rather than a weaker
    one. better_atLeastAsGood_antisymm covers the S3 tie.

    The module docstring states what is NOT proved: nothing here says the
    Haskell elaborator maps a comparison block to goalOf's output. The
    elaborator stays validated-not-verified, exactly as the .lara parser already
    was. This is the §1.2 correctness hazard the comparison form exists to
    close, not a proof about the compiler.
  alternatives:
  - Attempt the full Lean elaborator port (out of scope; would need differential validation against Haskell)
  - "Silently deliver a weaker theorem under the requested name (rejected: misrepresents what was proved)"
  - "Skip the Lean work and rely on Haskell tests alone (rejected: the user asked for mechanization)"
  evidence:
  - lean/Lara/Comparison.lean
  - lean/AxCheck.lean
  also_depends_on: [N132]
  status: resolved

- id: N134
  type: decision
  title: "Premise labels ride beside the frozen Rule type, not inside rulePremises"
  provenance: ai-suggested
  timestamp: "2026-08-08T02:00"
  choice: >
    Plan §3.5 says rule premises "gain optional labels", but rulePremises ::
    [AtomPat] lives on Rule, and Rule is copied VERBATIM into unitRules -- it is
    Unit-reachable and frozen, so changing that field's type would break the
    byte-identity invariant the whole plan rests on. The plan did not anticipate
    this.

    Labels landed instead as a parallel rulePremiseLabels :: [Maybe
    PremiseLabel], positionally aligned with rulePremises. Byte-drift is
    STRUCTURALLY impossible rather than incidentally absent: Wire.encodeRule
    enumerates its eight encoded fields explicitly, so the new field is not
    encoded and decodeRule fills []. Belt and braces, Elaborate.stripPremiseLabels
    clears labels on the way into Unit, which makes App. B.4's claim "labels
    never enter Unit" true of the VALUE and not only of the bytes.
  alternatives:
  - "Change rulePremises to [(Maybe PremiseLabel, AtomPat)] (rejected: mutates a Unit-reachable frozen type)"
  - "Keep labels in a side table keyed by RuleId (rejected: separates a rule from its own labels, and the WF check needs both)"
  evidence:
  - src/Lara/AST.hs
  - src/Lara/Wire.hs
  - src/Lara/Elaborate/Internal.hs
  status: resolved

