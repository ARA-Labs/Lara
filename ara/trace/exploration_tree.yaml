    Contingency moot. The headline is Compile.srcStatus_iff_checked (SrcStatus P c s <->
    s = statusC (checkedAF P) c), oracle-free: SrcIn/SrcOut/SrcStatus are defined over the
    Prop-level Edge relation (no AF, no iteration), and the Faithful oracle is discharged
    constructively by edgeB_faithful. Grounded.status_preservation is only the abstract-AF
    core (both sides read the same F.attack) and must never be cited as the headline.
    Issue #68's pointer "Compile.lean:606" for the scope note is a typo — it lives in
    Grounded.lean (module header + status_preservation docstring). B1 (deterministic
    terminating replay) has no separate termination lemma: replayFull is a total Lean
    function into Bool, so the paper states totality + adequacy (replayFull_iff).
    Strict-chain hypothesis = Policy.WellFormed over Policy.StrictReachable, quoted
    verbatim. All ~60 mapped declaration names spot-checked; every headline theorem
    already AxCheck-gated. Deliverable docs/paper-lean-name-map.md; PR #72.
