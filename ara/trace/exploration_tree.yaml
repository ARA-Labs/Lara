- id: N244
  type: dead_end
  title: "Per-literal string lemmas for in-kernel ord@1 acceptance"
  provenance: ai-executed
  timestamp: "2026-08-29T15:40"
  hypothesis: >
    Scope decision S1 chose the literal reading: hand-prove per-literal String
    lemmas in the style of Lara.ND.decodeNat_repr so that a real ord@1 numeric
    certificate would be accepted inside the Lean kernel, giving a worked mixed
    acceptance over shipped backends only. The plan budgeted about a day and
    attached an explicit escape hatch.
  failure_mode: >
    ord@1 acceptance routes through Cell.parseDecimal to parseUnsigned to
    String.splitOn, and through parseCanonInt to String.startsWith. Under Lean
    4.32's Slice-based String API those are kernel-opaque. Direct probes on
    literal goals such as "28".splitOn "." = ["28"] and "28".startsWith "-" =
    false were rejected by rfl, decide, simp, exact? and grind; unfolding
    String.splitOnAux diverges to max recursion depth. native_decide would
    close the gap and is forbidden - it adds Lean.ofReduceBool and appears
    nowhere under lean/. Only String.toNat?, string-literal equality,
    String.toList and String.length reduce per literal.
  lesson: >
    The Lara.ND.decodeNat_repr precedent generalizes to String.toNat? and to
    nothing else in the Slice-based API. A milestone that needs in-kernel
    evaluation of a shipped decoder must first check which String primitives
    that decoder's path actually touches - the reducible and irreducible ones
    sit next to each other in the same parser. Probing four primitives cost
    minutes and redirected the milestone; assuming the precedent generalized
    would have cost days.
  evidence:
    - "lean/Lara/Cell.lean: parseCanonNat, parseCanonInt, parseUnsigned, parseDecimal"
    - "lean/Lara/ND.lean:112-131: decodeNat_repr, decodeNat_leading_zero_01"
    - "lean/Lara/Examples.lean:368-376: the pre-existing resolution-layer note"
    - "scripts/check-axioms.sh: standard trio only"
  also_depends_on: [N243]

