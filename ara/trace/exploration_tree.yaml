    defendedAuxC, stepC, iterC, labelCC, and statusCC against the plan's
    universal cubic floor, pinned quartic witness, and status upper bound.
  result: >
    All three planned statements fail. A family where the first carrier node
    attacks every target costs n^2, below the claimed universal n^3 floor for
    every sampled n from 2 through 8. The pinnedAF counts are 2107 at n=7 and
    3136 at n=8, below n^4 = 2401 and 4096 respectively: an undefended target
    short-circuits after its first attacker, so the family is cubic rather than
    quartic. A three-block family that does attain quartic grounded cost also
    refutes the proposed exact status bound at carrier size 24 and support
    length 48: 30,978,584 counted queries versus the stated bound 25,272,600,
    because labelC's repeated grounded calls were not priced consistently.
