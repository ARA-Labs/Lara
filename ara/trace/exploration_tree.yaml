- id: N311_vacuous_obligations
  type: dead_end
  title: >-
    Stating a bridge's undecidable clauses as a hypothesis over the shared
    fixture Gamma
  provenance: ai-executed
  timestamp: 2026-09-10T09:30-07:00
  parent: N307_surface
  also_depends_on:
  - N307_clause_checkability
  hypothesis: >-
    The two T6 clauses the elaborator cannot decide can be exhibited by a theorem
    that takes `BridgeObligations` as a premise over the existing `Examples.PW`
    fixture, whose two contexts share `Gamma := ΓEx`. Stating the premise rather
    than discharging it was defended in the docstring as "the honest shape — a
    caller with a different `Gamma` owes a different proof".
  failure_mode: >-
    The premise is unsatisfiable at that fixture, so the theorem is vacuous while
    reading as evidence. `ΓEx l3 = s()`, and the declaration renames only `p` and
    `q`, so `trAtom` on the leaf's atom is `none` and no witness can satisfy
    `leaf_ok`; `l1` fails independently because the renamed leaf `l2` carries
    `q()` where the translated `p()` is required. No `StructuralBridge` was
    exhibited anywhere in the PR, and `elabBridge_support_transport` was never
    instantiated — while the theory record presented both as established. Found
    by the #311 reviewer, who compiled `¬ BridgeObligations …` against the branch.
  lesson: >-
    A theorem that takes a contract as a *hypothesis* is not evidence the contract
    is inhabited, and at the type level a vacuous premise is indistinguishable
    from a discharged one. Where a fixture exists to show a construction fires, it
    must discharge the premise, not assume it. The repair was a `Gamma` pair
    *inside* the declared vocabulary, so `obligations_declOK` is a proof and
    `bridgeDeclOK` a real `StructuralBridge`; the same fixture then instantiates
    the transport theorem.
  status: resolved
- id: N311_located_and_independent
  type: decision
  title: >-
    Locate every fault and state each judgment independently of its own decider
  provenance: ai-executed
  timestamp: 2026-09-10T09:30-07:00
  parent: N307_surface
  also_depends_on:
  - N311_vacuous_obligations
  choice: >-
    Three changes taken together, all from the #311 review. (1) Every reported
    fault names its symbol: `PosingFault.bridgeVocabulary` carries an
    `OutOfVocabulary`, computed by `vocabFault` — `trAtom`'s own traversal —
    with `vocabFault_eq_none_iff` proving the scan is exactly `trAtom`'s domain
    condition, so no definedness theorem weakens. (2) Each independent judgment
    states its clause semantically rather than as its decider's success:
    `ElaboratesBridge.rule_ok` is T6's clause verbatim and `Elaborates.status` is
    `q.val = c`, with `ruleOkB_iff` and `pose_ok_val`/`pose_val_self` bridging to
    the executables — so sound/complete carry content instead of being bookkeeping
    over the remaining scan. (3) Data a declaration writes down is read:
    `BridgeEnv` carries `name`/`sourceName`/`targetName` and `elabBridge` checks
    them, with a `BridgeError` arm and a witness each.
  alternatives:
  - >-
    Soften the docstrings instead — say the judgment is independent of the
    *elaborator* only, and that context resolution is the caller's
  - >-
    Drop `BridgeDecl.id`/`.source`/`.target` as inert fields
  - >-
    Leave `bridgeVocabulary` unlocated, since `trAtom` returns a bare `none`
  evidence:
  - lean/Lara/PW/Sorted.lean
  - lean/Lara/PW/Surface.lean
  - ara/evidence/proofs/pw_sorted_queries_307.md
  status: resolved
