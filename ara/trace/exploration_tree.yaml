    core even though ord@1 acceptance is kernel-opaque, so the cross-language
    golden need not inherit the acceptance split.
  result: >
    It can. Support.stepDeps never calls acceptsFull; it needs only the rule,
    instAPats, the registry entry and resolveTheory to resolve, then maps
    Backend.uses over the reported slots. ord@1's ordUses routes through
    decodeCert to Cell.decodeSlot to parseCanonNat to String.toNat? - the one
    primitive that is provable per literal - and never reaches splitOn or
    startsWith. Probes confirmed parseCanonNat "0" = some 0, decodeSlot on
    (prem 0), and ordUses on an ordcmp certificate all reduce. So the golden
    computes over the shipped nd@1 and ord@1 cores on both sides, and the
    acceptance blocker does not weaken the milestone's strongest
    cross-language artifact.
  evidence:
    - "lean/Lara/Ord.lean: ordUses, decodeCert"
    - "lean/Lara/Cell.lean: decodeSlot, parseCanonNat"
    - "lean/Lara/Examples/BackendComposition.lean: depsMixedTerm_certDeps, depsMixedTerm_both_halves_nonempty"
