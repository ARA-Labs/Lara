  timestamp: 2026-08-01T18:05
  choice: An argument with an open mandatory obligation is an IncompleteArgument REJECTION (Check.checkArguments),
    so unmet-mandatory-CQ claims lower with NO arg (gap = empty complete support, M4a decision 8); unmet-defeater
    CQs lower as complete args undercut by leaf-rooted challenges concluding the rule exception; when
    both apply, gap pre-empts defeat (no arg to attack).
