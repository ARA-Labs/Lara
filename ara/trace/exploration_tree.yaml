- id: N249
  type: dead_end
  title: "unseal String.splitOnAux as an escape from kernel opacity"
  provenance: ai-executed
  timestamp: "2026-08-30T04:10"
  hypothesis: >
    A late reconnaissance report proposed that the obstruction to reducing
    String.splitOn on a literal is the irreducibility that well-founded
    recursion introduces, since core defines String.splitOnAux with a
    termination measure over byte positions. On that theory `unseal
    String.splitOnAux` would strip the seal, the literal would reduce, and
    scope decision S1's literal reading would collapse to a few lines - making
    the split-witness decision unnecessary.
  failure_mode: >
    It does not reduce. With the seal removed the goal "28".splitOn "." =
    ["28"] fails identically under rfl, and "3".splitOn "." = ["3"] fails
    identically under decide, with decide reporting the same stuck Decidable
    instance as before. The obstruction is therefore not - or not only -
    well-founded sealing, but String.Pos byte arithmetic over an opaque
    primitive, which unseal cannot touch.
  lesson: >
    Testing the cheapest proposed escape route is worth doing even after the
    decision it would have reversed has shipped, because the durable record
    asserted that route was expensive. The negative result strengthens the
    shipped decision instead of reopening it, and it saves the next reader the
    same experiment. Note also that the same report asserted no Lean toolchain
    existed on this machine and that String.splitOn was the sole blocker; both
    were wrong - the toolchain needed elan on PATH, and String.startsWith sits
    on the same parseDecimal/parseCanonInt path at Cell.lean:48 and :76.
    Confident reconnaissance still needs its load-bearing claims re-run.
  evidence:
    - "lean/Lara/Cell.lean:48,58,62,76 - the four core String primitive sites on the ord@1 path"
    - "docs/theory-b0-backend-compositionality.md: S1 section, unseal bullet"
    - "commit c1dfdee"
  also_depends_on: [N244, N245]

- id: N250
  type: experiment
  title: "M2b plan cost lower bounds refuted before implementation"
  provenance: ai-executed
  timestamp: "2026-08-30T00:08"
  description: >
