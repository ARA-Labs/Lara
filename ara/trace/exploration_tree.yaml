- id: N307_gap_collapse
  type: dead_end
  title: >-
    The planned four-way split of PW0's gap report
  provenance: ai-executed
  timestamp: 2026-09-09T20:10-07:00
  parent: N307_sorted
  hypothesis: >-
    PW0 limitation 2 names four conditions `gap` conflates — out of vocabulary,
    ill-sorted, not posed, posed but unsupported — so the refinement should
    report four distinguishable outcomes.
  failure_mode: >-
    Two of the four are not separable at the outer layer.
    `Grounded.statusC_gap_iff` already proves `statusC` gaps exactly on empty
    complete support, and every argument an accepted unit retains is complete
    (`Compile.CheckedNode.valid` carries the empty obligation list;
    `Unit.CheckedUnit.nodes_terms` ties nodes to `program.args`). So an addressed
    claim cannot gap at all, and "posed but unsupported" surfaces as
    `defeated`/`contested` rather than as a fourth gap cause.
  lesson: >-
    Limitation 2 is narrowed, not closed — four conflated conditions become two
    reported ones plus a proved collapse. Separating an incomplete attempt from
    an absent one needs `holes(P, p)` at the instance layer, which
    `Consistency.completeClaimFor` deliberately does not compute (N17 point 1),
    and computing it is a change to the *local* layer, which the wrapper's gate-1
    discipline forbids. The negative was written into three places — the new
    theory record, the PW0 record's limitation 2, and the name map's Not X notes
    — so a paper display cannot quietly claim closure.
  evidence:
  - ara/evidence/proofs/pw_sorted_queries_307.md
  - docs/theory-pw-sorted-queries.md
  - docs/theory-pw0-outer-model.md
  status: resolved
