- id: N30
  type: decision
  provenance: user
  timestamp: 2026-07-22T10:37
  support_level: explicit
  source_refs:
  - docs/spec.md §7, §11 task 6
  - 'commits d3902a4, bd78a37 (PR #9)'
  title: dead_end nodes lower to support OR attack — elaborator per-node judgment, kernel-agnostic
  choice: 'A dead_end trace node may lower to a support leaf/argument instead of a typed attack (restricted_mlm
    C14: a failed line of attempts IS a negative-result claim''s primary evidence). The choice is the
    untrusted elaborator''s per-node judgment, audited on the faithfulness axis. The kernel treats a dead-end-derived
    leaf as an ordinary observed/attested leaf — kernel-invisible, but audit-distinguishable via its refs
    binding to the source dead_end node (provenance never carries logical force, spec §3). The refs-distinguishability
    refinement was affirmed after an explicit logic-theory consistency check requested by the user.

    '
