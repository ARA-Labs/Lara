- id: N326_consistent_groups
  type: decision
  title: A PW world with agreeing duplicate-report groups is checked as declared; a conflicting group is refused by name
  provenance: ai-suggested
  timestamp: 2026-09-12T01:38+00:00
  choice: 'Option 1 of #326. addWorld refuses a world only when some declared group is
    not pairwise ≡ (first such group in declaration order, printed as (world-groups W G)),
    whatever the policy''s conflict mode: under quarantine the local status would be
    conditional (evidence-blocked), under reject the local checker would refuse the unit
    (R9); either way it is not an unconditionally checked unit. With every group consistent
    the §4.3 quarantine set is empty and both quarantine operations are the identity
    (Groups.quarantined_eq_nil, quarantineLeaves_nil, quarantineArgs_nil), so the loader
    checks the declared unit (addWorld_checks_declared). Groups stay outside the context
    environment. The fault gains the group id; the version stays 1.'
  alternatives:
  - 'Keep refusing every group-bearing world (status quo): sound but excludes artifacts
    where nothing is quarantined.'
  - 'A fifth outer observation for evidence-blocked: changes Sorted.cmpVal and every
    theorem over it, and needs a docs record first.'
  - 'Mirror the local driver''s R9 as world-rejected under reject mode: would move the
    group check after preflight and split one refusal into two spellings for one cause.'
  evidence:
  - lean/Lara/Groups.lean
  - lean/Lara/PW/Run.lean
  - ara/evidence/proofs/pw_groups_lara_sources_326_327.md
