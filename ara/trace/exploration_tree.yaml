      timestamp: 2026-07-21T22:45
      support_level: explicit
      source_refs:
      - m0/extract_claims.py parse_deadends
      - corpus rebench-triton_cumsum trace
      title: Trace-YAML parser keyed on 'id:'-first node order silently corrupts alphabetized-key artifacts
      hypothesis: 'Every trace node lists id: first, so flushing the current node on each id: line is
        a safe delimiter.'
      failure_mode: 'rebench-triton_cumsum alphabetizes keys inside each list item, so failure_mode/ hypothesis
        precede id and were attributed to the PREVIOUS node; one id-less node was swallowed entirely (278
        vs 279 raw count).

        '
      lesson: 'Hand-written corpus YAML has at least two key orders; delimit nodes on list-item boundaries
        and treat only a known key vocabulary as keys. Count-reconciliation against raw grep totals is
        what surfaced the bug — keep that check.

        '
  - id: N24
