  result: 'PR #328 reviews reproduced three places where lara pw and pw-run disagreed,
    because GHC encodes paths with the locale and Lean always uses UTF-8. (1) Under
    LC_ALL=C, a non-ASCII world path: Haskell exit 1 (world-input), Lean exit 0. Fixed
    in 3b865cb with a UTF-8//ROUNDTRIP file-system encoding. (2) That fix switched after
    getArgs had decoded argv, so under ISO-8859-1 a run file under café/ was looked up
    as cafÃ©/ (a regression from 502a564), and under LC_ALL=C a missing non-ASCII path
    crashed stdout mid-envelope. Fixed in e4c5e67: the argument is re-encoded to its
    bytes with the startup encoding and decoded as UTF-8, and stdout is UTF-8//ROUNDTRIP.
    (3) The gate''s ISO-8859-1 probe ran /usr/bin/locale, which Ubuntu 26.04 AppArmor
    confines; moved in-process in 676de58. Negative controls: the world-path case fails
    on the pre-3b865cb binary under LC_ALL=C, and 5 of 18 locale reruns fail on 3b865cb.
    The gate now reports 6 fixtures, 94 cases, 107 runs, with reruns under LC_ALL=C
    and a localedef-built ISO-8859-1. The same round added fault-order-within-stage,
    every-environment-field and renamed rule-clause cases. The shared reader''s Haskell-only
    nesting bound predates #322 and is issue #331.'
