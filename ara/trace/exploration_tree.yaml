- id: N154
  type: dead_end
  title: "Lean's theta-range check inspected terms at non-parameter keys"
  provenance: ai-executed
  timestamp: "2026-08-10T20:40"
  hypothesis: >
    That mirroring the Haskell theta-range check clause-for-clause was enough,
    and that the differential over 574 fixtures would surface any divergence.
  failure_mode: >
    Lean's thetaWellSorted resolved sortOf at EVERY theta key and consulted the
    rule's parameter list only afterwards, so an ill-sorted term at a
    NON-parameter key was R2 in Lean and R3 in Haskell. The differential stayed
    green because it is unreachable on the committed corpus: wrong-subst-domain
    renames a key but keeps the well-sorted term it was already bound to, so no
    fixture puts an ill-sorted value at an off-domain key.
  lesson: >
    A cross-driver differential proves agreement on the corpus, not agreement of
    the definitions — a class-boundary rule with no fixture that exercises it is
    unprotected by exactly the gate that looks like it protects it. Found by
    re-reading the two definitions side by side, not by any gate. Fixed and
    pinned with a dedicated CheckSpec negative (negR3OffDomainIllSorted) rather
    than left for the next mutation operator to discover, which is when it would
    have moved the 19 wrong-subst-domain mutants.
  evidence:
    - lean/Lara/Unit.lean
    - test/CheckSpec.hs
    - "commit: 8f49ffb"
  also_depends_on: [N152, N153]
  status: resolved

- id: N155
  type: dead_end
  title: "Assumed sort-respecting substitutions did not close result 13 over the checker"
  provenance: ai-executed
  timestamp: "2026-08-10T20:05"
  hypothesis: >
    That checkUnit_wellSorted established its advertised accepted-unit closure by
    quantifying over RuleSortRespecting substitutions inside the theorem.
  failure_mode: >
    The theorem assumed RuleSortRespecting for arbitrary substitutions and did
    not derive it from the executable thetaWellSorted check or from accepted
    support's exact-domain invariant. Its prose also named exception atoms even
    though the theorem's conjunction covered only premises, conclusions, and
    critical-question answers.
  lesson: >
    A checker soundness theorem must derive its semantic premise from executable
    checks and acceptance invariants. Its public claim must enumerate exactly the
    constructors present in the conclusion; a reusable per-pattern lemma is not
    itself whole-checker closure.
  evidence:
    - "PR #97 review comment 3754845825"
    - lean/Lara/Check/Unit.lean
    - lean/Lara/Sigma.lean
  also_depends_on: [N153]
  status: resolved

