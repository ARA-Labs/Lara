- id: N225
  type: dead_end
  title: "Empty defeat refutes a converse universal over fixed contexts"
  provenance: ai-suggested
  timestamp: "2026-08-26T17:46"
  hypothesis: >
    M1 can prove the requested fixed-context converse directly from M0's
    frozen two-field CompilerInvariant: every ranged,
    conflict-complete StructuredAF can be realized by a checked Lara unit
    under the fixed signature, policy and backend registry.
  failure_mode: >
    Under a defeat policy with no contraries and no exceptions, all three
    Attack.HasAttack constructors are impossible: rebut and undermine require
    ContraryMatch, while undercut requires an exception membership. Every
    checked program under that policy therefore compiles to an edgeless
    framework. A one-node self-edge framework still satisfies ranged, and
    conflictComplete is vacuous under the empty policy. Hence the frozen
    invariant is necessary in every fixed context, while this empty-defeat
    instance refutes a converse quantified over all fixed contexts.
  lesson: >
    A carrier can retain every downstream observation and still erase source
    witnesses needed for an exact image theorem. Forced-edge completeness
    constrains missing edges but does not license present optional edges.
    Do not recover sufficiency by adding hidden source witnesses to the frozen
    record: that invalidates M0 and risks turning realizability into a
    definitional restatement.
  evidence:
    - "issue #184 and EYH0602/lara-paper plan/theory-depth-plan.md, M1 target theorem"
    - "lean/Lara/Invariants.lean:121-128 (CompilerInvariant.ranged and conflictComplete)"
    - "lean/Lara/Attack.lean:538-570 (the three HasAttack constructors and their contrary/exception premises)"
    - "lean/Lara/Compile.lean:563-572 (every compiled edge exposes a typed declared attack)"
    - "docs/theory-m1-compilation-image.md (counterexample and corrected theorem boundary)"
  also_depends_on: [N221, N223]
  status: resolved

