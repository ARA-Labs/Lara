- id: N232
  type: decision
  title: "observe tests empty support before empty enumeration"
  provenance: ai-executed
  timestamp: "2026-08-28T08:06"
  choice: >
    Order `observe`'s guards support-first: `c.support = []` yields
    `observed gap`, then `enumerate = []` yields `noExtension`, then the
    `all`-guards. This makes `observe_gap` statable for an arbitrary semantics
    with no hypothesis beyond `c.support = []`, mechanizing the plan's claim
    that `gap` is the one semantics-independent status. Under the alternative
    order that theorem is false.
  alternatives:
    - "Enumeration-first, keeping the invariant that `.observed _` implies at least one extension. Rejected: it makes the plan's gap sentence false of the shipped code, and the invariant it buys is recovered by enumerate_ne_nil_of_observed_ne_gap for every status but gap."
  evidence:
    - "lean/Lara/Semantics.lean: observe_gap, observe_gap_iff, no_verdict_on_empty"
    - "Both orderings agree except when support and enumeration are BOTH empty, and both answers there are non-vacuous."
  rationale: >
    The relative order carries no safety content. There are two vacuous-`List.all`
    hazards — one at the enumeration, one at the support — and each is blocked by
    its own guard, both of which precede the `all`-guards under either
    arrangement. An initial reading that attributed the support-level hazard to
    this ordering was checked against the alternative and withdrawn.
  also_depends_on: [N230]

