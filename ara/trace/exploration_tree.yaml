- id: N323
  type: decision
  title: "Sigma's fixed constructor arity forces the inventory to be a cons spine, not a variadic node"
  provenance: ai-executed
  timestamp: "2026-09-07T15:45"
  choice: >
    Encode the enumeration as three reserved fixed-arity source constructors —
    inv/2, finding/2, no_findings/0 — rather than a variadic inv(U, f1, ..., fn).
    A variadic constructor is not declarable in Sigma at all: spec §2 fixes each
    constructor's arity, so a unit's signature would need one inv per length and
    the R2 sort checker could not check it. The design constraint came from the
    signature layer, not from the backend.
  alternatives:
    - >
      Recover the findings by scanning the premise for all nullary constructors
      other than the source. Rejected as too implicit — it would make an
      unrelated constant in the premise silently become a finding.
  evidence:
    - "docs/spec.md §2 (constructor arity)"
    - "examples/S9/insp-v1.policy.lara (con inv/finding/no_findings declarations)"
    - "src/Lara/Strict/Insp.hs: Con table, parseFindings"
    - "lean/Lara/Insp.lean: Con, parseFindings, termInvNodes"
  status: resolved
  also_depends_on: [N322]

- id: N324
  type: decision
  title: "The contrary pair belongs on the defeasible bridge, and which family needs one is decided by shared-ground-truth vs declared-premise"
  provenance: ai-executed
  timestamp: "2026-09-07T15:50"
  choice: >
    Declare no contrary pair on insp@1's raw inspection atoms, and record that
    a policy admitting a rival inspection must carry the conflict on the
    defeasible bridge's conclusions instead. Two Lean theorems fix both halves:
    inspModels_excl_of_same_entry (two arguments reading the same inspection
    leaf cannot both be backed for opposite polarities) and
    inspModels_absent_present_sat (two arguments reading different leaves can).
    The second is what distinguishes this family from ord@1, whose
    ordModels_excl_of_lt makes exclusivity a theorem because comparison goals
    are decided against a shared ground truth. Spec §8.1 Path B then forces the
    placement: a strict-reachable conclusion may not overlap either side of a
    contrary declaration, so a policy making code_absent/code_present strict
    conclusions AND declaring them contrary is an R12 rejection.
  alternatives:
    - >
      Declare the contrary pair on code_absent/code_present in insp-v1.
      Rejected: it is an R12 compile-time rejection under Path B, since
      absence_recheck's conclusion pattern is strict-reachable.
    - >
      Say nothing about contraries, as ord@1's policy does. Rejected because
      the reason differs: ord@1 declares none because it cannot conflict, and
      insp@1 declares none because this policy has no rival argument. Leaving
      the two silences indistinguishable would make the next policy author read
      the wrong lesson off S9.
  evidence:
    - "lean/Lara/Insp.lean: inspModels_excl_of_same_entry, inspModels_absent_present_sat"
    - "lean/Lara/Ord.lean: ordModels_excl_of_lt"
    - "test/InspSpec.hs: prop_inspContraryCoAcceptable"
    - "examples/S9/insp-v1.policy.lara (WELL-FORMEDNESS note)"
    - "docs/spec.md §8.1 Path B, R12"
    - "docs/insp1-code-inspection-decision.md §4"
  status: resolved
  also_depends_on: [N322]

- id: N325
