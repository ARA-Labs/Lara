- id: N322
  type: decision
  title: "insp@1 certifies the closed-world step over declared inventories, not byte-faithfulness"
  provenance: ai-executed
  timestamp: "2026-09-07T15:40"
  choice: >
    Ship the §5.2 static code-inspection adapter as a closed four-predicate
    family — code_absent / code_present / code_unique /
    code_planned_not_shipped — over premises carrying a declared exhaustive
    inventory inv(Src, finding(f1, ... no_findings)). The certified content is
    the inference from an exhaustive enumeration to a structural conclusion:
    a negative existential over code is not an observation but a closed-world
    step, and that step is deductive where the enumeration is not. What the
    adapter removes from the trusted base is narrow and real — the step from
    an enumeration to a conclusion no longer rests on a trusted policy rule —
    and it asserts nothing about whether the inspection covered the module or
    read the right version.
  alternatives:
    - >
      Certify over source bytes directly. Rejected: that is lara-evidence@0.1
      (byte-level evidence admission), explicitly out of v0.1 by spec §4.3 and
      gated under #78. Building it into a strict backend would move a
      defeasible measurement into the TCB by the back door. The split taken
      keeps the backend owning the inference and the leaf layer owning the
      observation, so evidence admission later strengthens the leaf without
      touching the adapter.
