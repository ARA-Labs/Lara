- id: N130
  type: decision
  provenance: user
  timestamp: 2026-08-07T05:15
  parent: N129
  title: Disposition of the PR #83 review's three no-change notes
  choice: >
    Asked whether to fix the three notes the reviewer raised without requesting
    changes; the user accepted the recommendation to defer two and answer one
    in place.

    Deferred as one scoped P2 TODO ("Make backend rejection reasons reach the
    author"): (a) widening the certificate oracle so a backend's rejection
    string survives to the diagnostic layer, and (b) putting the offending
    values in the comparison backends' cell-mismatch messages. Bundled because
    (b) is unobservable outside the property suites until (a) exists, and
    because doing (b) properly needs a renderDecimal inverse to parseDecimal --
    cells are Rational by the time the assert fires, so show yields "71 % 100",
    not "0.71". Not a diagnostics patch: CertOk is Bool-valued in Haskell and
    certOkBOf is Bool-valued in Lean, with the checker's soundness theorems
    stated over that Bool, so widening touches the checked interface on both
    sides. Recorded the shortcut to resist -- re-running the failing backend
    solely to recover a string would create a second evaluation path able to
    diverge from the checked one.

    The third note is answered in place rather than acted on: the i >= 0
    conjunct in Ord.resolve was characterised as a permanently-dead guard, but
    it is what keeps the function total (drop it and i < nPrem holds for -1,
    turning a rejection into a premises !! (-1) exception). A comment now
    records that, and why slots stay Int -- the seam's Dependency is
    PremiseSlot Int, so a narrower type would only move the conversion, and
    RACert has the same shape.
  alternatives:
  - Fix all three in PR #83 (scope creep on a branch already carrying a backend, its metatheory, and a review round)
  - Remove the i >= 0 guard as dead (converts an unreachable branch into a latent crash)
  - Switch OrdCert slots to Natural (moves the conversion, and desynchronises ord@1 from RACert)
  evidence:
  - TODOS.md
  - src/Lara/Strict/Ord.hs
