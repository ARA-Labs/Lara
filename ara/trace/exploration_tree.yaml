- id: N221
  type: decision
  title: "The M1 carrier is a conclusion-labelled finite AF"
  provenance: ai-suggested
  timestamp: "2026-08-26T16:22"
  choice: >
    Invariants.StructuredAF: node conclusions in declaration order plus a Bool
    edge relation over positions. Adequacy is what licenses it rather than
    convenience -- status_compileUnit proves the four-state status of any
    claim, computed entirely inside the carrier, equals what the existing
    pipeline reports over Compile.checkedAF, so M1 may quantify over carriers
    instead of over programs. erase_compileUnit ties it the other way: erasing
    a compiled accepted unit returns exactly Compile.checkedAF, so the carrier
    refines the existing pipeline rather than paralleling it.
  alternatives:
    - "Naked AF (no node labels): rejected as uninformative. The constraint
       that makes the image interesting -- edges forced by the fixed contrary
       policy -- is invisible without conclusions to force them from."
    - "Term-labelled AF: rejected as vacuous. Labelling nodes by their support
       terms degenerates 'realizable' into 'already built from checked terms',
       so the theorem would restate its own hypothesis."
  evidence:
    - "PR #194; commit 80d6160; lean/Lara/Invariants.lean (StructuredAF, eraseAF, CompilerInvariant, compileUnit)"
    - "Invariants.status_compileUnit, Invariants.support_compileUnit (adequacy)"
    - "Invariants.erase_compileUnit, Invariants.compileUnit_size"
    - "docs/theory-m0-compilation-invariants.md sections 1-2 (carrier decision, eight-row invariant table)"
  also_depends_on: [N220]
  status: resolved

- id: N222
  type: dead_end
  title: "A per-node `attackable` flag in the carrier"
  provenance: ai-suggested
  timestamp: "2026-08-26T16:22"
  hypothesis: >
    The carrier needs an `attackable` Bool per node. Compile.AttackComplete --
    the source-side property the forced-edge invariant is lifted from -- is
    guarded by Compile.ConflictAttackable, which is a property of a support
    *term* (a leaf, or a defeasible-rooted term). Erasure to conclusions
    discards term structure, so the guard appeared to have to be carried as a
    node label, and an early draft of the carrier carried one.
  failure_mode: >
    The flag was redundant, not merely awkward.
    Consistency.wellFormed_contrary_target_attackable proves that in a
    well-formed policy a declared-contrary target can never be a strict-rule
    root, and CheckedUnit.valid already supplies the completeness that lemma
    needs. So the guard is discharged by well-formedness at every node the
    invariant quantifies over, and the label would have recorded a fact that
    is never false.
  lesson: >
    A guard on a source-level property is not automatically a carrier
    obligation. Carrying it forward would have produced a *guarded*
    conflictComplete -- strictly weaker than what shipped, and it would have
    put a forgeable Bool into the frozen record that M1's realize construction
    would then have had to justify supplying. Check whether an existing
    well-formedness theorem discharges the guard before widening the carrier;
    a carrier field is a freeze, and a redundant one is expensive to remove.
  also_depends_on: [N221]
  status: resolved

