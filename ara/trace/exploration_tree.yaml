- id: N319
  type: dead_end
  title: "The first gate run was contaminated: the module was outside the lake build closure"
  provenance: ai-executed
  timestamp: "2026-09-07T11:00"
  hypothesis: >
    A module carrying #print axioms entries in AxCheck.lean is audited by the
    pinned axiom gate, so a green gate means its theorems were elaborated and
    checked.
  failure_mode: >
    Lara/Examples/SurfaceTransport.lean was imported by exactly one file,
    AxCheck.lean, which is not a lake target. Lake's lean_lib default is
    globs := roots.map Glob.one, so the build graph is import-driven, not
    directory-driven, and the module sat outside the import closure of all
    four defaultTargets. `lake build` reported success (148 jobs) without ever
    compiling it. The gate table in PR #257 was nevertheless green because a
    reviewer agent had hand-built the olean with
    `lake build Lara.Examples.SurfaceTransport` minutes earlier, and the audit
    then consumed that artifact. On a clean checkout the same commands give
    "error: object file SurfaceTransport.olean does not exist" and
    check-axioms.sh exits 1 rather than reporting over an incomplete set.
    Two independent worktrees hit the identical contamination, which is why
    the review's first pass rated it minor.
  lesson: >
    A build cache can make a verification pass for a reason the verification
    does not state. Gate output is evidence about the artifacts that existed
    when it ran, not about what a clean checkout would produce, so any gate
    whose result depends on a build must be re-run from a wiped cache before
    it is recorded as evidence. This is the second occurrence of the failure
    mode #242 fixed for Lara.Examples.Complexity.Realization; both times
    `lake build` stayed green. The existing stack does catch it — the coverage
    script is a source-text scan that catches unpinned theorems, and
    check-axioms.sh refuses to report over Lean errors — but detection lands
    at the wrong gate with a message that names an olean rather than a missing
    import. Issue #259 tracks a closure check at the gate whose job it is.
  evidence:
    - "lean/Lara.lean:347-351 (the new import and its comment)"
    - "lean/Lara.lean:331-334 (the #242 precedent, same failure mode)"
    - "scripts/check-axioms.sh:43"
    - "https://github.com/ARA-Labs/lara/issues/259"
  status: resolved
  also_depends_on: [N318]

