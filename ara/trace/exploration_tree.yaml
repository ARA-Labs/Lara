- id: N327_lara_text_strict_utf8
  type: decision
  title: Presentation text a PW door reads is strict UTF-8, not UTF-8//ROUNDTRIP
  provenance: ai-executed
  timestamp: 2026-09-12T04:20+00:00
  rationale: 'A permissive decoder turns a stray byte into a surrogate escape, so
    lara pw elaborated a world from a file lara check refuses to read at all — the
    contract says a lara world is the envelope lara check would have checked, so the
    door must not accept what the solo door cannot even read. The three boundaries
    that must survive a byte round trip (stdout, the run-file argument, the
    file-system encoding) keep //ROUNDTRIP; only the locale encoding, which is what
    Lara.Source.Load reads program text through, is strict.'
  alternatives:
  - 'Keep //ROUNDTRIP everywhere: one encoding, but the door accepts a program the
    solo door refuses, and both PW doors agree on it so the differential is blind.'
  - 'Make the whole CLI locale-independent in this PR: settles the converse asymmetry
    too, but the binding cost is on the output side (the solo door echoes author names
    to a stderr handle GHC opened with the startup locale) plus a locale axis in a gate
    that has none. Deferred to #334 with that cost stated.'
  evidence:
  - app/Main.hs
  - docs/theory-pw-outer-runtime.md
  - scripts/check-pw-conformance.py
  status: resolved
  also_depends_on:
  - N327_lara_sources
  - N326_327_conformance
