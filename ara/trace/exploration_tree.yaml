- id: N247
  type: dead_end
  title: "The shipped Haskell checker's dependency accounting"
  provenance: ai-executed
  timestamp: "2026-08-29T14:30"
  hypothesis: >
    Since strictCheck seals a StrictJudgment retaining sjDependencies and every
    adapter computes its Set Dependency correctly, the Haskell side was assumed
    to have per-occurrence dependency accounting that B0 only had to collect
    term-level.
  failure_mode: >
    strictCheck is called from test/ and from nowhere in src/. The production
    checker reaches backends through buildCertOk, which called runBackend and
    discarded the report at the last step. Lean proved certDeps accounts for
    every certified occurrence; the shipped checker accounted for none of them.
    A term-level collector built on strictCheck would have produced a
    conformance vector that passes while the shipped checker still accounts
    nothing.
  lesson: >
    A sealed type whose only constructor is reached from tests is not evidence
    about the production path. Before building conformance on an abstraction,
    grep for its constructor's call sites in src/ specifically - the type
    existing and being correct says nothing about it being on the hot path.
  evidence:
