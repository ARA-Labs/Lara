- id: N125
  type: decision
  provenance: ai-executed
  timestamp: 2026-08-07T02:10
  parent: N123
  title: ord@1 Lean registration resolves known digests to the empty theory
  choice: >
    Mechanizing the premise-only guard (N123) exposed that it is not
    expressible where the plan assumed. The abstract Lean Backend core is
    handed a single context Gamma = Delta ++ T and never learns Delta.length,
    so "reject any slot >= nPrem" cannot be written in ord@1's checkB the way
    it is written in the Haskell adapter's run. Resolved by moving the guard
    into theory RESOLUTION instead of the checker: lean/Lara/Driver.lean
    buildRegistry gives ord@1 a resolveTheory that returns the EMPTY theory for
    any KNOWN digest (an unknown digest still fails to resolve, which stays a
    rejection). Then Gamma = Delta ++ [] = Delta, so "names a premise" and "is
    in range of Gamma" coincide and the two implementations accept exactly the
    same certificates -- including on a unit that declares a non-empty wire
    theory, where the Haskell side rejects those slots outright. The Haskell
    guard is thereby an acceptance-preserving refinement, not a divergence.
    Pinned differentially by fixtures/corpus/ord-premise-only-{reject,accept}.sexp,
    whose theory entry deliberately carries the goal's left numeral so that
    ra@1-style free-context indexing WOULD have accepted the theory-slot cert.
  alternatives:
  - Model ord@1 over the full context like ra@1 and accept a differential divergence on theory-slot certs
  - Extend the abstract Backend structure with a premise count (touches framework metatheory, which the plan forbids)
  evidence:
  - lean/Lara/Driver.lean
  - lean/Lara/Ord.lean
  - src/Lara/Strict/Ord.hs
  - fixtures/corpus/ord-premise-only-reject.sexp
  - fixtures/corpus/ord-premise-only-accept.sexp
  status: resolved

