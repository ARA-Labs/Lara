- id: N191
  type: experiment
  title: "Invalid-UTF-8 probe on main freezes the D4 boundary decision"
  provenance: ai-executed
  timestamp: "2026-08-18T23:45"
  description: >
    Moving the .sexp reader to B.readFile lets invalid bytes reach the parser
    instead of raising an IOException at read time. The plan required probing
    both drivers on main first, because Lean's IO.FS.readFile has its own
    answer for invalid UTF-8 and the two drivers must agree on outcome class.
    The probe fed fixtures/corpus/strict-cert-unicode-theory.sexp with its
    e-acute replaced by a lone 0xFF byte to both drivers.
  result: >
    Both drivers exited 2 with empty stdout. The Haskell CLI reported
    "hGetContents: invalid argument (cannot decode byte sequence starting from
    255)" and the Lean driver reported "cannot read". Neither substituted
    U+FFFD or accepted. D4 was therefore frozen as designed: after the switch
    the Haskell side still exits 2 with empty stdout, but the fault arrives as
    a located R14 codec error through the codec channel rather than as an
    IO-level read failure. No byte that scripts/differential.sh compares moves.
  evidence:
    - "plans/2026-08-18-115-bytestring-wire-parser.md section 5b"
    - ara/evidence/results/bytestring_wire_parser.md
