- id: N315
  type: decision
  title: "Surface certDeps through a separate `lara deps` subcommand, reusing the mirror rather than fusing a collector into inferSupport (#204)"
  provenance: user
  timestamp: "2026-09-06T16:10"
  choice: >
    Issue #204 phrased the work as "carry dependency reports through the
    checker's own traversal (or an enriched variant the existing API
    projects)". Two sub-decisions departed from that first phrasing, both
    deliberately.

    (1) WHERE THE COLLECTOR LIVES. The driver calls the existing
    `Lara.Strict.Deps.certDeps` over the accepted, checked unit
    (`Lara.Driver.unitCertDeps`) instead of fusing collection into
    `inferSupport`'s traversal. `certDeps` is the Haskell mirror of Lean's
    `certDeps` and is pinned against the Lean witness byte-for-byte by
    `scripts/check-backend-deps-golden.sh`; a fused collector would be a
    second implementation of the same accounting, owing its own agreement
    argument. Reusing the mirror makes the shipped text the artifact the
    golden already pins. The cost is one extra certificate replay per accepted
    node, on demand only — the oracle is a pure function, so the second
    application cannot disagree with the first (the same argument
    `assuranceError` already relies on).

    (2) WHERE THE REPORT COMES OUT. Not in the verdict. `lara check`'s stdout
    is the N11 differential anchor against `lean/Lara/Driver.lean` and is
    pinned by the corpus goldens; widening it would move both and would oblige
    the Lean driver to render a report it has no encoder for. The report rides
    on its own `lara deps` subcommand instead, so no anchor, golden, or
    freeze tag moves.

    Two further design points followed. The report is carried as a fifth,
    lazily built component of `runCheckReported`, so it comes out of the same
    single pass as the verdict (it cannot describe a unit the driver did not
    accept) and costs nothing for callers that do not demand it. And it is
    taken over the *checked* (§4.3-pruned) unit and only on acceptance: the
    accounting ranges over checked terms, so a rejected term's partial report
    would read as an audit of evidence the verdict does not rest on. Design
    note D9 is untouched — the acceptance projection stays a `Bool`.
  alternatives:
    - "Fuse collection into `inferSupport` (the issue's first phrasing): one traversal, no second replay, but a second implementation of the accounting to keep in agreement with Lean, and it forces `CertDep` up into `Lara.SupportTerm` or splits resolution across modules."
    - "Widen the wire verdict with the report: one command, but moves the N11 differential anchor and the corpus goldens, and requires a Lean-side encoder that does not exist."
    - "Emit the report on stderr behind a `lara check --deps` flag: leaves stdout alone, but overloads the diagnostic channel and makes the report awkward to consume."
    - "Wire only the raw `.sexp` door and leave `.lara` unserved: smaller diff, but the two doors would disagree on what an accepted artifact reports."
  evidence:
    - "src/Lara/Driver/Internal.hs"
    - "src/Lara/Strict/Deps.hs"
    - "app/Main.hs"
    - "docs/spec.md"
  status: resolved
  also_depends_on: [N247]

