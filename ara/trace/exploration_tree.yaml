    lean/Lara/Sigma.lean. (a) wellSorted_decidable — the executable check IS the
    relation, so decidability is definitional and consumes no classical input.
    (b) wellSorted_subst (+ _list, _mem, _rule) — the substitution lemma.
    (c) checkUnit_wellSorted — every atom an accepted unit reaches is well-sorted
    under that unit's own Sigma. Lara.Unit gains sigma; CheckedUnit gains
    sigma_wf, policy_well_sorted, scopes_wf, args_well_sorted; checkUnit gains
    stage 2 and an explicit `ground` argument, because Lean's Unit carries Gamma
    as a function and storing the finite atom list would have meant threading a
    field through several proved unit equalities in the quarantine/prune layer.
  result: >
    Full Lean build clean; AxCheck gains 24 #print axioms lines and the gate
    passes — no sorryAx, nothing outside propext / Classical.choice / Quot.sound.
    Mechanization forced one design correction that the Haskell had not needed:
    Lean's Policy.Violation / WellFormed / firstViolation_none_iff are a proved
    correspondence other results cite, so spec 4.1's scope check was added as a
    separate UnitError arm rather than a widened Violation. Both drivers still
    reject the same units with the same class in the same stage order, which the
    differential checks byte-for-byte.
  evidence:
    - lean/Lara/Sigma.lean
    - lean/Lara/Check/Unit.lean
    - lean/AxCheck.lean
    - docs/mechanization-plan.md
    - "commits: 48c0c3f, 16fa55f"
