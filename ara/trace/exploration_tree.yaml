- id: N122
  type: decision
  provenance: user-revised
  timestamp: 2026-08-06T23:45
  title: Narrow the ord@1 goal family to num_lt and num_le, dropping num_eq
  choice: >
    The ord@1 comparison backend certifies exactly two relations, num_lt and
    num_le, over two canonical decimal numerals. num_eq is dropped: canonical
    decimal encoding is injective on representable rationals and parseDecimal
    accepts only the canonical image, so an equality goal could only ever
    accept syntactically identical numerals (num_eq(A,A)) -- a shape no paper
    claim takes; exact cross-report agreement is DupGroup territory, already a
    plan non-goal.
  alternatives:
  - Keep the three-relation family {lt, le, eq} with the degeneracy documented
  - Five-spelling family incl. num_gt/num_ge (rejected earlier in the plan draft)
