  description: >
    `congruence_witness_sem` and `registry_swap_witness_sem` establish that the
    headline's hypotheses are inhabited and its conclusion provable at a
    concrete link, uniformly in `sem`. They establish nothing more. Their
    carrier is `ctxEx`/`fragEx`, the two-node chain on which all five semantics
    agree — proved this turn by `obsSem_linking_agrees` — so those theorems
    would be equally provable if `ExtensionSemantics` had one inhabitant. The
    disagreeing carriers (`cycleCtx`/`cycleFrag`, `sinkCtx`/`sinkFrag`) are
    pinned as *links* but carry no `Admissible` instance, so the congruence
    cannot be applied there. So the milestone proves the congruence holds at
    every semantics, and separately proves the semantics disagree, but never at
    the same carrier. Compounding it, `fragEx` carries no certificate, so
    `mapAssurFrag f` is the identity on it for every `f` — the same
    shape-witness caveat `docs/theory-m4-contextual-adequacy.md` §1 records for
    the grounded `congruence_witness`. Filed as #270 (an admissible disagreeing
    carrier) and #269 (a certificate-bearing instantiation).
