- id: N181
  type: dead_end
  title: "Uniform failure-to-none collapse is not a faithful mirror cut"
  provenance: ai-executed
  timestamp: "2026-08-13T20:41"
  hypothesis: >
    The Lean mirror of lowerCertPayload could collapse the entire Haskell
    error taxonomy to Option none uniformly, leaving name resolution and
    error kinds to Haskell conformance tests (the plan's D10 cut as first
    implemented).
  failure_mode: >
    Haskell rejects a non-empty all-digit symbolic name (prem 007) with
    SlotNonCanonicalNumeral BEFORE consulting the resolver, for every
    resolver; the first Lean mirror routed such names through the abstract
    resolver, so a resolver mapping "007" to a slot made Lean lower a payload
    Haskell rejects - a failure-to-success flip that lower_eq_numeric_subst
    positively certified. Caught by the adversarial spec review, not by the
    nine passing conformance vectors.
  lesson: >
    A coarser error model licenses collapsing failure KINDS, never
    success-versus-failure: the mirror must reproduce the failure structure
    (which refusals fire before which inputs are consulted). Fixed by adding
    the numeralTypo early-out to Lean's lowerAt, strengthening
    SymNumericSubst's symbolic arm, and pinning the exact drift scenario as
    guard V9b under an all-resolving resolver.
  evidence:
    - lean/Lara/CertSlots.lean
    - src/Lara/Elaborate/CertSlots.hs
  also_depends_on: [N180]
  status: resolved

