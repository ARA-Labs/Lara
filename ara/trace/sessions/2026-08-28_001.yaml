      Additivity is checkable rather than asserted: 4819 insertions and 0
      deletions across 12 files, Compile.lean / Grounded.lean / Invariants.lean
      / Realizability.lean untouched, and the five unchanged-behaviour gates —
      differential, admission-differential, replay-tamper, freeze-bundle,
      presentation-parity — all passing.
  - turn: 1
    excerpt: >
      Every false statement caught across eight review rounds was a claim about
      dependencies, counts, locations or causes; not one was a claim about what
      the code outputs. Three were the orchestrator's own, including two in the
      decision record about pre-commit state that git show refutes.

  - turn: 2
    excerpt: >
      External review correctly separated a counterexample witness from a
      quantified refutation. The revised theorem states the candidate function
      and both status biconditionals explicitly. The suggested `resize 6 genAF`
      required first making `genAF` size-aware; otherwise QuickCheck's `resize`
      would not have bounded the powerset scan.
  - turn: 2
    excerpt: >
      The second review exposed two unreachable test branches. Every old golden
      extension had at most one member, so a complete-semantics mutation that
      dropped reinstatement survived; every decider input came from `candidates`,
      so `boundedB` could never be false. `reinstatementChain` and the generated
      outsider property make both mutations fail, while `make
      semantics-goldens` prevents the Lean transcript from going stale.
