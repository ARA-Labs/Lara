logic_revisions:
  - turn: 1
    entry: C35
    field: created
    before: "(none — new claim)"
    after: "C35: The skeptical reading of claim status generalizes across extension semantics; the credulous reading is not a function into it"
    signal: artifact-commitment
    provenance: ai-suggested
    note: >
      Crystallized directly rather than staged: the mechanization landed in the
      same turn and nine commits depend on it. Statement carries no run numbers;
      the two-cycle and its enumerations live in Sources and Proof.
  - turn: 1
    entry: C36
    field: created
    before: "(none — new claim)"
    after: "C36: A semantics with no extension must report its silence, not a verdict"
    signal: artifact-commitment
    provenance: ai-suggested
    note: >
      Split from C35 rather than folded in: C35 is about which reading lifts,
      C36 about what an aggregation owes when the extension set is empty. They
      have different falsification conditions and C36 depends on C35.

  - turn: 2
    entry: C35
    field: Statement
    before: >
      A four-state claim status defined per-extension lifts to many extensions
      only under the skeptical (universally quantified) reading, and the lift
      agrees with the single-extension definition exactly at the semantics that
      has one extension. The credulous (existentially quantified) reading admits
      no such lift: on a symmetric framework a single argument is accepted by
      some extension and attacked by some extension at once, so it is a relation
      between a claim and a set of statuses rather than a function into them.
      Separately, the claim-level lift ("in every extension some support argument
      is accepted") is not recoverable from per-argument acceptance data, so an
      observation function cannot factor through a per-argument profile.
    after: >
      A four-state claim status defined per extension lifts to many extensions
      under the skeptical (universally quantified) reading, and the lift agrees
      with the single-extension definition when the semantics has exactly one
      extension. Under the credulous (existentially quantified) reading, no
      four-state function can simultaneously return `justified` exactly when
      `inSome` is true and `defeated` exactly when `outSome` is true. On the
      preferred-semantics two-cycle, one argument satisfies both bits.
      Separately, the claim-level lift ("in every extension some support argument
      is accepted") is not recoverable from per-argument acceptance data, so an
      observation function cannot factor through a per-argument profile.
    signal: empirical-resolution
    provenance: ai-suggested
    note: "External review showed that the old theorem was only a witness; the replacement theorem quantifies over candidate functions and both defining biconditionals."
  - turn: 2
    entry: C35
    field: Conditions
    before: >
      Holds over a finite conclusion-labelled framework with a decidable attack
      relation, for the five semantics mechanized here (grounded, complete,
      preferred, stable, semi-stable). The agreement half additionally requires
      a duplicate-free carrier, which compilation supplies. Mutual exclusivity
      of the justified and defeated readings is not free: it needs a non-empty
      extension set together with conflict-freedom of every extension, which the
      interface does not require and which is therefore supplied per instance.
      Untested boundary: nothing here establishes that the credulous reading
      fails to be functional for every semantics, only for those admitting two
      symmetric extensions; and the interface cannot detect a semantics declared
      outside its module (#198).
    after: >
      Holds over a finite conclusion-labelled framework with a decidable attack
      relation, for the five semantics mechanized here (grounded, complete,
      preferred, stable, semi-stable). The agreement half additionally requires
      a duplicate-free carrier, which compilation supplies. The non-functionality
      theorem fixes preferred semantics and quantifies over every
      `AF → Arg → Status` candidate satisfying the two biconditionals; it does not
      claim that every semantics admits the two-cycle witness. Mutual exclusivity
      of the justified and defeated skeptical readings requires a non-empty
      extension set and conflict-freedom of every extension, which the interface
      does not require and which is therefore supplied per instance. The
      interface cannot detect a semantics declared outside its module (#198).
    signal: empirical-resolution
    provenance: ai-suggested
  - turn: 2
    entry: C35
    field: Sources
    before: >
      The source named `credulous_not_functional` as the conjunction that
      `inSome` and `outSome` are both true on the preferred-semantics two-cycle.
    after: >
      The source now names `credulous_not_functional` as
      `¬ ∃ credulous : AF → Arg → Status` satisfying both credulous
      biconditionals; the two-cycle remains the finite contradiction witness.
    signal: empirical-resolution
    provenance: ai-suggested
  - turn: 2
    entry: C35
    field: Falsification
    before: >
      Exhibit a semantics among the five whose observation disagrees with
      `Grounded.statusC` on a framework with exactly one extension; or exhibit a
      framework and claim on which the credulous reading is single-valued for
      every argument while two symmetric extensions exist; or exhibit two
      semantics agreeing on every per-argument acceptance profile and on every
      claim observation, which would show the non-factoring result vacuous.
    after: >
      Exhibit a semantics among the five whose observation disagrees with
      `Grounded.statusC` on a framework with exactly one extension; exhibit an
      `AF → Arg → Status` function satisfying both credulous biconditionals under
      preferred semantics; or exhibit two semantics agreeing on every
