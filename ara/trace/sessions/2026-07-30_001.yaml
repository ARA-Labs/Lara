logic_revisions:
  - turn: 1
    entry: C04
    field: Statement
    before: >
      If two backends accept exactly the same strict instances, then after erasing certificate
      payloads the compiled argumentation frameworks are isomorphic and every claim gets the same
      four-state status — so which strict logic (natural deduction, LP, an arithmetic or model
      checker) sits behind the seam is not part of claim-status semantics. This is the formal reason
      not to make any one logic foundational.
    after: >
      If two well-checked programs differ only by a uniform certificate relabel — the same source
      certified under two backends with identical strict-acceptance profiles — their compiled
      argumentation frameworks coincide (identity node bijection) and every claim gets the same
      four-state status, so which strict logic sits behind the seam is not part of claim-status
      semantics. This is the formal reason not to make any one logic foundational.
    signal: empirical-resolution
    provenance: ai-suggested
    note: "Sharpened from 'after erasing payloads ... isomorphic' to 'uniform relabel ... coincide' — the mechanized (Model A) faithful form."
  - turn: 1
    entry: C04
    field: Conditions
    before: >
      Holds for source-identical programs differing only in strict-certificate payloads, under
      grounded semantics; backend identity, theory, dependencies, and certificate size remain visible
      in audit reports (only status is invariant).
    after: >
      Holds under grounded semantics for programs related by a uniform INJECTIVE relabel of certificate
      payloads (a genuine backend swap); erasing every payload to a single `certified` marker is NOT an
      isomorphism — collapsing distinct subterms can merge occurrences and add subargument-closure
      edges, because containsB keys on exact structural equality (found while mechanizing 2026-07-30).
      Backend identity, theory, dependencies, certificate size stay visible; only status is invariant.
    signal: empirical-resolution
    provenance: ai-suggested
    note: "Added the injective-relabel condition and the non-injective-erasure-is-not-iso finding (dead-end N76)."
  - turn: 1
    entry: C04
    field: Evidence basis
    before: >
      Theorem 2 (strict-backend-decision §5) proves backend replacement via structural induction,
      eraseCert graph isomorphism, and invariance of the grounded least fixed point; it is a paper
      proof slated for mechanization (result 9), not yet machine-checked.
    after: >
      Theorem 2 is now machine-checked in lean/Lara/Erase.lean (backend_replacement, checkedAF_relabel,
      labelC_relabel) under Model A — a uniform injective certificate relabel mapAssur f. Relabeled
      programs share a definitionally equal checkedAF (nodes are list positions, bijection is identity),
      giving equal grounded labels and statuses. Mechanizing surfaced that the paper's non-injective
      erase-to-`certified` form is not an isomorphism; injectivity-on-used-certs is the faithful
      condition (dead-end N76). lake build 47 jobs; AxCheck 0 sorryAx / 510 decls, trio-only.
    signal: empirical-resolution
    provenance: ai-suggested
    note: "Status stays 'supported' — mechanization is confirming evidence, not a demotion."
  - turn: 3
    entry: C04
    field: Evidence basis
    before: >
      … injectivity-on-used-certs is the faithful condition (dead-end N76). lake build 47 jobs;
      AxCheck 0 sorryAx / 510 decls, trio-only.
    after: >
      … injectivity-on-used-certs is the faithful condition (dead-end N76). Now non-vacuous by
      construction — lean/Lara/EraseTransport.lean transports well-checkedness (hasSupport_mapAssur,
      hasAttack_mapAssur, mapCertProg) under any acceptance-preserving relabel, so
