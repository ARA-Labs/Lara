  field: Conditions
  before: 'Holds over the frozen compilation carrier at **any** extension semantics — originally
    proved for grounded only, and generalized in #216 with no additional hypothesis, because what
    the profile-preservation argument concludes is an *equality* of compiled carriers and every reader
    of a carrier inherits it (`obsGen_congr`, `backend_replacement_congruence_sem`). Requires admissible
    contexts — the link guard passes, both sides'' declared material is well-formed relative to the
    *linked* environment, and the linked program passes the signature stage — whose own assurances
    satisfy `FixesContext`, and a forward-only acceptance-preservation hypothesis. Admissibility
    supplies an accepted source and preservation supplies an accepted target, so both detailed observations
    land in the observed arm; without it their rejection outcomes need not agree. Openness is leaf-name
    openness only: term-level holes are unrepresentable because the compile boundary forces an empty
    obligation set on every declared argument. Relational quantification over related backends is
    no longer an open boundary: #215 replaced the function `f` with a relation `R` and re-derived
    this theorem as the `graphOf f` instance (`backend_replacement_congruence_of_parametricity`,
    guarded by `congruence_correspondence`), so nothing here is now stated more generally than what
    is proved. Untested boundary: contexts carrying assurances moved by the relabel, two-way acceptance,
    relational forms for the composed-context and whole-program congruences (#277), how the *equivalence
    relations* at different semantics compare (#268 — the observation functions are separated, the
    relations are not), and a semantics-parametric congruence witness at a carrier where the semantics
    parameter is not inert (#270) or on a certificate-bearing fragment (#269).'
