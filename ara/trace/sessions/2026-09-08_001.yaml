key_context:
  - turn: 1
    excerpt: >
      The naming question was surfaced before any code was written and answered by the user:
      keep `parametricity`. The plan named it the one judgement the proof cannot settle —
      #187's acceptance criterion asks for a relational quantifier, and RelInj forces the
      relation to be a partial bijection, so what ships is parametricity over
      partial-bijective certificate relations. The two `Not parametricity` doc bullets were
      amended rather than deleted, and the generic-observation one was scoped to the two of
      four congruences that actually gained a relational form.
  - turn: 1
    excerpt: >
      The load-bearing argument for why the milestone is worth having is not the relational
      quantifier. relInj_functional shows RelInj makes R a partial FUNCTION, so RelFrag R F₁ F₂
      always exhibits some total injective f with F₂ = mapAssurFrag f F₁ — every conclusion is
      already reachable through backend_replacement_congruence, EXCEPT that such an f must
      satisfy AssurPreserving globally and no such extension need exist. That is the whole gap,
      and backend_replacement_parametricity_local is what demonstrates it is non-empty.
  - turn: 1
    excerpt: >
      Two plan statements were unprovable as written and had to gain a RelInj hypothesis:
      attackOcc_rel and contains_rel. The functional originals get uniqueness of the image
      occurrence for free because the image is a computed function value; a relation supplies
      no such image. Both consumers already carry RelInj, so nothing downstream weakened —
      but the diagnostic generalizes (O157).

