key_context:
  - turn: 1
    excerpt: >
      The canonical paper question is "What does deciding a claim status cost
      on that realizable class?" The draft's arbitrary-AF quartic witness has no
      Realization, so even a corrected witness would not discharge that question.
  - turn: 1
    excerpt: >
      The planned groundedC_cost_ge n^3 is false because defendedAuxC exits on
      the first undefended attacker. The first-node-attacks-all family costs n^2;
      pinnedAF also exits after its first attacker and falls below n^4 from n=7.
  - turn: 1
    excerpt: >
      D1-D3 price attack-oracle calls, but Task 6 introduces variable policies,
      fresh atom labels, raw units, and checker witnesses without defining their
      encoding size. That is not yet a classical reduction model.
  - turn: 1
    excerpt: >
      The researcher selected one fixed policy, an explicit carrier promise,
      credulous complete acceptance, spike-first sequencing, carrier claim
      status, a shared verified procedure, and no new Haskell count gate.
  - turn: 2
    excerpt: >
      For args [0,1] with every attack true and an empty defense set, defendedC
      costs one query and groundedC costs four across two rounds; the plan asks
      for lower bounds of two and eight respectively.
  - turn: 2
    excerpt: >
      The researcher chose plan revision plus engineering review over either
      applying the recorded corrections immediately or opening a partial
      grounded-only pull request.
  - turn: 3
    excerpt: >
      The revised plan fixes one formula-independent context, materializes the
      carrier as labels plus a square Boolean matrix, and allows only a proved
      general realization theorem to unlock the hardness path.
  - turn: 3
    excerpt: >
      The final self-review caught that grounded quartic tightness alone did not
      establish status tightness; Task 5 now requires a nonempty carrier claim
      and `carrierStatus_quartic_cost_ge`.
  - turn: 4
