key_context:
  - turn: 1
    excerpt: >
      The plan's Lean was already compiled and axiom-audited during its
      engineering review, and it explicitly warned against simplifying proofs
      back toward obvious forms. Byte-identical transcription with lake build
      and the axiom audit as gates was therefore stronger evidence than any
      reviewer reading; both reviewers independently confirmed the transcription
      was byte-exact and re-ran the audit themselves.
  - turn: 1
    excerpt: >
      The plan's own prose claimed 45 registered theorems while its code block
      listed 42; the implementation followed the block. After the review fixes
      the set is 47. A count stated in a landing record must match the file, so
      the doc now says 47 and asserts the stronger property that every theorem
      the five modules declare has an audit line.
  - turn: 1
    excerpt: >
      Both reviews converged on the same failure mode without coordination:
      doc comments asserting more than the theorem beneath them.
      t7_transport_wellFormed said only that leaf l1 was among the target's
      arguments — which any coincidental argument satisfies — while its comment
      claimed the source claim's complete checked support had transported.
  - turn: 2
    excerpt: >
      The collision was measured before deciding, and the measurement changed
      the argument. Ordinary applications of `compare` never broke -- argument
      shape disambiguates -- so the risk was narrower than first reported. What
      decided it was `unfold compare` failing with "ambiguous term" in any
      module that opens Lara.PW, since the T5 proofs unfold this definition and
      T6 (#191) will be such a module; plus the name map's own statement that
      no paper display cites the key yet, which makes the rename free now and
      costly later.

  - turn: 3
    excerpt: >
      The audit gate could pass vacuously. A `#print axioms` naming a
      nonexistent declaration does not remove a report -- Lean errors on that
      line and every other line reports normally -- so the filter saw only
      healthy reports and printed "Axiom audit passed." CI discarded Lean's
      exit 1 by piping without pipefail, against the script's own documented
      usage. A theorem could therefore leave the audited set unnoticed. This
      matters beyond the one incident: every evidence file in this artifact
      cites the audit as its verification.

