logic_revisions:
- turn: 1
  entry: C24
  field: title+Statement
  before: '## C24: A single-rule ablation admits exactly its mapped defect class — surgical and monotone,
    confirmatory by construction on a seeded corpus

    - **Statement**: Disabling one checker rule makes the checker admit exactly the defect class that
    rule is responsible for and no other: the previously-rejected certificates in that class flip to accept
    while every other input''s verdict stays byte-identical (surgical), and no certificate the full checker
    accepts changes (monotone). On a seeded corpus where each mutant carries one defect mapped to one
    rule, this demonstrates each rule is load-bearing for its class — it is confirmatory by construction
    and does not measure how many real, unplanted defects the rule would catch.'
  after: Single-switch ablation changes exactly its mapped class; rejection-relaxing switches flip rejects
    to accepts (monotone); node promotion changes exactly hole-reporting verdicts with both runs accepting.
  signal: empirical-resolution
  provenance: ai-suggested
  note: no-cq no longer flips rejections at lara-core@0.3; v7 evidence
