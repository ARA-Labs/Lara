logic_revisions:
  - turn: 1
    entry: C31
    field: Conditions
    before: >
      Holds for the current surface, where premise lists are not authorable
      (`explicitRuleP` stores none) and nested assurances are not
      surface-expressible - so every parsed premise is constructed by
      `resolvePremises`/`inferTheta` - plus hand-built ASTs accepted by the
      elaborator, which the second locate candidate covers. No false ambiguity:
      a leaf sharing the cited name already fails upstream as
      `SlotNameAmbiguous` in `refMatches` scope resolution. Untested boundary:
      a future grammar extension making premise lists authorable would add new
      reachable representations and must extend the candidate set.
    after: >
      [unchanged text] ... must extend the candidate set. Scope, from
      `lara-syntax@0.8` (#131): the claim is about the resolver's *locate*
      step, and the resolver now has a class that has no locate step - a rule
      premise label denotes its slot directly, so it is representation-invariant
      by construction and neither confirms nor tests this claim. The claim
      therefore covers two of the resolver's three name classes, and the
      candidate-set obligation above applies to those two.
    signal: artifact-commitment
    provenance: ai-suggested
    note: >
      The merged @0.8 resolver is the very function C31 is about, and it gained
      a path that reaches none of the representations the Conditions enumerate.
      Left unsaid, the enumeration reads as exhaustive when it no longer is.
      Statement, Status and Falsification are untouched - the locate-step
      mechanism the claim asserts is unchanged and still supported.

