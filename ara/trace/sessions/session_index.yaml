- id: 2026-09-08_001
  date: '2026-09-08'
  summary: 'Issue #215 implemented end to end from plans/2026-09-08-theory-m4-relational-parametricity.md (16 commits, one per plan step). M4''s contextual representation-independence theorem is generalized from a function f : Assurance -> Assurance to a relation R lifted structurally through support terms, attacks and fragments: obsGen_parametricity proves it once over an arbitrary projection, and backend_replacement_parametricity{,_sem} are instantiations. #215''s own sizing question is answered no — compileUnit_rel concludes an EQUATION between StructuredAFs, so the relation is erased before any semantics runs and no fixpoint machinery, grounded-labelling lemma or AttackExtensional hypothesis appears anywhere. RelInj (partial bijection) is forced by three consumers — dedupList, coveredB, checkUnit_complete''s Nodup — and relInj_necessary witnesses it as coveredB_rel with hR deleted and the conclusion negated. The milestone''s actual content is the localization, not the quantifier: relInj_functional shows RelInj makes R a partial function, so every conclusion is already reachable via backend_replacement_congruence EXCEPT where no total injective extension satisfies AssurPreserving globally — backend_replacement_parametricity_local (and _local_sem) instantiate the guarded hypothesis at occRel F to show that gap is non-empty. congruence_correspondence typechecks by rfl, the mechanized guard that the corollary restates the functional theorem exactly rather than something weaker. Lara.Forall₂ authored locally: List.Forall₂ is a Mathlib name, absent from Lean 4.32.0. Two new modules, 1831 lines at the close of this session (1865 at the branch head, after the merge of origin/main and PR #278''s review response), sorry-free; 158 jobs, coverage 90 (2619 tree-wide), audit trio-clean, both modules verified inside the build closure. Naming (keep "parametricity") decided by the user up front; the two "Not parametricity" doc bullets amended rather than deleted, the generic-observation one scoped to the two of four congruences that actually moved. C53 and C54 crystallized; C52 hypothesis -> testing on a second instance; C49''s #215 untested boundary discharged. Follow-ups #275 (observational separation), #276 (docstring pointers), #277 (the two remaining congruences).'
