- id: 2026-09-07_001
  date: '2026-09-07'
  summary: 'Issue #227 closed (PR #257): SurfaceTransport witnesses surface_directAF_relabel unconditionally with 34 trio-clean theorems and no native_decide, the escape being a kernel-form certificate payload that never reaches NDNamed.lowerFormula. Review then caught the module sitting outside the lake build closure — AxCheck.lean is not a lake target — so the PR''s green gates had run against a hand-built olean; ae5b408 adds the import and re-runs all four from a wiped .lake (149 jobs, coverage 2375, audit green). N300''s "milestone-sized" sizing refuted; O120 crystallized into constraints.md. Follow-ups #258 (edge-free witness) and #259 (CI closure check, second #242 recurrence). Then issue #260 closed (PR #267), completing the §5.2 adapter portfolio: insp@1 ships the static code-inspection checker as a closed four-predicate family over declared exhaustive inventories, certifying the closed-world step (a negative existential over code follows deductively from an exhaustive enumeration) and never the enumeration''s faithfulness to bytes — which is why corpus unit C09 stays a gap and why worked example S9 is C09 plus the one leaf C09 lacks. §9 r10 discharged in lean/Lara/Insp.lean (17 theorems, trio-clean); evidence is 23 property groups, four wire anchors, and S9. Two theorems settle the contrary question in both directions — exclusive at a shared inspection leaf, co-acceptable across two — which crystallized C51 and gave C27 its third and sharpest instance. The requested mutation leg was built, fully verified (568 mutants), and reverted on colliding with frozen input row 1; that cost is measured and filed as #266. differential 620 → 625, 0 fail; ARA span checker repaired from 5 pre-existing failures to PASS. Turn 3 executed the #216 plan end to end (PR #271): Lara.Context.obsGen parameterizes the projection read off the linked carrier rather than the semantics, so obsGen_congr proves contextual representation independence once and obsSem/CtxEquivSem plus the four congruences are instantiations of it. The generic congruence needs no AttackExtensional hypothesis - it transports along the carrier equality compileUnit_link_relabel supplies - refuting the cost estimate in the issue; the grounded case is recovered by theorem (obsSem_grounded, and ctxEquivSem_grounded_iff as an iff). Non-triviality needed new fixtures: every pre-existing M4 carrier agrees across all five semantics (now proved), so a three-cycle where stableSem reports noExtension and a sink where preferredSem and groundedSem disagree were authored, each with a disequality conjunct. 154 jobs, coverage 37, audit trio-clean. The grounded-semantics untested boundary of C49 discharged; C52 crystallized. Follow-ups #268 (relations vs functions), #269 (certificate-bearing instantiation), #270 (an admissible disagreeing carrier). Turn 4 opened intending to execute the same #216 plan from a fresh conversation and found the work already merged as PR #271 — turn 3''s own output. The plan had pre-registered that contingency, so its checklist was run: Tasks 2/4/5/6/7 and most of 8 were landed, including the plan''s one unauthored high-risk step; Task 1, Task 3 and finding T1 were not. Scope was put to the researcher, who chose to land them. Commit eb6e955 replaces PR #271''s two-type design with one: Fragment.lean''s Observation inductive becomes the payload-generic ObservationOf alpha with Observation an abbreviation of it, Outcome is deleted, the obsGen family moves into Equivalence.lean beside the theorems it generalizes, and obs_eq_of_ok / backend_replacement_congruence become one-line corollaries. The payoff is that the milestone''s own design premise -- obs is obsGen at the grounded projection -- stops being prose and becomes obs_eq_obsGen, closing by rfl; across two distinct types the equation was not even well-formed. Replacing the frozen inductive cost no decide-closed fixture (abbrev is definitionally transparent) and no statement: the signature-level diff of Equivalence.lean is purely additive. 100 jobs, axiom trio, coverage 90. The plan file was executed and deleted. Both review stages found real defects -- 7 mis-delta''d citations and 5 docstrings whose generalization arrow the move had inverted -- and citation rot recurred mid-turn until repaired by name rather than by delta. C52 sharpened (parameterizing the reader is necessary but not sufficient); C49 Proof repointed. N335 left unresolved: the new evidence contradicts a clause of staged O152. Turn 5 settled the points turn 4 had flagged for the researcher: N335 adjudicated (O152''s ''sits beside rather than replaces'' clause dropped, the rest standing), obsGen_ext deleted as dead (coverage 90 -> 89), and citation rot given a gate — scripts/check-lean-citations.py resolves every lean/**:NNN prose citation to a declaration and fails on rot, verified by injecting line drift. Deleting obsGen_ext shifted Equivalence.lean a third time and re-staled the citations again, which is the third recurrence in two turns and the argument for the gate. A generalized repoint-by-name script over-reached — it snapped deliberate proof-line citations to the next declaration and corrupted a line range — so O156''s rule was narrowed rather than crystallized: repoint only citations that resolved to a declaration before the edit. The two citation gates are deliberately disjoint, with ARA Sources staying with check_ara_source_spans.py and the append-only ARA records outside both.'
