logic_revisions:
- turn: 4
  entry: C12
  field: Conditions
  before: >-
    Holds for the Haskell↔Lean cross-check once both share one serialized first-order core
    AST; LARA's grounded status is deterministic (C07), so the single-interpretation
    precondition holds by construction, with no undefined behavior to quotient out. The
    shared serialized core is now built (`Lara.Wire` S-expr codec, the N11 anchor) and the
    harness (`scripts/differential.sh`) runs both drivers byte-for-byte; the framing
    localized one concrete Haskell-vs-Lean divergence to inconsistent driver identity
    functions (non-canonical numeric literals: `canonNum` vs the former Lean `canon = id`,
    O15), rather than a voting tie. The production Lean driver now uses `canonNum`, and the
    numeric/multi-blocked differential fixture prevents that defect from recurring.
  after: >-
    [the text above, plus:] Bounded, by what the anchor set reaches: the
    localizing power is the framing's, but a divergence outside every case is invisible to
    it, and the gates' exit-code-only families do not see a divergence in the stated
    *reason* at all. The reader's nesting bound was Haskell-only and unseen for that reason
    — same exit code, different refusal category — and the remedy was both a case on each
    side of the boundary and a source-level check that the two implementations agree on
    where the boundary is, since the stricter side's refusal otherwise masks a one-sided
    relaxation.
  signal: empirical-resolution
  provenance: ai-suggested
  note: >-
    scripts/differential.sh is in C12's Proof refs and produced a result this turn; the
    Divergence sharpens the regime rather than contradicting the claim, so Status
    stays testing.
