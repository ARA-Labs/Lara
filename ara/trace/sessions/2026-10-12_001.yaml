    grade requires a reader-admitted capture assumption with exact source and process bindings, an unknown-kind
    node forces every positive audit false, and an audit over a family containing a rejected source is
    false, so the layer''s affirmatives are conditional on the assumptions a result prints. Determinacy
    of the recorded impact reads routes through a recorded whole-input read, which is the conservative
    fallback the contract allows. Untested boundary: no non-Lean implementation of the wrapper exists,
