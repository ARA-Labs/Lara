key_context:
  - turn: 1
    excerpt: >
      The core matrix is theorem-backed rather than predicted: addLeaf reaches
      four cells, tighten thirteen, addAttack ten, and addInstance ten. The
      addInstance prediction of thirteen was refuted by a general sink-extension
      theorem, not by failure to find fixtures.
  - turn: 1
    excerpt: >
      CleanBase is an exact AcceptedRun property. Off that boundary an addAttack
      from a blocked source grows the blocked closure and changes a target's
      public report to evidence-blocked.

  - turn: 2
    excerpt: >
      The plan's own S1 budget escape hatch fired on measured evidence. Direct
      probes showed String.splitOn, startsWith and endsWith are kernel-opaque
      under Lean 4.32's Slice-based API - rfl, decide, simp, exact? and grind
      all fail, unfolding diverges, and native_decide is forbidden by the axiom
      gate. Only String.toNat? reduces per literal, and the ND precedent
      generalizes to it and to nothing else.
  - turn: 2
    excerpt: >
      The maintainer chose the split witness over paying the Slice-API cost or
      retreating to resolution-only: shipped nd@1 and ord@1 carry the syntactic
      and resolution facts, a fully proved fixture core carries the typed ones,
      and the boundary is documented rather than papered over.
  - turn: 2
    excerpt: >
      Dependency reporting turned out not to inherit the acceptance blocker.
      stepDeps never calls acceptance and ord@1's uses stops at String.toNat?,
      so the cross-language golden computes over the shipped nd@1 and ord@1
      cores on both sides - the strongest artifact in the milestone, and the
      one the split does not weaken.

