  field: Conditions
  before: 'Holds for a flat map of closed artifacts under one structurally identical
    policy, where every member passes the ordinary source checker alone and carries no
    admission or group-pruning audit. Identity is shared where meaning is shared:
    propositions, predicates, rule and question identifiers are *not* qualified, which is
    what makes a cross-artifact conflict detectable at all — qualifying them would make
    every map trivially conflict-free. Untested boundary: a policy with a premise-less rule,
    which is the case that both makes the structural merge reachable and is absent from
    every policy shipped here.'
