  field: Conditions
  before: "- **Conditions**: Holds over the frozen compilation carrier at **any** extension semantics \u2014 originally proved for grounded only, and generalized in #216 with no additional hypothesis, because what the profile-preservation argument concludes is an *equality* of compiled carriers and every reader of a carrier inherits it (`obsGen_congr`, `backend_replacement_congruence_sem`). Requires admissible contexts \u2014 the link guard passes, both sides' declared material is well-formed relative to the *linked* environment, and the linked program passes the signature stage \u2014 whose own assurances satisfy `FixesContext`, and a forward-only acceptance-preservation hypothesis. Admissibility supplies an accepted source and preservation supplies an accepted target, so both detailed observations land in the observed arm; without it their rejection outcomes need not agree. Openness is leaf-name openness only: term-level holes are unrepresentable because the compile boundary forces an empty obligation set on every declared argument. Relational quantification over related backends is no longer an open boundary: #215 replaced the function `f` with a relation `R` and re-derived this theorem as the `graphOf f` instance (`backend_replacement_congruence_of_parametricity`, guarded by `congruence_correspondence`), so nothing here is now stated more generally than what is proved. Untested boundary: contexts carrying assurances moved by the relabel, two-way acceptance, relational forms for the composed-context and whole-program congruences (#277), how the *equivalence relations* at different semantics compare (#268 \u2014 the observation functions are separated, the relations are not), and a semantics-parametric congruence witness on a certificate-bearing fragment (#269). The disagreeing-carrier boundary (#270) is closed by `cycle_admissible` and `congruence_witness_sem`: admissibility and congruence now hold on the same cycle where grounded and stable observations differ. The fixture remains certificate-free."
