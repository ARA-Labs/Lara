logic_revisions_turn6:
- turn: 6
  entry: logic/solution/constraints.md#research-process-semantics
  field: section
  before: '## Research-process semantics (approved, not implemented)


    - **Status:** The user approved the revised plan and ARA process-record contract. All implementation
    and proof obligations remain pending under [issue #23](https://github.com/ARA-Labs/Lara/issues/23).

    - **Constraint:** A record denotes valid histories paired with allowed reporting choices under an
    explicit model, scoped coverage assumptions and a submission cutoff. Certainty requires a nonempty
    compatible set. Refuting the proposed false laws precedes later preservation proofs; approval is not
    proof of those countermodels.

    - **Argument boundary:** Claim-level entitlement allows a different warrant witness in each completion.
    Auditing a submitted ARA argument fixes its witness and exact source/run/version bindings across all
    completions. Both judgments remain separate from truth and BHL knowledge.

    - **Extraction boundary:** The decoded-record bridge must preserve every modeled generating history
    satisfying admitted source assumptions. Missing order or coverage stays unknown; failed sibling trials
    remain relevant even without attack edges. Finite enumeration bounds, source fidelity, coverage admission
    and statistical calibration/independence assumptions remain explicit.

    - **Delivery boundary:** The approved work covers the symbolic contract, Lean proofs, decoded fixtures
    and the reference runner. It does not change the core or wire, regenerate the corpus, implement physical
    capture or parse arbitrary ARA prose. The empirical-design gate remains closed.

    - **Evidence:** `plans/research-process-semantics/README.md`; `plans/research-process-semantics/ara-contract.md`;
    `ara/trace/exploration_tree.yaml:N381_process_semantics_approved`.

    - **Provenance:** user-revised

    - **Last revised:** 2026-10-10 (2026-10-10_001#5)'
  after: 'Implemented research-process semantics: status, constraint, argument, extraction and delivery
    boundaries reconciled with the landed proofs; evidence now points to docs/theory-process.md and N382;
    open items are issues 38-40 and 22.'
  signal: artifact-commitment
  provenance: ai-suggested
  note: Heading renamed from "(approved, not implemented)"; O209 and the turn-5 revision keep the old
    anchor as historical pointers.
