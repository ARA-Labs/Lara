      Both review passes reported zero correctness defects across the 624
      inserted lines, and independently reproduced all three gates. Everything
      actioned this turn was non-vacuity, doc precision, or tracking.
  - turn: 2
    excerpt: >
      Source-level obstruction to #184 as written: CompilerInvariant has only
      ranged and conflictComplete. With empty contraries and exceptions every
      HasAttack constructor is impossible, so compiled frameworks are
      edgeless; a one-node self-edge remains ranged and conflictComplete is
      vacuous. The requested converse therefore cannot hold for arbitrary
      fixed policies.
  - turn: 2
    excerpt: >
      Isomorphism must preserve the total Nat attack function, not only
      in-range Fin positions. Otherwise a target framework can carry an
      out-of-range true edge invisible to the bijection, and
      compilerInvariant_iso cannot transport ranged.
