logic_revisions:
  - turn: 2
    entry: C30
    field: Conditions
    before: >
      Holds for ground, first-order instantiation with an explicit substitution
      (no unification in the trusted core) and a property that is compositional
      over term structure. Mechanized here for well-sortedness; the untested
      boundary is a property that is not compositional — one where an
      instantiated atom can fail although every pattern and every range term
      passes.
    after: >
      Holds for ground, first-order instantiation with an explicit substitution
      (no unification in the trusted core) and a property compositional over
      term structure. Mechanized here for the finite ground environment and for
      premises, conclusions, and answers of actual rule instances recursively
      reachable through accepted support terms. Exception-pattern and
      attack/undercut closure is not included in checkUnit_wellSorted; those
      remain separate per-pattern applications of wellSorted_subst.
    signal: artifact-commitment
    provenance: ai-suggested
    note: "External review exposed that the former whole-unit wording exceeded the theorem conclusion."
  - turn: 2
    entry: C30
    field: Falsification
    before: >
      Exhibit an accepted unit containing an ill-sorted reachable atom — a
      premise, conclusion, answer, or exception atom that wsAtom rejects —
      while stage 2 accepted the unit. That would contradict
      checkUnit_wellSorted directly. A weaker refutation: show that the
      per-instance theta-range check can be deleted without any accepted unit
      gaining an ill-sorted conclusion, which would mean the lemma's premise was
      never load-bearing.
    after: >
      Exhibit an accepted unit whose ground environment or actual recursively
      reachable support-rule premise, conclusion, or answer is ill-sorted while
      stage 2 accepts it. That would contradict checkUnit_wellSorted directly.
      An ill-sorted instantiated exception would expose the explicitly unproved
      boundary rather than directly contradict this theorem.
    signal: artifact-commitment
    provenance: ai-suggested
  - turn: 2
    entry: C30
    field: Proof
    before: >
      lean/Lara/Sigma.lean (wellSorted_subst, wellSorted_rule);
      lean/Lara/Check/Unit.lean (checkUnit_wellSorted);
      docs/mechanization-plan.md result 13;
      fixtures/mutants/*--wrong-theta-sort-*.sexp
    after: >
      lean/Lara/Sigma.lean (wellSorted_subst, wellSorted_rule);
      lean/Lara/Check/Unit.lean (thetaWellSorted_ruleSortRespecting,
      checkUnit_wellSorted); docs/mechanization-plan.md result 13;
      fixtures/mutants/*--wrong-theta-sort-*.sexp
    signal: artifact-commitment
    provenance: ai-suggested
  - turn: 7
    entry: H13
    field: new
    before: null
    after: >
      Close a cross-language AST mirror before extending its source surface:
      first port every live field and reachable datatype, then require both
      compilers to witness constructor shape and compare one normalized
      inventory in CI.
    signal: verbal-affirmation
    provenance: ai-suggested

