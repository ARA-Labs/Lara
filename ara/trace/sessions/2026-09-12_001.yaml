    non-UTF-8 program case, which is the one the cross-driver comparison cannot see
    because both PW doors share the boundary. cabal test all PASS, lake build 218
    jobs, AxCheck coverage 3127 declarations, axiom audit passed, Lean citations PASS
    (420), differential negative pass=66 fail=0. This supersedes turn 1's 16 / 20 for
    the same gate; turn 1's numbers stand as the record of that run.
