    stderr, argv, the file-system encoding (//ROUNDTRIP) and the locale encoding
    (strict utf8)
- turn: 3
  type: experiment
  id: N334_solo_locale_gate
  routing: direct
  provenance: ai-executed
  summary: Five locale cases for the solo door in test/CliSpec.hs (accept, rejection
    diagnostics, deps, non-UTF-8 program text, non-UTF-8 path argument), each rerun
    under LC_ALL=C; found and fixed a second, pre-existing crash on a path argument
    that is not UTF-8; cabal test all, pw-conformance (ISO-8859-1 built, nothing
    skipped), map-conformance and both ARA gates pass
- turn: 3
  type: observation
  id: O176
  routing: staged
  provenance: ai-suggested
  summary: A text boundary belongs to the process, not the door; its output half is
    retargeted with it. Not promoted.
- turn: 3
  type: observation
  id: O177
  routing: staged
  provenance: ai-suggested
  summary: A locale gate must decode the child's streams itself, or it tests the
    suite's environment. Not promoted.
- turn: 4
  type: decision
  id: N335_reader_totalization
  routing: direct
  provenance: ai-executed
  summary: >-
    Totalize the wire reader rather than defer the bound's metatheory. A partial def has no
    kernel reduction behaviour, so the enforcement had no theorem attachable to it;
    the element loop's missing consumption fact is carried in the result type (Parsed)
    because proving it afterwards is circular, and parseWire re-exports Except String Sx so
    no consumer sees the subtype. Fuel and a token-stream stack machine were rejected for
    paying in contract rather than in proof effort.
- turn: 4
  type: experiment
  id: N335_bound_proved
  routing: direct
  provenance: ai-executed
  summary: >-
    Five theorems pinned in AxCheck.lean with fifteen supporting lemmas — the bound fires on
    depth alone before dispatch, a failed element read is located at the post-skipSpace
    state, and any input opening more than maxDepth lists before its first form is refused
    at line 1 column maxDepth+2. Gates unmodified and unmoved — lake build 218 jobs, AxCheck
    coverage 3147, axiom audit passed, differential 673/66/3, map 1322 plus 2 depth cases,
    pw 7/101/114 plus 1/17/21. No corpus regeneration, no freeze-tag bump.
- turn: 4
  type: observation
  id: O178
  routing: staged
  provenance: ai-suggested
  summary: >-
    A partial def is an enforcement with no theorem attachable to it, so totality is a
    precondition for the metatheory rather than a refinement. Not promoted.
- turn: 4
  type: observation
  id: O179
  routing: staged
  provenance: ai-suggested
  summary: >-
    A consumer loop's termination fact belongs in the callee's result type; proving it
    afterwards is circular, and the alternatives pay in contract. Not promoted.
- turn: 4
  type: observation
  id: O180
  routing: staged
  provenance: ai-suggested
  summary: >-
    A differential pins a boundary's wording tightly and its location only where it samples;
    the position theorem is the half no exit-code-only family can see. Not promoted.
