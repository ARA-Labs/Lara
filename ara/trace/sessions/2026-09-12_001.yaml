  after: >-
    ... Which a generated case cannot. Since that remedy is no longer symmetric in
    kind: the Lean half of the boundary is proved, not only differentialled. The reader was
    a `partial def`, which the kernel cannot reduce, so no statement about it was
    dischargeable; it is now total, and `parseForm_of_maxDepth_lt` plus
    `parseWire_nested_error` make the refusal — and, in
    `parseList_error_of_parseForm_error`, the *position* it is reported at — unconditional
    on one side rather than sampled by an anchor set on both. This narrows the recorded
    blindness for this one property only. The Haskell reader carries no such proof, so the
    two sides are still tied by cases and by the constant check; and the theorems are
    refusal statements, so accepting behaviour at or under the bound remains gate evidence
    alone.
