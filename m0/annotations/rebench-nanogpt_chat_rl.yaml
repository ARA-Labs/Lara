    holes:
      - "The optimality half is asserted only via a falsification challenge ('demonstrate a rule with fewer than N-1 calls'); the elimination lower-bound argument is left implicit and unproven in the artifact."
      - "'Judge-preferred winner' is undefined under the actually-stochastic judge (pair-order randomization, nondeterministic verdicts per N100/N104); the N-1 lower bound presumes a consistent comparator."
      - "No experiment records inspection of the tournament code path: E03, the only cited experiment, covers generation-parameter alignment and lists only C03 under 'Verifies' — the E03 citation in C04's Proof does not match E03's procedure."
      - "The latency sub-claim has no timing measurement, and at deployed scale (up to 8192 first-round matches per step vs max_workers=20) plus MALT throughput evidence (C06/C07, N604), wall-clock latency is judge-throughput-bound, not round-bound."
    coverage_flags:
