    uncertain: true
    note: "Coin-flip judgment flagged: N604 undercut vs none. It attacks the parallelism=>round-latency link on the same judge API, but under agent-side code, 5 responses/prompt, and late-session quota exhaustion, while the official run (N07) completed; classified undercut of the latency sub-claim's support because the claim's latency assertion depends on exactly the throughput condition N604 shows can fail. All other 14 dead ends are rejected designs or infra failures — none."
