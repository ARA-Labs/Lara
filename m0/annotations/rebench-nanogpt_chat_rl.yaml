artifact: rebench-nanogpt_chat_rl
group: rebench
annotator: "ai-executed (claude, 2026-07-21)"
deadend_cap: "capped at 15 of 40 — classified every dead end bearing on C04's subject (judge-call budget / best-of-N selection / tournament structure: N50, N53, N601, N604), then filled remaining slots in ascending node-ID order (N52, N58, N101, N103, N201, N202, N204, N206, N208, N251, N354)"
claims:
  - claim_id: C04
    claim_type: implementation-behavioral
    proposition_shape:
      sketch: "judge_call_optimal(selection=single_elim_tournament, n_candidates=8, calls_per_prompt=7, roundrobin_calls=28, latency_rounds=3)"
      arity: 5
      phase0_nullary_sufficient: false
      note: "The checkable content is exactly the arithmetic structure: 7 = N-1, 28 = N(N-1)/2, 3 = ceil(log2 8). A nullary 'tournament is optimal' atom would erase the re-checkable identities and the falsification criterion's quantification over selection rules with fewer than N-1 calls."
    inference_scheme:
      scheme: analytic_proof
      strict_or_defeasible: strict
      premises:
        - "A single-elimination bracket on N candidates plays exactly N-1 matches: each match eliminates exactly one candidate and N-1 candidates must be eliminated."
        - "Any selection rule that reliably identifies a pairwise-preferred winner among N candidates needs at least N-1 pairwise judge calls (every non-winner must lose at least once) — valid only if the judge behaves as a consistent comparator so 'judge-preferred winner' is well-defined."
        - "The implementation realizes single elimination with one judge call per match and dispatches within-round matches concurrently via evaluate(..., max_workers=20) (rl_finetune_best_of_n.py:110-139), so per-prompt selection depth is ceil(log2 N) = 3 dependent rounds rather than N-1 = 7 sequential calls."
      supporting_experiments: [E03]
    strict_certifier: reference-nd
    certifier_note: "The counting identities (single-elim on 8 uses 4+2+1 = 7 = N-1 calls; round-robin uses 8*7/2 = 28; depth ceil(log2 8) = 3) and the elimination lower bound (a certified winner requires >= N-1 losses, one per eliminated candidate) are small deductive derivations formalizable as an ND proof from the definition of a pairwise-selection procedure with a consistent comparator. What the certifier cannot cover: that rl_finetune_best_of_n.py:118-139 actually implements single elimination (attested code inspection) and that the judge is a consistent comparator (empirical, and doubtful — see CQ2)."
    critical_questions:
      - cq: "Does the recorded inspection procedure cover the tournament code path whose behavior the claim asserts?"
        mandatory: true
        status: unmet-gap
        basis: "E03 Procedure steps 1-3 inspect only model.GPT.generate_strings_autobatch and the generation-parameter overrides (model.py:369-402, rl_finetune_best_of_n.py:91-99); no step reads the tournament loop at rl_finetune_best_of_n.py:118-139 or counts judge calls, and E03's 'Verifies' field lists only C03. The code citation in C04's Proof stands in for an inspection that no experiment records."
      - cq: "Is the Llama-3-8b judge a consistent comparator, so that 'judge-preferred winner' is well-defined and the N-1 lower bound transfers?"
        mandatory: true
        status: unmet-gap
        basis: "Nothing in E01-E04 Setup/Procedure characterizes judge determinism or transitivity; the artifact's own trace shows the judge randomizes pair order and returns nondeterministic verdicts (exploration_tree.yaml N100 approach_context, N104: bit-identical weights scored differently on the alpaca head). Under a noisy comparator the tournament selects *a* winner, and the deterministic N-1 optimality argument does not directly apply. Leaves the optimality half unestablished; nothing shown proves a cheaper reliable rule exists."
      - cq: "Is worker parallelism sufficient at the deployed scale for rounds, not calls, to determine latency?"
        mandatory: false
        status: unmet-gap
        basis: "E01 Setup/Procedure: 2048 prompts per step with best_of=8, i.e. up to 2048 x 4 = 8192 first-round matches per step, dispatched through max_workers=20. E03 Metrics record 'code-path equality; no numeric metric' and Baselines: none — no timing measurement exists, and at 20 workers the round structure cannot be the binding latency unit at batch scale."
      - cq: "Is the alternative-selection baseline (round-robin, best-of-2) characterized for the comparison implicit in 'optimal'?"
        mandatory: false
        status: met
        basis: "The alternatives and their call counts are enumerated with the deltas: best-of-2 as one noisy judge call per prompt and full round-robin at 4x judge cost (exploration_tree.yaml N05 alternatives; E02 Setup describes the best-of-2 base configuration). The comparison is analytic, so an executed baseline run is not required for the counting claim."
    leaf_granularity: per-experiment-claim
    leaves:
      - atom: "the shipped selection loop is a 3-round single-elimination tournament issuing one judge call per match, 7 calls per prompt at N=8"
        provenance: attested
        refs: ["logic/claims.md C04", "rl_finetune_best_of_n.py:118-139", "trace/exploration_tree.yaml N05"]
      - atom: "full round-robin at N=8 would use N(N-1)/2 = 28 judge calls per prompt"
        provenance: attested
        refs: ["logic/claims.md C04", "trace/exploration_tree.yaml N05 alternatives"]
      - atom: "within-round matches are dispatched in parallel via evaluate(..., max_workers=20)"
        provenance: attested
        refs: ["logic/claims.md C04", "rl_finetune_best_of_n.py:110-115", "trace/exploration_tree.yaml N05"]
      - atom: "no selection rule with fewer than N-1 pairwise judge calls reliably picks a judge-preferred winner"
        provenance: assumed
        refs: ["logic/claims.md C04 falsification criterion (posed as an open challenge; no proof recorded in the artifact)"]
      - atom: "per-prompt selection latency equals ceil(log2 8) = 3 judge rounds rather than 7 sequential calls"
        provenance: assumed
        refs: ["logic/claims.md C04 (asserted from code structure; no timing measurement anywhere in logic/experiments.md)"]
