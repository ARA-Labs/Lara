name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  haskell:
    name: Haskell (cabal build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC and cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-version: 'latest'
          cabal-update: false

      - name: Update package index
        run: |
          cabal user-config update
          cabal_config="$(cabal path --output-format=json | jq -r '."config-file"')"
          sed -i 's|url: http://hackage.haskell.org/|url: https://hackage.haskell.org/|' "$cabal_config"
          # Keep Hackage Security enabled: signed metadata provides index
          # authenticity and rollback protection independently of HTTPS.
          for attempt in 1 2 3; do
            if cabal update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Configure
        run: cabal configure --enable-tests

      - name: Freeze dependencies
        run: cabal freeze

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: ${{ runner.os }}-cabal-

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test all --test-show-details=direct

  lean:
    name: Lean (lake build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache lake build
        uses: actions/cache@v4
        with:
          path: lean/.lake
          key: ${{ runner.os }}-lake-${{ hashFiles('lean/lake-manifest.json', 'lean/lean-toolchain') }}
          restore-keys: ${{ runner.os }}-lake-

      - name: Build
        run: lake build

      - name: Axiom audit (no `sorry`, only standard axioms)
        run: |
          out="$(lake env lean AxCheck.lean)"
          echo "$out"
          if echo "$out" | grep -q 'sorryAx'; then
            echo "::error::A proof depends on sorryAx (sorry/admit)."
            exit 1
          fi
          # Every axiom named in a `[...]` list must be in the standard trio.
          bad="$(echo "$out" \
            | grep -oE '\[[^]]*\]' \
            | tr -d '[]' | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -vE '^(propext|Classical\.choice|Quot\.sound)$' \
            | grep -v '^$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::A proof depends on a non-standard axiom: $bad"
            exit 1
          fi
          echo "Axiom audit passed."
