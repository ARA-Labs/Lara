 <p class="rise" style="max-width:64ch">Take the chain <code>a → b → c → d</code> (a attacks b, b attacks c, c attacks d; nothing else).</p>
 <div class="graph rise" style="justify-content:flex-start;margin-top:.5rem">
   <div class="gnode"><div class="nd">a</div></div><span class="arrow">→</span>
   <div class="gnode"><div class="nd">b</div></div><span class="arrow">→</span>
   <div class="gnode"><div class="nd">c</div></div><span class="arrow">→</span>
   <div class="gnode"><div class="nd">d</div></div>
 </div>
 <p class="rise" style="margin-top:.9rem;max-width:64ch">Compute the grounded extension by <strong>iterating the defense operator F<sub>def</sub> from ∅</strong> (slide 27). Write down each round until nothing changes, and give the final <span class="g">in</span>/<span class="r">out</span> label of every argument.</p>
 <p class="rise note">Hint: round 0 admits only the arguments with no attacker at all.</p>`,

/* 69 — P2 answer */
`<div class="rise sec"><b>Practice 2</b> · worked answer</div>
 <h2 class="rise">The chain <span class="em">alternates</span>: in, out, in, out.</h2>
 <div class="codebox rise sm">Round 0:  F<sub>def</sub>(∅)      = { a }        <span class="c">a is the only unattacked argument</span>
Round 1:  F<sub>def</sub>({a})    = { a, c }     <span class="c">c's sole attacker b is now attacked by a ⇒ c is defended</span>
Round 2:  F<sub>def</sub>({a,c})  = { a, c }     <span class="c">d's attacker c is in but nothing attacks c ⇒ d NOT defended. Fixpoint.</span>
grounded = { a, c }        b and d are out</div>
 <div class="graph rise" style="justify-content:flex-start;margin-top:.9rem">
   <div class="gnode in"><div class="nd">a</div><span class="tag">in</span></div><span class="arrow">→</span>
   <div class="gnode out"><div class="nd">b</div><span class="tag">out</span></div><span class="arrow">→</span>
   <div class="gnode in"><div class="nd">c</div><span class="tag">in</span></div><span class="arrow">→</span>
   <div class="gnode out"><div class="nd">d</div><span class="tag">out</span></div>
 </div>
 <p class="rise" style="margin-top:.7rem;max-width:66ch">The engine <em>discovers</em> the pattern: a is forced in; that knocks b out; b being out <strong>reinstates</strong> c; c being in knocks d out. Grounded never guesses — every membership is forced by the round before it. (This is exactly the ascending chain <code>∅ ⊆ F<sub>def</sub>(∅) ⊆ F<sub>def</sub>²(∅) ⊆ …</code> stabilizing, slide 26.)</p>`,

/* 70 — P3 question */
`<div class="rise sec"><b>Practice 3</b> · a cycle with a tail</div>
 <h2 class="rise">Where grounded and preferred part ways.</h2>
 <p class="rise" style="max-width:64ch">A two-cycle with one extra edge: <code>a ⇄ b</code> (a and b attack each other) and <code>b → c</code>.</p>
 <div class="graph rise" style="justify-content:flex-start;margin-top:.5rem">
   <div class="gnode"><div class="nd">a</div></div><span class="arrow">⇄</span>
   <div class="gnode"><div class="nd">b</div></div><span class="arrow">→</span>
   <div class="gnode"><div class="nd">c</div></div>
 </div>
 <ul class="rise" style="margin-top:.9rem">
   <li>What is the <strong>grounded</strong> labelling (in / out / undec for a, b, c)?</li>
   <li>What are <em>all</em> the <strong>preferred</strong> extensions?</li>
 </ul>
 <p class="rise note">Hint: grounded refuses to break a symmetric tie (slide 16); preferred commits as much as it defensibly can, and there may be several (slide 17). Watch what happens to c under each choice.</p>`,

/* 71 — P3 answer */
`<div class="rise sec"><b>Practice 3</b> · worked answer</div>
 <h2 class="rise">Grounded stays out of it; preferred splits into two.</h2>
 <p class="rise" style="max-width:66ch"><strong>Grounded = ∅, everything <span class="u">undec</span>.</strong> a and b attack each other with no tie-breaker, so neither can be forced in and neither is knocked out — both <span class="u">undec</span>. c's only attacker is b, which is undec, so c is <span class="u">undec</span> too (no attacker is <span class="r">out</span>, none is <span class="g">in</span>).</p>
 <div class="two tight rise" style="margin-top:.6rem">
   <div class="box def" style="margin:0"><span class="lab">Preferred #1 = {a, c}</span><p>Pick a. Then a defends itself (a counter-attacks b). With b thereby knocked out, c is <strong>reinstated</strong> — a → b → c, the slide-9 pattern. Maximal: adding b breaks conflict-freeness.</p></div>
   <div class="box def" style="margin:0"><span class="lab">Preferred #2 = {b}</span><p>Pick b instead. b defends itself against a. But now c <em>cannot</em> join: c's attacker is b, and b is the very argument we accepted — nothing in the set counter-attacks b, so c is not defended. Maximal on its own.</p></div>
 </div>
 <p class="rise note" style="margin-top:.8rem">The even cycle is a genuine dilemma: two coherent worldviews, {a, c} and {b}. Grounded is the timid intersection of them (∅); preferred keeps both. Note c's fate <em>depends on which side you take</em> — accepted in one worldview, rejected in the other.</p>`,

/* 72 — P4 question */
`<div class="rise sec"><b>Practice 4</b> · the odd cycle</div>
 <h2 class="rise">When decisiveness becomes impossible.</h2>
 <p class="rise" style="max-width:64ch">The three-cycle <code>a → b → c → a</code> (each attacks the next; c loops back to a).</p>
 <div class="graph rise" style="justify-content:flex-start;margin-top:.5rem">
   <div class="gnode"><div class="nd">a</div></div><span class="arrow">→</span>
   <div class="gnode"><div class="nd">b</div></div><span class="arrow">→</span>
   <div class="gnode"><div class="nd">c</div></div><span class="arrow">↺</span>
 </div>
 <p class="rise" style="margin-top:.4rem;max-width:60ch"><span class="note" style="margin:0">(the last arrow closes the loop: <code>c → a</code>)</span></p>
 <ul class="rise" style="margin-top:.7rem">
   <li>What is the grounded extension?</li>
   <li>Does a <strong>stable</strong> extension exist? Try to build one and see what breaks.</li>
 </ul>
 <p class="rise note">Recall stable (slide 18): a conflict-free S whose range S⁺ (everything S attacks) is <em>exactly</em> everything outside S — nothing may be left undecided.</p>`,

/* 73 — P4 answer */
`<div class="rise sec"><b>Practice 4</b> · worked answer</div>
 <h2 class="rise">Grounded = ∅; <span class="em">no</span> stable extension exists.</h2>
 <p class="rise" style="max-width:66ch"><strong>Grounded:</strong> no argument is unattacked (each has exactly one attacker inside the loop), so round 0 already gives ∅ and it never grows. All three are <span class="u">undec</span> — the odd cycle can't be broken from the outside.</p>
 <p class="rise" style="max-width:66ch;margin-top:.6rem"><strong>Stable?</strong> Try the only candidates — single arguments (any two are in conflict, so no bigger conflict-free set exists):</p>
 <div class="codebox rise sm" style="margin-top:.4rem">try S = {a}:   a attacks b, so S⁺ = {b}.   Outside S = {b, c}.   c is left undecided ✗
try S = {b}:   S⁺ = {c}.   Outside = {a, c}.   a is left undecided ✗
try S = {c}:   S⁺ = {a}.   Outside = {a, b}.   b is left undecided ✗</div>
 <p class="rise" style="margin-top:.8rem;max-width:66ch">Every candidate leaves one argument neither accepted nor attacked, so <strong>no stable extension exists</strong> — the promised failure from slide 22. This is <em>the</em> reason semi-stable was invented: it keeps as much decisiveness as possible (here it falls back to ∅) while always existing.</p>`,

/* 74 — P5 question */
`<div class="rise sec"><b>Practice 5</b> · name that attack (ASPIC⁺)</div>
 <h2 class="rise">Three objections. Which of the three attacks is each?</h2>
 <p class="rise" style="max-width:66ch">Argument <strong>B</strong> says: "the dataset shows method M scored higher <em>(premise)</em>, and a controlled comparison licenses <em>(defeasible rule)</em> the conclusion <em>M is better</em>." Classify each objection as <span class="r">rebut</span>, <span class="r">undercut</span>, or <span class="r">undermine</span>, and say <em>which position</em> of B it targets.</p>
 <ul class="rise" style="margin-top:.7rem">
   <li><strong>(i)</strong> "Your score table was mislabeled — M's number is actually lower."</li>
   <li><strong>(ii)</strong> "There was a distribution shift, so a controlled comparison doesn't license anything <em>here</em>."</li>
   <li><strong>(iii)</strong> "I have an equally-supported argument that M is <em>not</em> better."</li>
 </ul>
 <p class="rise note">Reminder (slides 41–44): the three attacks hit the three parts of a proof tree — a <em>premise</em>, an <em>inference step</em>, a <em>conclusion</em>. Only defeasible parts can be hit.</p>`,

/* 75 — P5 answer */
`<div class="rise sec"><b>Practice 5</b> · worked answer</div>
 <h2 class="rise">One objection per structural position.</h2>
 <table class="dt rise">
   <tr><th>Objection</th><th>Attack</th><th>Target position in B</th><th>Why</th></tr>
   <tr><td class="lacks">(i) the number is wrong</td><td class="sys">undermine</td><td class="lacks">a <strong>premise</strong> leaf</td><td class="lacks">it concludes a contrary of B's ordinary premise (the raw datum). Kill the input.</td></tr>
   <tr><td class="lacks">(ii) comparison doesn't apply</td><td class="sys">undercut</td><td class="lacks">the <strong>defeasible rule</strong> step</td><td class="lacks">it says nothing about whether M is better — it voids the <em>licence to infer</em> via the rule's name n(r).</td></tr>
   <tr><td class="lacks">(iii) opposite finding</td><td class="sys">rebut</td><td class="lacks">the <strong>conclusion</strong></td><td class="lacks">a head-on clash: an equally-typed argument for the contrary of Conc(B), both defeasible.</td></tr>
 </table>
 <p class="rise" style="margin-top:.9rem;max-width:68ch">Two things to carry away. First, <strong>undercut is preference-independent</strong> — if the rule genuinely doesn't apply, B's strength is irrelevant (slide 47). Rebut and undermine (i, iii) are weighed by preference. Second, none of these could touch a <em>strict</em> step or an <em>axiom</em> premise: conflict is funnelled onto the defeasible parts (slide 45).</p>`,

/* 76 — conclusion */
`<div class="rise sec"><b>Conclusion</b> · synthesis</div>
 <p class="rise hook">Who attacks whom &nbsp;→&nbsp; <span class="em">what you may accept.</span></p>
 <p class="rise lead" style="max-width:52ch;margin-top:1.2rem"><span class="em">Dung</span> turns an attack graph into extensions by a monotone fixpoint — grounded is the least one, computed by iterating from the unattacked. <span class="em">ASPIC⁺</span> builds that graph from a defeasible theory: strict vs defeasible rules, three located attacks, preferences lifting attack to defeat — engineered so the extensions stay consistent.</p>
 <div class="rise" style="margin-top:1.8rem;font-family:var(--mono);font-size:clamp(12px,1.35vw,18px);color:var(--faint);letter-spacing:.02em">theory ⟶ arguments + defeat ⟶ Dung AF ⟶ grounded lfp ⟶ justified formulas</div>
 <div class="rise note" style="margin-top:1.6rem">Dung 1995 · Prakken 2010 · Modgil &amp; Prakken 2013/2018 · Caminada &amp; Amgoud 2007. &nbsp;<b style="color:var(--dim)">Questions welcome.</b></div>`,

];

const deck=document.getElementById('deck'),dots=document.getElementById('dots');
const centered=new Set([0, 2, 32, 53, 65, slides.length-1]);   // title, Part I / Part II / deep-dive / practice dividers, conclusion
slides.forEach((html,i)=>{
  const s=document.createElement('section');
  s.className='slide'+(centered.has(i)?' center':'');
  s.innerHTML=html;
  deck.appendChild(s);
  const d=document.createElement('button');d.className='dot';d.setAttribute('aria-label','Slide '+(i+1));d.onclick=()=>go(i);dots.appendChild(d);
});
const nodes=[...document.querySelectorAll('.slide')],dotNodes=[...document.querySelectorAll('.dot')];
document.getElementById('tot').textContent=slides.length;
let idx=0;
function go(n){
  idx=Math.max(0,Math.min(slides.length-1,n));
  nodes.forEach((s,i)=>s.classList.toggle('active',i===idx));
  dotNodes.forEach((d,i)=>d.classList.toggle('on',i===idx));
  document.getElementById('cur').textContent=idx+1;
  document.getElementById('bar').style.width=(idx/(slides.length-1)*100)+'%';
  document.querySelector('.theme-tag').style.display=centered.has(idx)?'none':'block';
  location.hash=idx+1;
}
function next(){go(idx+1)} function prev(){go(idx-1)}
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();next();}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(slides.length-1);}
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
});
let sx=null;
addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){dx<0?next():prev();}sx=null;},{passive:true});
deck.addEventListener('click',e=>{if(e.target.closest('.dot'))return;const r=innerWidth*0.28;e.clientX<r?prev():next();});
go(parseInt(location.hash.slice(1))-1||0);
</script>
</body>
</html>
