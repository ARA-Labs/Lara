<head>

<title>ASPIC⁺ · Dung — a tutorial</title>
<style>
  :root{
    --bg:#0f1216; --panel:#161b22; --panel2:#0c0f13;
    --ink:#eceff4; --dim:#aab4c0; --faint:#6b7684; --line:#2a323d;
    --accent:#7aa2f7; --accent2:#e0a458;
    --good:#7bcf9a; --bad:#e88b8e; --undec:#d9be6a;
    --thm:#7aa2f7; --def:#9d8cf0; --cor:#7bcf9a;
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;

  }

  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}

  .slide.active{display:flex;opacity:1}
  .slide.center{justify-content:center}
  .slide.active .rise{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
  .slide.active .rise:nth-child(2){animation-delay:.04s}
  .slide.active .rise:nth-child(3){animation-delay:.08s}
  .slide.active .rise:nth-child(4){animation-delay:.12s}
  .slide.active .rise:nth-child(5){animation-delay:.16s}
  .slide.active .rise:nth-child(6){animation-delay:.2s}
  .slide.active .rise:nth-child(7){animation-delay:.24s}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

  .sec{font-family:var(--sans);font-size:clamp(11px,1.1vw,15px);letter-spacing:.04em;color:var(--faint);margin-bottom:1.4rem;display:flex;gap:.6em;align-items:baseline}
  .sec b{color:var(--accent);font-weight:600}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(34px,5.6vw,74px);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:clamp(23px,3.2vw,44px);line-height:1.12;letter-spacing:-.005em;margin-bottom:1.4rem}
  h2 .em{color:var(--accent)}
  p,li{font-size:clamp(14px,1.5vw,21px);line-height:1.5;color:var(--dim)}
  p strong,li strong{color:var(--ink);font-weight:600}
  .subtitle{font-family:var(--serif);font-size:clamp(18px,2.3vw,32px);color:var(--dim);line-height:1.3;margin-top:1.5rem;max-width:34ch}
  .byline{margin-top:2.4rem;font-size:clamp(13px,1.3vw,18px);color:var(--faint);line-height:1.7}
  .byline b{color:var(--ink);font-weight:600}
  .venue{font-family:var(--mono);font-size:clamp(11px,1.15vw,15px);letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-top:.4rem}
  code,.mono{font-family:var(--mono)}
  .cite{color:var(--faint);font-style:italic}
  em{color:var(--dim);font-style:italic}

  .codebox{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;
    padding:clamp(.8rem,1.7vw,1.4rem) clamp(1rem,2vw,1.7rem);font-family:var(--mono);
    font-size:clamp(12px,1.4vw,20px);color:var(--ink);line-height:1.6;margin:.4rem 0;white-space:pre-wrap;overflow-x:auto}
  .codebox.sm{font-size:clamp(11px,1.2vw,16px);line-height:1.55}
  .c{color:var(--faint)} .k{color:var(--accent)} .o{color:var(--accent2)} .v{color:var(--def)}
  .g{color:var(--good)} .r{color:var(--bad)} .u{color:var(--undec)}

  .box{border:1px solid var(--line);border-radius:8px;padding:clamp(.9rem,1.9vw,1.4rem) clamp(1.1rem,2.1vw,1.7rem);margin:.5rem 0;background:var(--panel)}
  .box .lab{font-family:var(--sans);font-weight:700;font-size:clamp(13px,1.35vw,19px);margin-bottom:.5rem;display:block}
  .box .lab .id{color:var(--faint);font-weight:400;font-style:italic}
  .box p{font-size:clamp(13px,1.4vw,19px)}
  .box.thm{border-left:3px solid var(--thm)} .box.thm .lab{color:var(--thm)}
  .box.def{border-left:3px solid var(--def)} .box.def .lab{color:var(--def)}
  .box.cor{border-left:3px solid var(--cor)} .box.cor .lab{color:var(--cor)}
  .box .stmt{font-family:var(--serif);font-style:italic;color:var(--ink);font-size:clamp(14px,1.5vw,21px);line-height:1.4}
  .box .pf{font-size:clamp(12px,1.25vw,16px);color:var(--faint);margin-top:.6rem}
  .box .pf b{color:var(--dim);font-style:normal}

  .rule{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--mono);font-size:clamp(12px,1.35vw,19px);margin:.4rem 1.2rem .4rem 0;color:var(--ink)}
  .rule .prem{padding:0 .8em .25em}
  .rule .bar{border-top:1.5px solid var(--accent);width:100%;position:relative}
  .rule .bar .rn{position:absolute;right:-.2em;top:-.7em;transform:translateX(100%);color:var(--accent);font-size:.72em}
  .rule .concl{padding:.25em .8em 0}
  .rules{display:flex;flex-wrap:wrap;align-items:flex-start;margin-top:.6rem}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1rem,2.6vw,2.4rem);align-items:start}
  .two.tight{gap:clamp(.8rem,1.8vw,1.5rem)}
  ul{list-style:none;display:flex;flex-direction:column;gap:.55rem;margin-top:.3rem}
  li{position:relative;padding-left:1.5em}
  li::before{content:"▸";position:absolute;left:0;top:0;color:var(--accent);font-size:.85em}
  ol.out{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:.6rem}
  ol.out li{counter-increment:s;padding-left:2.4em;font-size:clamp(14px,1.5vw,23px);color:var(--faint);transition:color .2s}
  ol.out li.on{color:var(--ink)}

  ol.out li.on::before{opacity:1}
  ol.out.split{display:grid;grid-template-columns:1fr 1fr;gap:.5rem 2.4rem}

  table.dt{border-collapse:collapse;width:100%;margin-top:.5rem;font-size:clamp(11px,1.25vw,17px)}
  table.dt td,table.dt th{border:1px solid var(--line);padding:.45em .65em;text-align:left;vertical-align:top}
  table.dt th{font-family:var(--sans);font-weight:700;color:var(--accent2);font-size:.92em}
  table.dt td.sys{font-weight:600;color:var(--ink);white-space:nowrap}
  table.dt td.lacks{color:var(--dim)}
  table.dt .done{color:var(--good)} table.dt .part{color:var(--undec)} table.dt .todo{color:var(--faint)}
  table.dt .thm{font-family:var(--mono);color:var(--dim);font-size:.92em}

  .states{display:flex;gap:clamp(.5rem,1.3vw,1rem);flex-wrap:wrap;margin-top:.6rem}
  .st{flex:1;min-width:120px;border:1px solid var(--line);border-radius:9px;padding:clamp(.7rem,1.6vw,1.1rem);background:var(--panel)}
  .st .n{font-family:var(--mono);font-weight:600;font-size:clamp(13px,1.5vw,20px);margin-bottom:.25rem}
  .st p{font-size:clamp(11px,1.2vw,15px);color:var(--dim)}
  .st.j{border-color:#2f5a41} .st.j .n{color:var(--good)}
  .st.g{border-color:#4a4530} .st.g .n{color:var(--undec)}
  .st.d{border-color:#5a3132} .st.d .n{color:var(--bad)}
  .st.c{border-color:#33475e} .st.c .n{color:var(--accent)}

  .note{font-family:var(--sans);font-size:clamp(11px,1.15vw,15px);color:var(--faint);margin-top:1.1rem}
  .lead{font-family:var(--serif);font-size:clamp(19px,2.6vw,38px);line-height:1.3;color:var(--ink);max-width:28ch;font-style:italic}
  .lead .em{color:var(--accent);font-style:normal}
  .hook{font-family:var(--serif);font-weight:600;font-size:clamp(30px,5vw,66px);line-height:1.05;letter-spacing:-.01em;color:var(--ink)}
  .hook .em{color:var(--accent)}

  /* mini attack-graph renderer */
  .graph{display:flex;gap:clamp(1.4rem,4vw,3.6rem);align-items:center;flex-wrap:wrap;margin:.6rem 0}
  .gnode{display:flex;flex-direction:column;align-items:center;gap:.35rem}
  .gnode .nd{width:clamp(38px,4.4vw,58px);height:clamp(38px,4.4vw,58px);border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-weight:700;font-size:clamp(14px,1.7vw,24px);border:2px solid var(--line);background:var(--panel);color:var(--ink)}
  .gnode.in .nd{border-color:var(--good);color:var(--good);box-shadow:0 0 0 4px rgba(123,207,154,.09)}
  .gnode.out .nd{border-color:var(--bad);color:var(--bad);opacity:.72}
  .gnode.undec .nd{border-color:var(--undec);color:var(--undec)}
  .gnode .tag{font-family:var(--mono);font-size:clamp(9px,1vw,13px);letter-spacing:.05em}
  .gnode.in .tag{color:var(--good)} .gnode.out .tag{color:var(--bad)} .gnode.undec .tag{color:var(--undec)}
  .arrow{font-family:var(--mono);font-size:clamp(16px,2vw,28px);color:var(--faint)}
  .gcap{font-family:var(--sans);font-size:clamp(11px,1.2vw,16px);color:var(--dim);margin-top:.4rem;text-align:center}

  .theme-tag{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:var(--serif);font-style:italic;font-size:clamp(11px,1.15vw,15px);color:var(--faint);z-index:19;opacity:.5;white-space:nowrap;pointer-events:none}
  @media (max-width:760px){.theme-tag{display:none}}
  #bar{position:fixed;left:0;bottom:0;height:2px;background:var(--accent);width:0;transition:width .3s ease;z-index:20}
  #hud{position:fixed;right:20px;bottom:12px;font-family:var(--mono);font-size:11px;color:var(--faint);z-index:20;letter-spacing:.08em}
  #hud b{color:var(--dim)}
  #dots{position:fixed;left:20px;bottom:11px;display:flex;gap:5px;z-index:20;max-width:62vw;flex-wrap:wrap}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--line);cursor:pointer;transition:all .2s;border:0;padding:0}
  .dot.on{background:var(--accent);transform:scale(1.35)}
  #hint{position:fixed;top:13px;right:20px;font-family:var(--mono);font-size:10px;color:var(--faint);z-index:20;letter-spacing:.05em;opacity:.65}
  .brand{position:fixed;top:13px;left:20px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--faint);z-index:20}
  .brand b{color:var(--accent)}
  @media (max-width:760px){.two{grid-template-columns:1fr}ol.out.split{grid-template-columns:1fr}#dots{display:none}}
</style>
</head>
<body>
<div class="brand"><b>ARGUMENTATION</b> · tutorial</div>
<div id="hint">← → space · f</div>
<div id="deck"></div>
<div id="bar"></div>
<div id="hud"><b id="cur">1</b> / <span id="tot">1</span></div>
<div class="theme-tag">who attacks whom → what may we accept</div>
<div id="dots"></div>

<script>
const slides = [

/* 0 — title */
`<div class="rise venue">A teaching walkthrough · formal argumentation</div>
 <h1 class="rise" style="margin-top:1.2rem">ASPIC⁺ &amp; Dung</h1>
 <p class="rise subtitle">From an attack graph to what a rational agent may accept — and how a defeasible logic theory <em>builds</em> that graph.</p>
 <div class="rise byline">
   <b>Two layers, bottom-up:</b><br>
   <span style="color:var(--dim)">Dung — abstract semantics on a digraph &nbsp;·&nbsp; ASPIC⁺ — the structured front-end that produces one.</span>
 </div>
 <div class="rise note" style="margin-top:2rem">We build everything from scratch. Every term is defined in words before any symbol appears, and every definition gets a small worked example. Take your time.</div>`,

/* 1 — roadmap */
`<div class="rise sec"><b>Roadmap</b> · where we're going</div>
 <ol class="out split">
   <li class="rise">Why argumentation? Reasoning that can be <em>defeated</em></li>
   <li class="rise">Dung's move: keep only the attack graph</li>
   <li class="rise">Conflict-free, defense, admissibility — slowly</li>
   <li class="rise">The five semantics, one at a time, with motivation</li>
   <li class="rise">The hierarchy, existence facts, the lattice</li>
   <li class="rise">The fixpoint view — Knaster–Tarski, built up gently</li>
   <li class="rise">Labellings (in/out/undec) &amp; the three canonical graphs</li>
   <li class="rise">ASPIC⁺: where arguments come from</li>
   <li class="rise">Systems, knowledge bases, arguments-as-proof-trees</li>
   <li class="rise">The three attacks; preferences → defeat</li>
   <li class="rise">Compilation to Dung; justified formulas; postulates</li>
   <li class="rise">The full Tweety example, step by step</li>
   <li class="rise">Weakest- vs last-link; contraries; recovering ABA</li>
   <li class="rise">Synthesis</li>
 </ol>`,

/* ===================== PART I — DUNG ===================== */

/* 2 — part divider */
`<div class="rise sec"><b>Part I</b> · Dung's abstract frameworks</div>
 <p class="rise hook">Keep only <span class="em">who attacks whom.</span></p>
 <p class="rise lead" style="margin-top:1.3rem;max-width:44ch">Throw away what arguments <em>say</em>; retain a directed graph of attacks. Acceptability becomes a purely graph-theoretic — indeed fixpoint — question.</p>
 <p class="rise note">Dung, 1995. The single most-cited move in the field: forget content, compute on structure.</p>`,

/* 3 — motivation: why do we care */
`<div class="rise sec"><b>§0</b> Why argumentation at all?</div>
 <h2 class="rise">Real reasoning can be <span class="em">taken back.</span></h2>
 <p class="rise" style="max-width:66ch">Classical logic is <strong>monotonic</strong>: once you prove something, adding more facts never retracts it. But that is not how people, courts, doctors, or scientists reason. We draw a plausible conclusion, then <em>withdraw</em> it when a better reason shows up.</p>
 <p class="rise" style="max-width:66ch;margin-top:.8rem">"The ground is wet, so it rained." Then: "…but the sprinkler was on." The new fact did not contradict a theorem — it <strong>defeated a defeasible inference</strong>. We need a logic where conclusions can be <em>attacked</em> and <em>defended</em>.</p>
 <p class="rise lead" style="margin-top:1rem;max-width:52ch">Argumentation is the study of <span class="em">which conclusions survive</span> once every objection is on the table.</p>`,

/* 4 — the abstraction move */
`<div class="rise sec"><b>§0</b> The one idea</div>
 <h2 class="rise">Dung's insight: <span class="em">the content doesn't matter — the conflicts do.</span></h2>
 <p class="rise" style="max-width:66ch">Suppose you have a pile of arguments, each with its own internal logic. To decide which ones are acceptable, Dung claims you need <strong>only one relation</strong>: for each pair, does one <em>attack</em> the other?</p>
 <p class="rise" style="max-width:66ch;margin-top:.8rem">Everything else — what the arguments are made of, how they were built — can be forgotten for now. What remains is a <strong>directed graph</strong>: nodes are arguments, edges are attacks.</p>
 <div class="rise note" style="margin-top:1rem">Why is this powerful? Because "which arguments should I accept, given who attacks whom" is a question we can answer <em>once and for all</em>, abstractly — and reuse for any source of arguments. Part II will be one such source.</div>`,

/* 5 — AF definition */
`<div class="rise sec"><b>§1</b> The object</div>
 <h2 class="rise">An argumentation framework is <span class="em">a digraph</span>. Full stop.</h2>
 <div class="box def rise"><span class="lab">Argumentation framework</span>
   <p class="stmt">F = (A, R), &nbsp; R ⊆ A × A.</p>
   <p style="margin-top:.5rem">A is a set of <strong>arguments</strong> (the nodes). R is the <strong>attack relation</strong>. We write <code>a → b</code> for (a,b) ∈ R and read it "<strong>a attacks b</strong>." That is <em>all</em> the data — no logic, no structure inside a node, just labelled dots and arrows.</p>
 </div>
 <p class="rise" style="margin-top:1rem;max-width:66ch">Think of it exactly like any digraph you already know. The only unusual thing is what the edges <em>mean</em>: an arrow into b is a reason to doubt b.</p>`,

/* 6 — reading the graph: S attacks, range */
`<div class="rise sec"><b>§1</b> Two pieces of shorthand</div>
 <h2 class="rise">Lifting attack from single arguments to <span class="em">sets.</span></h2>
 <p class="rise" style="max-width:66ch">Very soon we'll accept <em>sets</em> of arguments together, so we need to say when a whole set attacks something, and how much "ground" a set covers.</p>
 <div class="codebox rise sm" style="margin-top:.6rem">for S ⊆ A:   "<span class="o">S attacks b</span>"   ⟺   ∃ a ∈ S.  a → b      <span class="c">— some member of S attacks b</span>
             S⁺ = { b | S attacks b }        <span class="c">— the "range" of S: everything S hits</span></div>
 <p class="rise" style="margin-top:1rem;max-width:66ch">Read <strong>S⁺</strong> ("S-plus") as the set of arguments the set S manages to knock at. Keep it in mind — the range is the whole story behind <em>stable</em> and <em>semi-stable</em> semantics later.</p>`,

/* 7 — the central question */
`<div class="rise sec"><b>§1</b> The question the whole theory answers</div>
 <p class="rise lead" style="max-width:56ch">Given this graph,<br><span class="em">which sets of arguments may we rationally accept together?</span></p>
 <p class="rise" style="max-width:66ch;margin-top:1.4rem">A candidate answer is a set S ⊆ A — an <strong>extension</strong>. But not any set will do. Intuitively an acceptable position must be (i) internally non-contradictory and (ii) able to <em>stand up</em> to the arguments that attack it. The next three definitions make each of those precise, and everything else in Part I is built from them.</p>`,

/* 8 — conflict-free */
`<div class="rise sec"><b>§2</b> Definition 1 of 3 — coherence</div>
 <h2 class="rise">Conflict-free: <span class="em">don't accept both sides of a fight.</span></h2>
 <p class="rise" style="max-width:66ch">First requirement on any acceptable position: it must not contain an argument that attacks another member of the same position. You cannot coherently endorse both a and b if a → b.</p>
 <div class="box def rise" style="margin-top:.9rem"><span class="lab">Conflict-free</span>
   <p class="stmt">S is conflict-free &nbsp;iff&nbsp; for no a, b ∈ S do we have (a,b) ∈ R.</p>
 </div>
 <div class="graph rise" style="justify-content:flex-start;margin-top:1rem">
   <div class="gnode in"><div class="nd">a</div></div><span class="arrow">→</span><div class="gnode"><div class="nd">b</div></div>
 </div>
 <p class="rise note">Here {a} and {b} are conflict-free, but {a, b} is <em>not</em> — a attacks b. Conflict-freeness is necessary but nowhere near sufficient: {b} alone is conflict-free yet b is under attack with no defender.</p>`,

/* 9 — defense */
`<div class="rise sec"><b>§2</b> Definition 2 of 3 — self-defense</div>
 <h2 class="rise">Defense: <span class="em">whoever comes for me, my set takes them out.</span></h2>
 <p class="rise" style="max-width:66ch">Being attacked isn't fatal — if the attacker is <em>itself</em> attacked by something in your set, the threat is neutralized. We say the set <strong>defends</strong> its member.</p>
 <div class="box def rise" style="margin-top:.9rem"><span class="lab">Defense / acceptability</span>
   <p class="stmt">S <strong>defends</strong> a &nbsp;iff&nbsp; for every b with b → a, there is some c ∈ S with c → b.</p>
   <p style="margin-top:.4rem">Every attacker of a is counter-attacked by a member of S. An argument with <em>no</em> attackers is defended by <em>any</em> set, vacuously.</p>
 </div>
 <div class="graph rise" style="justify-content:flex-start;margin-top:.9rem">
   <div class="gnode in"><div class="nd">c</div></div><span class="arrow">→</span><div class="gnode out"><div class="nd">b</div></div><span class="arrow">→</span><div class="gnode in"><div class="nd">a</div></div>
 </div>
 <p class="rise note">b attacks a, but c attacks b. So {c} defends a. The counter-attacker c reinstates a.</p>`,

/* 10 — characteristic function */
`<div class="rise sec"><b>§2</b> Definition 3 of 3 — the engine</div>
 <h2 class="rise">Bundle "everything S defends" into one <span class="em">function.</span></h2>
 <p class="rise" style="max-width:66ch">Defense is a relation between a set and an argument. Collect, for a given S, <em>all</em> the arguments it defends. That collection is a new set — so we have a function from sets to sets. This single operator drives all of Dung semantics.</p>
 <div class="box def rise" style="margin-top:.9rem"><span class="lab">Characteristic function <span class="id">F<sub>def</sub></span></span>
   <p class="stmt">F<sub>def</sub>(S) = { a ∈ A | S defends a }.</p>
   <p style="margin-top:.4rem">It lives on the lattice (2<sup>A</sup>, ⊆) — the powerset of arguments ordered by inclusion. Crucially it is <strong>monotone</strong>: if S ⊆ T then F<sub>def</sub>(S) ⊆ F<sub>def</sub>(T). A bigger accepted set can only defend <em>more</em>, never less (more counter-attackers available).</p>
 </div>
 <p class="rise note">Hold onto monotonicity — it is the hinge on which the entire fixpoint story (and the grounded algorithm) turns.</p>`,

/* 11 — admissibility */
`<div class="rise sec"><b>§2</b> Putting the three together</div>
 <h2 class="rise">Admissible = <span class="em">coherent and self-defending.</span></h2>
 <p class="rise" style="max-width:66ch">Now combine the two requirements from slide 7. An acceptable position should (i) be conflict-free and (ii) defend every one of its own members. In symbols, everything in S is also in F<sub>def</sub>(S).</p>
 <div class="box def rise" style="margin-top:.9rem"><span class="lab">Admissible set</span>
   <p class="stmt">S is admissible &nbsp;iff&nbsp; S is conflict-free &nbsp;and&nbsp; S ⊆ F<sub>def</sub>(S).</p>
   <p style="margin-top:.4rem">"S defends all of itself." This is the minimal notion of a rationally defensible stance. Note ∅ is always admissible — it defends nothing and conflicts with nothing.</p>
 </div>
 <p class="rise lead" style="margin-top:1rem;max-width:54ch">Every semantics we're about to meet is just a <span class="em">policy for choosing among admissible sets.</span></p>`,

/* 12 — micro-exercise: question */
`<div class="rise sec"><b>Check your understanding</b></div>
 <h2 class="rise">A 30-second exercise.</h2>
 <p class="rise" style="max-width:60ch">Consider the chain <code>a → b → c</code> (a attacks b, b attacks c; nothing else).</p>
 <div class="graph rise" style="justify-content:flex-start;margin-top:.6rem">
   <div class="gnode"><div class="nd">a</div></div><span class="arrow">→</span>
   <div class="gnode"><div class="nd">b</div></div><span class="arrow">→</span>
   <div class="gnode"><div class="nd">c</div></div>
 </div>
 <ul class="rise" style="margin-top:1rem">
   <li>Is the set {a, c} conflict-free?</li>
   <li>Does {a, c} defend both of its members?</li>
   <li>So is {a, c} admissible?</li>
 </ul>
 <p class="rise note">Try it before flipping. Hint: check each attacker of a and of c, and ask whether the set counter-attacks it.</p>`,

/* 13 — micro-exercise: answer */
`<div class="rise sec"><b>Check your understanding</b> · the answer</div>
 <h2 class="rise">{a, c} is admissible — in fact it's the whole story here.</h2>
 <div class="graph rise" style="justify-content:flex-start">
   <div class="gnode in"><div class="nd">a</div><span class="tag">in</span></div><span class="arrow">→</span>
   <div class="gnode out"><div class="nd">b</div><span class="tag">out</span></div><span class="arrow">→</span>
   <div class="gnode in"><div class="nd">c</div><span class="tag">in</span></div>
 </div>
 <ul class="rise" style="margin-top:.9rem">
   <li><strong>Conflict-free?</strong> Yes — a does not attack c and c does not attack a.</li>
   <li><strong>Defends a?</strong> a has no attacker, so vacuously yes.</li>
   <li><strong>Defends c?</strong> c's only attacker is b; and a → b, with a ∈ the set. So yes.</li>
 </ul>
 <p class="rise" style="margin-top:.8rem;max-width:66ch">So {a, c} is admissible. Notice we also have F<sub>def</sub>({a,c}) = {a, c} exactly — it is a <em>fixpoint</em>. That property has a name: <strong>complete</strong>. It's where the semantics start.</p>`,

/* 14 — semantics intro */
`<div class="rise sec"><b>§3</b> What a "semantics" is</div>
 <h2 class="rise">A semantics = <span class="em">a policy for how greedy to be.</span></h2>
 <p class="rise" style="max-width:66ch">Admissibility is a floor, not an answer — ∅ clears it. A <strong>semantics</strong> σ picks out the <em>distinguished</em> admissible sets, called the <strong>σ-extensions</strong>: the positions a rational agent following that policy is entitled to hold.</p>
 <p class="rise" style="max-width:66ch;margin-top:.8rem">The five classic policies differ along one axis: <em>how much do you commit to?</em> From maximally cautious (accept only what is forced) to maximally bold (take a stance on everything). We'll meet them one at a time, each with its own "why you'd want this."</p>
 <p class="rise note">Reminder of the vocabulary: an <strong>extension</strong> is a set that counts as rationally acceptable under the chosen policy.</p>`,

/* 15 — complete */
`<div class="rise sec"><b>§3</b> Semantics 1 — complete</div>
 <h2 class="rise">Complete: <span class="em">accept exactly what you can defend.</span></h2>
 <p class="rise" style="max-width:66ch">An admissible set defends all of itself. A <strong>complete</strong> extension goes one step further: it also <em>contains</em> everything it defends. No under-commitment (it already defends more) and no over-commitment (everything in it is defended). It is a fixpoint of the engine.</p>
 <div class="box def rise" style="margin-top:.8rem"><span class="lab">Complete extension</span>
   <p class="stmt">S is complete &nbsp;iff&nbsp; S is admissible &nbsp;and&nbsp; S = F<sub>def</sub>(S).</p>
 </div>
 <p class="rise" style="margin-top:.9rem;max-width:66ch">Every other semantics we discuss is a <strong>special kind of complete extension</strong> — so complete is the common substrate. (Our {a, c} above was complete.)</p>`,

/* 16 — grounded */
`<div class="rise sec"><b>§3</b> Semantics 2 — grounded</div>
 <h2 class="rise">Grounded: <span class="em">the maximally skeptical position.</span></h2>
 <p class="rise" style="max-width:66ch">Sometimes you want to commit to as little as possible — only conclusions that are <em>forced</em>, with no arbitrary choices. That is the <strong>grounded</strong> extension: the ⊆-smallest complete extension.</p>
 <div class="box def rise" style="margin-top:.8rem"><span class="lab">Grounded extension</span>
   <p class="stmt">The ⊆-<strong>least</strong> complete extension. It always exists and is <strong>unique.</strong></p>
 </div>
 <p class="rise" style="margin-top:.9rem;max-width:66ch">Why prefer it? It never makes a leap of faith. If two arguments symmetrically attack each other with no tie-breaker, grounded refuses to pick — it stays out of both. This is the semantics most often wanted for a single "safe" answer, and (spoiler) the one with the cleanest algorithm.</p>`,

/* 17 — preferred */
`<div class="rise sec"><b>§3</b> Semantics 3 — preferred</div>
 <h2 class="rise">Preferred: <span class="em">the maximally credulous coherent stance.</span></h2>
 <p class="rise" style="max-width:66ch">The opposite temperament: commit to as much as you defensibly can. A <strong>preferred</strong> extension is a ⊆-<em>maximal</em> admissible set — you can't add any argument without breaking coherence or defense.</p>
 <div class="box def rise" style="margin-top:.8rem"><span class="lab">Preferred extension</span>
   <p class="stmt">A ⊆-<strong>maximal</strong> admissible set. Always exists — but there may be <strong>several.</strong></p>
 </div>
 <p class="rise" style="margin-top:.9rem;max-width:66ch">Why several? A genuine dilemma (a two-cycle a ⇄ b) yields two maximal defensible stances: {a} and {b}. Preferred semantics <em>keeps both</em> rather than collapsing to the timid ∅. Use it when you want to enumerate all the coherent worldviews the evidence supports.</p>`,

/* 18 — stable */
`<div class="rise sec"><b>§3</b> Semantics 4 — stable</div>
 <h2 class="rise">Stable: <span class="em">take a stance on everything.</span></h2>
 <p class="rise" style="max-width:66ch">A <strong>stable</strong> extension leaves nothing undecided: every argument you don't accept, you actively knock out. Recall the range S⁺ — the arguments S attacks. Stable says the "outside" is exactly the range.</p>
 <div class="box def rise" style="margin-top:.8rem"><span class="lab">Stable extension</span>
   <p class="stmt">S is stable &nbsp;iff&nbsp; S is conflict-free &nbsp;and&nbsp; S⁺ = A ∖ S. Every argument is either <em>in</em> S or <em>attacked by</em> S.</p>
 </div>
 <p class="rise" style="margin-top:.9rem;max-width:66ch">Very decisive — but it comes at a price on the next slide: a stable extension <strong>need not exist.</strong> A framework can be "too tangled" to take a full stance on everything at once.</p>`,

/* 19 — semi-stable */
`<div class="rise sec"><b>§3</b> Semantics 5 — semi-stable</div>
 <h2 class="rise">Semi-stable: <span class="em">as decisive as possible, but always there.</span></h2>
 <p class="rise" style="max-width:66ch">We want stable's decisiveness without its risk of non-existence. Compromise: among complete extensions, take the one whose <strong>range</strong> S ∪ S⁺ (what it accepts plus what it attacks) is ⊆-maximal — i.e. that leaves as little undecided as it can.</p>
 <div class="box def rise" style="margin-top:.8rem"><span class="lab">Semi-stable extension</span>
   <p class="stmt">A complete extension with ⊆-<strong>maximal</strong> range S ∪ S⁺.</p>
 </div>
 <p class="rise" style="margin-top:.9rem;max-width:66ch">In a finite framework it <em>always</em> exists, and whenever a stable extension exists the semi-stable ones coincide with it. So it's the graceful fallback: "be stable if you can, otherwise be as close as possible."</p>`,

/* 20 — recap table */
`<div class="rise sec"><b>§3</b> The five, side by side</div>
 <h2 class="rise">One table to hold them all.</h2>
 <table class="dt rise">
   <tr><th>Semantics</th><th>Definition (S conflict-free)</th><th>Temperament</th></tr>
   <tr><td class="sys">Complete</td><td class="lacks">admissible ∧ S = F<sub>def</sub>(S) &nbsp;(a fixpoint)</td><td class="lacks">accept exactly what you can defend</td></tr>
   <tr><td class="sys">Grounded</td><td class="lacks">the ⊆-<strong>least</strong> complete extension</td><td class="lacks">maximally skeptical — only the forced</td></tr>
   <tr><td class="sys">Preferred</td><td class="lacks">⊆-<strong>maximal</strong> admissible set</td><td class="lacks">maximally credulous coherent stance</td></tr>
   <tr><td class="sys">Stable</td><td class="lacks">conflict-free ∧ S⁺ = A∖S</td><td class="lacks">takes a stance on <em>everything</em></td></tr>
   <tr><td class="sys">Semi-stable</td><td class="lacks">complete with ⊆-maximal range S ∪ S⁺</td><td class="lacks">stable-like, but always exists</td></tr>
 </table>
 <p class="rise note">Read every row as "an admissible set that additionally satisfies … ." The differences are all in that "additionally."</p>`,

/* 21 — inclusion hierarchy */
`<div class="rise sec"><b>§3</b> How the semantics relate — the hierarchy</div>
 <h2 class="rise">Each is a <span class="em">special case</span> of the one to its right.</h2>
 <div class="codebox rise">stable  ⊆  preferred  ⊆  complete  ⊆  admissible</div>
 <p class="rise" style="margin-top:1rem;max-width:66ch">Read ⊆ here as "every extension of this kind is also of that kind." Every stable extension is preferred; every preferred extension is complete; every complete extension is admissible. So proving a fact about admissible sets automatically gives it to all four narrower classes.</p>
 <p class="rise note">Grounded sits inside complete too — it's the unique smallest one, so it's off to the side of this chain rather than on it.</p>`,

/* 22 — existence & uniqueness */
`<div class="rise sec"><b>§3</b> Which ones are you guaranteed?</div>
 <h2 class="rise">The existence &amp; uniqueness ledger.</h2>
 <ul class="rise">
   <li><strong>Grounded</strong> — always exists, and is <strong>unique.</strong> Your reliable default.</li>
   <li><strong>Complete</strong> — always exists (grounded is one).</li>
   <li><strong>Preferred</strong> — always exists, but there may be <strong>several.</strong></li>
   <li><strong>Semi-stable</strong> — always exists in a finite framework.</li>
   <li><strong>Stable</strong> — <strong>may not exist at all</strong> (recall the odd cycle, coming up).</li>
 </ul>
 <p class="rise note" style="margin-top:1rem">This ledger is exactly the sort of thing you mechanize once and lean on forever: "grounded is total and deterministic" is what lets a tool always return <em>an</em> answer.</p>`,

/* 23 — lattice structure */
`<div class="rise sec"><b>§3</b> A structural bonus</div>
 <h2 class="rise">The complete extensions form a <span class="em">lattice.</span></h2>
 <div class="box cor rise"><span class="lab">Lattice structure</span>
   <p class="stmt">Under ⊆, the complete extensions form a complete lattice, with the grounded extension as its bottom element.</p>
 </div>
 <p class="rise" style="margin-top:.9rem;max-width:66ch">"Bottom element" just means grounded sits below every other complete extension — consistent with it being the ⊆-least one. This is not a coincidence we have to check by hand: it falls straight out of the fixpoint theory on the next slides. The bottom of the fixpoint lattice literally <em>is</em> the grounded extension.</p>`,

/* 24 — fixpoint view: lattice intro */
`<div class="rise sec"><b>§4</b> Where your algebra pays off</div>
 <h2 class="rise">Set the stage: <span class="em">what lattice, what map?</span></h2>
 <p class="rise" style="max-width:66ch">We keep saying "fixpoint." Let's make it precise, gently. The playground is the powerset of arguments ordered by inclusion:</p>
 <div class="codebox rise sm" style="margin-top:.5rem">(2<sup>A</sup>, ⊆)   <span class="c">— every subset of A; the order is "is a subset of"</span>
    bottom ⊥ = ∅          top ⊤ = A
    meets = ⋂ (intersection)     joins = ⋃ (union)</div>
 <p class="rise" style="margin-top:.9rem;max-width:66ch">This is a <strong>complete lattice</strong>: every collection of subsets has a greatest lower bound (their intersection) and least upper bound (their union). On it sits our map F<sub>def</sub>: sets → sets. A <strong>fixed point</strong> is any S with F<sub>def</sub>(S) = S — and we noted those are exactly the complete extensions.</p>`,

/* 25 — monotonicity */
`<div class="rise sec"><b>§4</b> The property that makes it all work</div>
 <h2 class="rise">F<sub>def</sub> is <span class="em">monotone.</span></h2>
 <div class="box thm rise"><span class="lab">Monotonicity</span>
   <p class="stmt">S ⊆ T &nbsp;⟹&nbsp; F<sub>def</sub>(S) ⊆ F<sub>def</sub>(T).</p>
 </div>
 <p class="rise" style="margin-top:.9rem;max-width:66ch"><strong>Why?</strong> Suppose S defends a. That means every attacker b of a is counter-attacked by <em>some</em> member of S. But every member of S is also in T. So the same counter-attackers still live in T — T defends a too. Adding arguments never removes a defense.</p>
 <p class="rise lead" style="margin-top:1rem;max-width:54ch">Monotone map + complete lattice = <span class="em">Knaster–Tarski applies.</span></p>`,

/* 26 — Knaster–Tarski statement */
`<div class="rise sec"><b>§4</b> The theorem</div>
 <h2 class="rise">Grounded = the <span class="em">least fixed point</span> of F<sub>def</sub>.</h2>
 <div class="box thm rise"><span class="lab">Knaster–Tarski, applied</span>
   <p class="stmt">On the complete lattice (2<sup>A</sup>, ⊆), the monotone map F<sub>def</sub> has a complete lattice of fixed points — and those fixed points are <em>exactly</em> the complete extensions. Its <strong>least</strong> fixed point is the grounded extension.</p>
 </div>
 <div class="codebox rise sm" style="margin-top:.8rem">grounded  =  lfp(F<sub>def</sub>)  =  ⋂ { S | F<sub>def</sub>(S) = S }        <span class="c">— intersect all fixpoints</span></div>
 <p class="rise note" style="margin-top:.9rem">So "grounded is unique and always exists" (slide 22) and "grounded is the lattice bottom" (slide 23) are the <em>same</em> fact viewed twice. The algebra hands them to us for free.</p>`,

/* 27 — iteration from empty */
`<div class="rise sec"><b>§4</b> …and it's computable</div>
 <h2 class="rise">Reach the least fixpoint by <span class="em">iterating from ∅.</span></h2>
 <div class="codebox rise">grounded  =  ⋃ₙ F<sub>def</sub>ⁿ(∅)        <span class="c">— when A is finite / F<sub>def</sub> continuous</span></div>
 <p class="rise" style="margin-top:1rem;max-width:66ch">Start from nothing and keep applying the engine:</p>
 <ul class="rise" style="margin-top:.4rem">
   <li><strong>F<sub>def</sub>(∅)</strong> = the <em>unattacked</em> arguments — they need no defender, so ∅ already defends them.</li>
   <li><strong>F<sub>def</sub>²(∅)</strong> = the above, <em>plus</em> whatever they now defend (their counter-attacks reinstate more).</li>
   <li>…keep going until nothing new appears.</li>
 </ul>
 <p class="rise" style="margin-top:.8rem;max-width:66ch">This ascending chain <em>is</em> the standard grounded algorithm: "follow the forced consequences." We run it explicitly in Deep dive B, and prove it correct.</p>`,

/* 28 — labellings intro */
`<div class="rise sec"><b>§5</b> A second, equivalent language</div>
 <h2 class="rise">Label every argument <span class="em">in · out · undec.</span></h2>
 <p class="rise" style="max-width:66ch">Instead of naming a set of accepted arguments, colour <em>every</em> argument with one of three statuses: <span class="g">in</span> (accepted), <span class="r">out</span> (rejected), <span class="u">undec</span> (can't decide). A labelling is <strong>complete</strong> when the colours are locally consistent:</p>
 <div class="codebox rise sm" style="margin-top:.6rem">a is <span class="g">in</span>     ⟺  ALL attackers of a are <span class="r">out</span>          <span class="c">nothing standing threatens it</span>
a is <span class="r">out</span>    ⟺  SOME attacker of a is <span class="g">in</span>         <span class="c">it's been knocked out</span>
a is <span class="u">undec</span>  ⟺  neither of the above holds       <span class="c">no attacker in, but not all out</span></div>
 <p class="rise note" style="margin-top:.8rem">If you've seen Kripke's theory of truth or 3-valued logic: <code>undec</code> is exactly the "gap" fixpoint value — the status you're forced into by a cycle you can't break.</p>`,

/* 29 — labelling ↔ extension */
`<div class="rise sec"><b>§5</b> Same content, two spellings</div>
 <h2 class="rise">Labellings and extensions are <span class="em">the same thing.</span></h2>
 <p class="rise" style="max-width:66ch">A complete labelling and a complete extension are inter-translatable: take the <span class="g">in</span>-labelled arguments and you have a complete extension; conversely a complete extension induces a unique complete labelling. And the semantics we defined by "greed" become slogans about colours:</p>
 <div class="two tight" style="margin-top:.8rem">
   <p class="rise"><strong>grounded</strong> = maximal <span class="u">undec</span> &nbsp;— stay undecided whenever you're allowed to.</p>
   <p class="rise"><strong>preferred</strong> = maximal <span class="g">in</span> &nbsp;·&nbsp; <strong>stable</strong> = <em>no</em> <span class="u">undec</span> at all.</p>
 </div>
 <p class="rise note" style="margin-top:.9rem">Why keep both languages? Extensions are cleaner for proofs; labellings are cleaner for algorithms and for <em>seeing</em> the status of every argument at once — which is what the next three pictures do.</p>`,

/* 30 — three canonical graphs */
`<div class="rise sec"><b>§5</b> The three graphs to keep in your pocket</div>
 <h2 class="rise">The entire <span class="em">feel</span> of Dung semantics, in three pictures.</h2>
 <div class="two" style="grid-template-columns:1fr 1fr 1fr;gap:clamp(1rem,3vw,2.4rem)">
   <div class="rise">
     <div class="graph" style="justify-content:center">
       <div class="gnode in"><div class="nd">a</div><span class="tag">in</span></div>
       <span class="arrow">→</span>
       <div class="gnode out"><div class="nd">b</div><span class="tag">out</span></div>
     </div>
     <p class="gcap"><strong>a → b.</strong> grounded = {a}; b out. The forced case.</p>
   </div>
   <div class="rise">
     <div class="graph" style="justify-content:center">
       <div class="gnode undec"><div class="nd">a</div><span class="tag">undec</span></div>
       <span class="arrow">⇄</span>
       <div class="gnode undec"><div class="nd">b</div><span class="tag">undec</span></div>
     </div>
     <p class="gcap"><strong>2-cycle a ⇄ b.</strong> grounded = ∅; two preferred/stable: {a}, {b}. Genuine dilemma.</p>
   </div>
   <div class="rise">
     <div class="graph" style="justify-content:center">
       <div class="gnode undec"><div class="nd">a</div></div><span class="arrow">→</span>
       <div class="gnode undec"><div class="nd">b</div></div><span class="arrow">→</span>
       <div class="gnode undec"><div class="nd">c</div></div>
     </div>
     <p class="gcap"><strong>3-cycle a→b→c→a.</strong> all undec; grounded = ∅; <em>no</em> stable extension.</p>
   </div>
 </div>
 <p class="rise" style="margin-top:1.2rem;max-width:70ch">Walk them left to right. The single edge is the forced case grounded loves. The <strong>even</strong> cycle is a real dilemma: grounded stays out of it, but preferred keeps both {a} and {b}. The <strong>odd</strong> cycle is the troublemaker — nobody can be consistently <span class="g">in</span>, so everything is <span class="u">undec</span> and <em>no</em> stable extension exists.</p>`,

/* 31 — cycles takeaway */
`<div class="rise sec"><b>§5</b> The lesson of the cycles</div>
 <p class="rise lead" style="max-width:56ch">Odd cycles kill stable extensions and drown everything in <span class="em">undec</span>; even cycles split into multiple credulous positions.</p>
 <p class="rise" style="max-width:66ch;margin-top:1.3rem">This one observation is the source of nearly every subtlety later. When ASPIC⁺ produces a genuine two-way conflict with no preference to break it, you get a two-cycle → two preferred extensions → a formula that is credulously but not skeptically justified. When it produces a self-defeating loop, you get <code>undec</code> and the loss of stability. Keeping these three pictures in mind will let you <em>predict</em> the behaviour of the structured layer before you compute it.</p>`,

/* ===================== PART II — ASPIC+ ===================== */

/* 32 — part divider */
`<div class="rise sec"><b>Part II</b> · ASPIC⁺</div>
 <p class="rise hook">Where do the arguments and attacks <span class="em">come from?</span></p>
 <p class="rise lead" style="margin-top:1.3rem;max-width:46ch">Dung is silent on this. ASPIC⁺ is the standard recipe for <em>building</em> the attack graph out of logic-like ingredients — then hands the result back to Part I.</p>
 <p class="rise note">Prakken 2010; Modgil &amp; Prakken 2013/2018. The output of an ASPIC⁺ theory <em>is</em> a Dung AF — so everything in Part I applies to it.</p>`,

/* 33 — motivation for ASPIC+ */
`<div class="rise sec"><b>§6</b> The gap Dung leaves open</div>
 <h2 class="rise">Dung tells us how to <span class="em">judge</span> arguments — not how to <span class="em">make</span> them.</h2>
 <p class="rise" style="max-width:66ch">Part I assumed the graph was handed to us. But in practice we start from knowledge — facts, rules of thumb, hard laws — and we have to <em>construct</em> both the arguments and the attack edges. Which pairs actually conflict? When does one beat another?</p>
 <p class="rise" style="max-width:66ch;margin-top:.8rem">ASPIC⁺ is the standard, careful answer. It fixes a vocabulary of ingredients, defines arguments as proof trees over them, derives the three ways one argument can attack another, and uses preferences to turn attacks into <em>defeats</em>. The end product is a Dung AF — so we get all of Part I for free.</p>
 <p class="rise lead" style="margin-top:1rem;max-width:54ch">Think of ASPIC⁺ as the <span class="em">compiler front-end</span>; Dung is the back-end that evaluates.</p>`,

/* 34 — argumentation system */
`<div class="rise sec"><b>§6</b> Argumentation systems — the ingredients</div>
 <h2 class="rise">Four parts: <span class="em">language, contrariness, rules, names.</span></h2>
 <div class="codebox rise sm">AS = ( L , ‾·‾ , R , n )</div>
 <ul class="rise" style="margin-top:.6rem">
   <li><strong>L</strong> — a logical language. The framework stays agnostic about what's inside; often it's just literals like <code>p</code>, <code>¬p</code>.</li>
   <li><strong>‾·‾</strong> — a contrariness relation (next slide). It tells us which formulas <em>conflict</em>.</li>
   <li><strong>R = R<sub>s</sub> ⊎ R<sub>d</sub></strong> — the inference rules, split into <span class="o">strict</span> and <span class="r">defeasible</span> (two slides on). This split is the crux of the whole system.</li>
   <li><strong>n</strong> — a naming function that gives each defeasible rule a name inside L, so the language can talk <em>about</em> its own rules.</li>
 </ul>
 <p class="rise note">We'll take these one at a time. Don't try to absorb all four at once — the strict/defeasible split is where the real content is.</p>`,

/* 35 — strict vs defeasible */
`<div class="rise sec"><b>§6</b> The crux — two kinds of rule</div>
 <h2 class="rise">Strict rules are <span class="em">unbreakable</span>; defeasible rules are <span class="em">presumptions.</span></h2>
 <div class="two tight">
   <div class="box def rise" style="margin:0"><span class="lab">Strict &nbsp;<span class="id">φ₁ … φₙ → ψ</span></span>
     <p>Holds <strong>without exception.</strong> If you accept the premises you <em>must</em> accept ψ. Like "x is a penguin → x is a bird." You cannot attack a strict step.</p></div>
   <div class="box def rise" style="margin:0"><span class="lab">Defeasible &nbsp;<span class="id">φ₁ … φₙ ⇒ ψ</span></span>
     <p>A <strong>presumption</strong>, good by default but challengeable. "x is a bird ⇒ x flies." This is where exceptions, and therefore all conflict, live.</p></div>
 </div>
 <p class="rise" style="margin-top:1rem;max-width:66ch">Note the arrows: a single-shaft <code>→</code> is strict, a double-shaft <code>⇒</code> is defeasible. That typographic difference carries real weight — every attack in the system targets a defeasible arrow or an ordinary premise, never a strict arrow.</p>`,

/* 36 — contrariness */
`<div class="rise sec"><b>§6</b> Contrariness — conflict without negation</div>
 <h2 class="rise">‾·‾ generalizes "¬" to a bare <span class="em">conflict relation.</span></h2>
 <p class="rise" style="max-width:66ch">Rather than assume a classical negation, ASPIC⁺ takes a primitive map ‾·‾ : L → 2<sup>L</sup>. Reading: φ ∈ ‾ψ means "<strong>φ is a contrary of ψ</strong>" — deriving φ conflicts with ψ.</p>
 <div class="codebox rise sm" style="margin-top:.7rem"><span class="o">symmetric</span>   p ∈ ‾¬p‾  and  ¬p ∈ ‾p‾     <span class="c">genuine contradiction — both attack each other</span>
<span class="o">asymmetric</span>  φ ∈ ‾ψ‾   but  ψ ∉ ‾φ‾       <span class="c">φ defeats ψ, but not the reverse</span></div>
 <p class="rise" style="margin-top:.9rem;max-width:66ch">The asymmetric case is the interesting one: it models <strong>assumptions and exceptions</strong> — "innocent until proven guilty," where the presence of the contrary defeats the assumption but not vice versa. We return to this in Deep dive D.</p>`,

/* 37 — rule naming */
`<div class="rise sec"><b>§6</b> Naming rules — so the logic can self-reference</div>
 <h2 class="rise">n(r): giving each defeasible rule a <span class="em">name in the language.</span></h2>
 <p class="rise" style="max-width:66ch">Here's a subtlety that pays off enormously. For each defeasible rule r, the function n assigns a formula n(r) ∈ L meaning roughly "rule r applies here." Because n(r) is an ordinary formula, we can <em>argue about it</em> — in particular, we can derive its contrary.</p>
 <p class="rise" style="max-width:66ch;margin-top:.8rem">Deriving something in ‾n(r)‾ says "<strong>rule r does not apply</strong>" — without disputing r's conclusion directly. That is precisely the ammunition for <em>undercutting</em>, the most distinctive of the three attacks.</p>
 <p class="rise note">Example to come: "it looks red ⇒ it is red" carries a name; "a red light is shining on it" attacks that name, saying the rule is inapplicable here — while staying silent on whether the object really is red.</p>`,

/* 38 — knowledge base */
`<div class="rise sec"><b>§7</b> The knowledge base — what you start from</div>
 <h2 class="rise">Partition your premises into <span class="em">certain</span> and <span class="em">defeasible.</span></h2>
 <div class="box def rise"><span class="lab">Knowledge base K ⊆ L</span>
   <p><strong>K<sub>n</sub></strong> (axioms) — taken as certain; <em>cannot</em> be attacked.<br>
      <strong>K<sub>p</sub></strong> (ordinary premises) — accepted by default, but can be <em>undermined.</em></p>
   <p style="margin-top:.5rem">A full <strong>argumentation theory</strong> is an (AS, K) together with a preference order on arguments (§10).</p>
 </div>
 <p class="rise" style="margin-top:.9rem;max-width:66ch">Why the split? The same reason as strict-vs-defeasible rules: you need somewhere to put unshakeable facts (K<sub>n</sub>) separate from working assumptions (K<sub>p</sub>) that new information might overturn. All conflict is again pushed onto the defeasible side.</p>`,

/* 39 — arguments as proof trees */
`<div class="rise sec"><b>§8</b> Arguments — built inductively</div>
 <h2 class="rise">An argument is a <span class="em">proof tree</span> over K and R.</h2>
 <p class="rise" style="max-width:66ch">Arguments aren't atomic anymore — we <em>construct</em> them, from the leaves up, exactly like a natural-deduction derivation:</p>
 <div class="box def rise" style="margin-top:.6rem"><span class="lab">Argument (inductive)</span>
   <p>① Any φ ∈ K is an argument on its own, with Conc = φ (a leaf).<br>
      ② <strong>Strict step:</strong> given arguments A₁…Aₙ, if Conc(A₁)…Conc(Aₙ) → ψ is in R<sub>s</sub>, then combining them yields an argument concluding ψ.<br>
      ③ <strong>Defeasible step:</strong> the same, with a rule ⇒ from R<sub>d</sub> — and the argument <em>records</em> that it used that defeasible rule.</p>
 </div>
 <p class="rise note" style="margin-top:.8rem">So an argument is literally a FOL-style proof tree — except some edges are defeasible and some leaves are challengeable premises.</p>`,

/* 40 — accessors */
`<div class="rise sec"><b>§8</b> The accessors — how attacks find their target</div>
 <h2 class="rise">Every argument exposes a few <span class="em">handles.</span></h2>
 <div class="codebox rise sm">Conc(A)      <span class="c">— the conclusion of A</span>
Sub(A)       <span class="c">— all sub-arguments of A (every subtree, incl. A itself)</span>
TopRule(A)   <span class="c">— the last rule applied at A's root</span>
DefRules(A)  <span class="c">— every defeasible rule used anywhere in A</span></div>
 <p class="rise" style="margin-top:.9rem;max-width:66ch">Attacks are defined by pointing at these handles: undermine points at a premise leaf, undercut points at a defeasible <code>TopRule</code>, rebut points at the <code>Conc</code> of a defeasible sub-argument. Keep the vocabulary handy — the next slides use it constantly.</p>
 <div class="codebox rise sm" style="margin-top:.7rem">strict / "firm" argument  =  DefRules(A) = ∅  ∧  no ordinary premises</div>
 <p class="rise note">A firm argument uses no defeasible rule and no K<sub>p</sub> premise — so nothing can attack it. It's the ASPIC⁺ analogue of an unattacked Dung node.</p>`,

/* 41 — three attacks intro */
`<div class="rise sec"><b>§9</b> The three ways to attack — overview</div>
 <h2 class="rise">Three structurally distinct <span class="em">targets.</span></h2>
 <p class="rise" style="max-width:66ch">Since an argument is a tree with premises, inference steps, and a conclusion, there are exactly three places to strike. This is the heart of ASPIC⁺ — we take each with its own everyday example.</p>
 <table class="dt rise" style="margin-top:.5rem">
   <tr><th>Attack</th><th>Target</th><th>Everyday picture</th></tr>
   <tr><td class="sys">Undermine</td><td class="lacks">a <strong>premise</strong></td><td class="lacks">"your starting fact is wrong"</td></tr>
   <tr><td class="sys">Undercut</td><td class="lacks">an <strong>inference</strong></td><td class="lacks">"your reasoning doesn't apply here"</td></tr>
   <tr><td class="sys">Rebut</td><td class="lacks">a <strong>conclusion</strong></td><td class="lacks">"your conclusion is false"</td></tr>
 </table>
 <p class="rise note" style="margin-top:.9rem">Note: only <em>defeasible</em> parts can be targeted. Strict inferences and axiom premises are immune — we come back to why that matters.</p>`,

/* 42 — undermine */
`<div class="rise sec"><b>§9</b> Attack 1 — undermine</div>
 <h2 class="rise">Undermine: <span class="em">knock out a premise.</span></h2>
 <div class="box def rise"><span class="lab">Undermine</span>
   <p class="stmt">A undermines B &nbsp;iff&nbsp; Conc(A) ∈ ‾φ‾ for some <em>ordinary premise</em> φ ∈ K<sub>p</sub> used in B.</p>
   <p style="margin-top:.4rem">Axiom premises (K<sub>n</sub>) are immune — you cannot undermine a fact taken as certain.</p>
 </div>
 <p class="rise" style="margin-top:1rem;max-width:66ch"><strong>Everyday example.</strong> B argues: "the road is wet ⇒ it rained," starting from the ordinary premise <code>the road is wet</code>. A concludes <code>the road is not wet</code> (someone just washed a car). A's conclusion is a contrary of B's premise — so A undermines B at the root of the tree.</p>`,

/* 43 — undercut */
`<div class="rise sec"><b>§9</b> Attack 2 — undercut</div>
 <h2 class="rise">Undercut: <span class="em">void the reasoning, not the claim.</span></h2>
 <div class="box def rise"><span class="lab">Undercut</span>
   <p class="stmt">A undercuts B &nbsp;iff&nbsp; Conc(A) ∈ ‾n(r)‾ for a defeasible rule r used in B — i.e. A concludes "rule r does not apply."</p>
 </div>
 <p class="rise" style="margin-top:1rem;max-width:66ch"><strong>Everyday example.</strong> B argues: "the object looks red ⇒ it is red." A observes: "a red light is shining on it." A does <em>not</em> claim the object isn't red — it claims the <em>inference</em> "looks red ⇒ is red" is invalid <em>in this situation.</em> That's the whole point of undercut: it targets the licence to infer, via the rule's name n(r).</p>
 <p class="rise note">This is why rules needed names (§6): without n(r) there'd be no formula to derive a contrary of, and undercut couldn't be expressed.</p>`,

/* 44 — rebut */
`<div class="rise sec"><b>§9</b> Attack 3 — rebut</div>
 <h2 class="rise">Rebut: <span class="em">argue the opposite conclusion.</span></h2>
 <div class="box def rise"><span class="lab">Rebut</span>
   <p class="stmt">A rebuts B &nbsp;iff&nbsp; Conc(A) ∈ ‾Conc(B′)‾ for some sub-argument B′ of B whose <em>top rule is defeasible.</em></p>
 </div>
 <p class="rise" style="margin-top:1rem;max-width:66ch"><strong>Everyday example.</strong> B: "the barometer is falling ⇒ it will rain." A: "the sky is clear ⇒ it will not rain." Their conclusions are contraries, and both were reached defeasibly — so they rebut each other. This is a head-on clash of conclusions.</p>
 <p class="rise note">Why "defeasible top rule"? If B's conclusion followed by a <em>strict</em> rule from things you accept, disputing it would really be disputing those inputs — so rebut only bites where the last step was a presumption.</p>`,

/* 45 — can't attack strict/axioms */
`<div class="rise sec"><b>§9</b> The design principle behind all three</div>
 <h2 class="rise">Conflict is <span class="em">funnelled</span> onto the defeasible parts.</h2>
 <p class="rise lead" style="max-width:56ch">You cannot attack a <span class="em">strict rule</span> or an <span class="em">axiom.</span></p>
 <p class="rise" style="max-width:66ch;margin-top:1.2rem">Undermine hits only ordinary premises; undercut hits only defeasible rules; rebut hits only defeasible conclusions. Everything strict is untouchable. This is not an arbitrary restriction — it's exactly what makes the <strong>rationality postulates</strong> (§12) provable. If you could attack strict rules, the strict, "logical" core of your reasoning would be up for grabs and consistency guarantees would collapse.</p>
 <p class="rise note">Design slogan: keep the certain part inviolable; put all the fighting in the defeasible arena.</p>`,

/* 46 — preferences → defeat */
`<div class="rise sec"><b>§10</b> From attack to defeat</div>
 <h2 class="rise">Preferences decide <span class="em">who actually wins.</span></h2>
 <p class="rise" style="max-width:66ch">An attack is only a <em>challenge</em>. Whether it succeeds — becomes a <strong>defeat</strong>, the edge Dung will see — can depend on how the two arguments compare in strength (⪯).</p>
 <div class="codebox rise sm" style="margin-top:.6rem">A <span class="o">defeats</span> B  ⟺  A attacks B at B′,  and  ( the attack is preference-independent  ∨  A ⊀ B′ )</div>
 <p class="rise" style="margin-top:.9rem;max-width:66ch">Read the right side as: the attack goes through <em>unless</em> A is strictly weaker than the part it targets. If A is at least as strong, it wins; if A is the weakling, the attack fizzles.</p>`,

/* 47 — the asymmetry */
`<div class="rise sec"><b>§10</b> One asymmetry you must remember</div>
 <h2 class="rise">Undercut <span class="em">always</span> defeats; rebut &amp; undermine are weighed.</h2>
 <div class="two tight">
   <div class="box thm rise" style="margin:0"><span class="lab">Preference-independent</span>
     <p><strong>Undercut</strong> always defeats, regardless of strength. If the rule genuinely doesn't apply, how "strong" the argument is is irrelevant — the reasoning is simply void.</p></div>
   <div class="box thm rise" style="margin:0"><span class="lab">Preference-dependent</span>
     <p><strong>Rebut</strong> and <strong>undermine</strong> defeat only if the attacker is <em>not weaker</em> than the part it targets. A weak counter-conclusion loses to a strong one.</p></div>
 </div>
 <p class="rise" style="margin-top:1rem;max-width:66ch">Consequence worth internalizing: a symmetric rebut where <em>neither</em> side is preferred becomes a <strong>mutual defeat</strong> — the ASPIC⁺ version of the Dung 2-cycle, and hence the source of multiple preferred extensions.</p>`,

/* 48 — weakest vs last link (intro) */
`<div class="rise sec"><b>§10</b> How is an argument's strength defined?</div>
 <h2 class="rise">Lift a rule order to a whole-tree order: <span class="em">two recipes.</span></h2>
 <p class="rise" style="max-width:66ch">Usually you're given a preference on individual defeasible rules and premises. But an argument is a whole tree — how strong is <em>it</em>? Two standard liftings, examined closely in Deep dive C:</p>
 <div class="two tight" style="margin-top:.6rem">
   <div class="box def rise" style="margin:0"><span class="lab">Weakest-link</span>
     <p>Only as strong as its <em>weakest</em> defeasible rule / premise. "A chain breaks at its weakest link."</p></div>
   <div class="box def rise" style="margin:0"><span class="lab">Last-link</span>
     <p>Compare only the <em>last</em> (top-most) defeasible rules — the final inferential step(s).</p></div>
 </div>
 <p class="rise note" style="margin-top:.9rem">The choice is not cosmetic: it changes the defeat relation, hence the extensions, and it affects which postulates you can prove. More in Deep dive C.</p>`,

/* 49 — compilation to Dung */
`<div class="rise sec"><b>§11</b> Closing the loop — back to Part I</div>
 <h2 class="rise">Assemble the AF, then run <span class="em">any</span> Dung semantics.</h2>
 <p class="rise" style="max-width:66ch">Now we have everything to build a Dung framework: the nodes are all the arguments you can construct, and the edges are the <em>defeat</em> relation (attacks filtered through preferences).</p>
 <div class="codebox rise" style="margin-top:.5rem">F = (A, R<sub>def</sub>)   A = all constructible arguments   R<sub>def</sub> = the defeat relation

apply grounded / preferred / stable …  →  extensions  →  project to formulas</div>
 <p class="rise" style="margin-top:.9rem;max-width:66ch">That's the whole compilation. From here on, <em>everything</em> in Part I applies verbatim — grounded is still the least fixpoint, the hierarchy still holds, the cycles still misbehave. ASPIC⁺'s only job was to produce a well-behaved graph.</p>`,

/* 50 — justified formulas */
`<div class="rise sec"><b>§11</b> From accepted arguments to accepted claims</div>
 <h2 class="rise">A formula is <span class="em">justified</span> if the right arguments carry it.</h2>
 <p class="rise" style="max-width:66ch">Extensions are sets of <em>arguments</em>, but we usually care about <em>formulas</em>. Project down:</p>
 <div class="box def rise" style="margin-top:.6rem"><span class="lab">Formula justification (under semantics σ)</span>
   <p>φ is <strong>skeptically</strong> justified iff some argument for φ is in <em>every</em> σ-extension.<br>
      φ is <strong>credulously</strong> justified iff some argument for φ is in <em>at least one</em> σ-extension.</p>
 </div>
 <p class="rise" style="margin-top:.9rem;max-width:66ch">Grounded (unique extension) collapses the two notions. With multiple preferred extensions they can diverge: a dilemma's φ is credulously but not skeptically justified. This object-level status is exactly what a "claim-status ≡ compiled grounded" equivalence would target — the seam a proof-carrying claim language proves against.</p>`,

/* 51 — rationality postulates */
`<div class="rise sec"><b>§12</b> What makes ASPIC⁺ "correct"</div>
 <h2 class="rise">The four <span class="em">rationality postulates.</span></h2>
 <p class="rise" style="margin-bottom:.6rem;max-width:66ch">Caminada &amp; Amgoud (2007) asked: what sanity checks must a structured system pass, or it emits nonsense? Under well-formedness (can't attack strict/axioms; R<sub>s</sub> closed under transposition; K<sub>n</sub> consistent), <em>every</em> complete extension E satisfies:</p>
 <ul class="rise">
   <li><strong>Sub-argument closure</strong> — if A ∈ E then every sub-argument of A ∈ E. (Accept a proof ⟹ accept its parts.)</li>
   <li><strong>Closure under strict rules</strong> — the conclusions of E are closed under R<sub>s</sub>. (Strict reasoning from accepted claims stays accepted.)</li>
   <li><strong>Direct consistency</strong> — no two conclusions in E are contraries.</li>
   <li><strong>Indirect consistency</strong> — even the <em>strict closure</em> of E's conclusions is consistent.</li>
 </ul>
 <p class="rise note">Postulates 3 &amp; 4 are where your contrariness and strict-rule handling either hold up or don't — precisely the metatheory worth mechanizing, <code>sorry</code>-free.</p>`,

/* 52 — bridge / mental model */
`<div class="rise sec"><b>Bridge</b> · the whole pipeline on one slide</div>
 <h2 class="rise">Two layers, one seam.</h2>
 <div class="codebox rise sm">  (AS, K, ⪯)            arguments +          Dung AF            extensions        justified
 language, rules,   →   attacks       →    (A, R<sub>def</sub>)     →    (grounded,…)  →   formulas
 contrariness, prefs    (§8–9)             (§11)                (Part I)          (§11)
 ├────────────  ASPIC⁺  (structured)  ────────────┤   ├──────  Dung (abstract)  ──────┤</div>
 <div class="two tight" style="margin-top:1rem">
   <p class="rise"><strong>Dung</strong> = the semantic engine. Pure fixpoint theory on a digraph; grounded = least fixpoint of the defense operator.</p>
   <p class="rise"><strong>ASPIC⁺</strong> = the compiler front-end. Turns a defeasible theory into that digraph — carefully, so the extensions obey the postulates.</p>
 </div>
 <p class="rise note" style="margin-top:.9rem">If you remember one picture from this talk, make it this one. Everything else is detail hanging off these arrows.</p>`,

/* ===================== DEEP DIVES ===================== */

/* 53 — deep dives divider */
`<div class="rise sec"><b>Deep dives</b> · slow &amp; explicit</div>
 <p class="rise hook">Now, the <span class="em">machinery</span> — worked out by hand.</p>
 <ol class="out rise" style="margin-top:1.2rem;max-width:60ch">
   <li>The full Tweety example, end to end</li>
   <li>The grounded lfp algorithm + the Knaster–Tarski proof</li>
   <li>Weakest-link vs last-link — and why the choice matters</li>
   <li>Contraries &amp; assumptions — recovering ABA as a special case</li>
 </ol>`,

/* 54 — Tweety setup */
`<div class="rise sec"><b>Deep dive A</b> · worked example — the theory</div>
 <h2 class="rise">Tweety: the <span class="em">"Hello World"</span> of defeasible reasoning.</h2>
 <div class="codebox rise sm">K<sub>p</sub> = { bird,  penguin }                    <span class="c">— ordinary premises (no axioms yet)</span>
R<sub>d</sub> :  d₁ : bird     ⇒ flies
      d₂ : penguin  ⇒ ¬flies
      d₃ : penguin  ⇒ bird              <span class="c">— penguins are birds</span>
contrariness:  flies / ¬flies  (symmetric)
preference:  d₂ more specific than d₁   ⟹   the d₂-argument ≻ the d₁-argument</div>
 <p class="rise" style="margin-top:1rem;max-width:66ch">The classic tension: <code>bird ⇒ flies</code> versus <code>penguin ⇒ ¬flies</code>. Common sense says the penguin rule, being more specific, should win. Our goal: watch the machinery deliver <code>¬flies</code> <em>without</em> any hand-coded priority on the conclusion — it emerges from a preference on the <em>rules.</em></p>`,

/* 55 — Tweety: build arguments */
`<div class="rise sec"><b>Deep dive A</b> · step 1 — build the arguments</div>
 <h2 class="rise">Grow the proof trees from the premises up.</h2>
 <div class="codebox rise sm">A₁ = bird                          <span class="c">— premise leaf, Conc = bird</span>
A₂ = A₁ ⇒ flies      (via d₁)      <span class="c">— Conc = flies, uses defeasible d₁</span>
A₃ = penguin                       <span class="c">— premise leaf, Conc = penguin</span>
A₄ = A₃ ⇒ ¬flies     (via d₂)      <span class="c">— Conc = ¬flies, uses defeasible d₂</span>
A₅ = A₃ ⇒ bird       (via d₃)      <span class="c">— Conc = bird, uses defeasible d₃</span></div>
 <p class="rise" style="margin-top:1rem;max-width:66ch">Five arguments. Two of them — A₂ and A₄ — reach <em>contradictory</em> conclusions (flies vs ¬flies), each by a defeasible top rule. That's a textbook setup for a rebut. The others conclude <code>bird</code> or <code>penguin</code>, which nothing contradicts.</p>`,

/* 56 — Tweety: attacks & defeat */
`<div class="rise sec"><b>Deep dive A</b> · step 2 — attacks, then defeat</div>
 <h2 class="rise">The symmetric rebut becomes a <span class="em">one-way</span> defeat.</h2>
 <div class="codebox rise sm"><span class="r">rebut</span>:  A₂ ⇄ A₄        (flies vs ¬flies — symmetric contrary, both defeasible tops)
preference:  A₄ ≻ A₂  (d₂ more specific)
       ⟹    <span class="o">A₄ defeats A₂,  but  A₂ does NOT defeat A₄</span>
no undermines  (nothing concludes ¬bird or ¬penguin)
no undercuts   (nothing concludes ‾n(d₁)‾, ‾n(d₂)‾, ‾n(d₃)‾)</div>
 <div class="graph rise" style="justify-content:center;margin-top:1rem">
   <div class="gnode out"><div class="nd">A₂</div><span class="tag">flies · out</span></div>
   <span class="arrow">⟵</span>
   <div class="gnode in"><div class="nd">A₄</div><span class="tag">¬flies · in</span></div>
 </div>
 <p class="rise note" style="margin-top:.9rem">The rebut was symmetric, but the specificity preference broke the tie — so only <em>one</em> edge survives into the Dung graph. This is §10 in action. A₁, A₃, A₅ sit off to the side, unattacked.</p>`,

/* 57 — Tweety: grounded iteration */
`<div class="rise sec"><b>Deep dive A</b> · step 3 — iterate F<sub>def</sub> from ∅</div>
 <h2 class="rise">Run the grounded algorithm by hand.</h2>
 <div class="codebox rise sm">Round 0:  F<sub>def</sub>(∅)  = { A₁, A₃, A₄, A₅ }
          <span class="c">A₁, A₃ unattacked premises; A₅ unattacked; A₄ unattacked (A₂ can't defeat back).</span>
          <span class="c">A₂ excluded: its attacker A₄ is not attacked by ∅.</span>
Round 1:  F<sub>def</sub>({A₁,A₃,A₄,A₅}) = { A₁, A₃, A₄, A₅ }
          <span class="c">Does the set now defend A₂? A₂'s attacker A₄ is still undefeated — no. Fixpoint.</span>
grounded = { A₁, A₃, A₄, A₅ }        A₂ is <span class="r">out</span></div>
 <p class="rise" style="margin-top:1rem;max-width:66ch">Two rounds and we stabilize. Notice the mechanism: A₄ can never be knocked out (nothing defeats it), so A₂ can never be reinstated. The iteration <em>discovers</em> this rather than us asserting it.</p>`,

/* 58 — Tweety: justified formulas */
`<div class="rise sec"><b>Deep dive A</b> · step 4 — read off the justified formulas</div>
 <h2 class="rise">The preference propagated <span class="em">all the way</span> to the object level.</h2>
 <div class="two tight">
   <div class="rise"><p style="margin-bottom:.4rem"><strong>Justified</strong> (skeptical, from the grounded extension):</p>
     <div class="codebox sm"><span class="g">bird · penguin · ¬flies</span>
<span class="r">flies</span>  — NOT justified (its only argument A₂ is out)</div></div>
   <div class="rise"><p>The agent concludes <code>¬flies</code> and withholds <code>flies</code> — exactly the common-sense answer, obtained from a preference on <em>rules</em>, never on conclusions.</p></div>
 </div>
 <p class="rise" style="margin-top:.9rem;max-width:66ch"><strong>Non-monotonicity, live:</strong> drop <code>penguin</code> from K<sub>p</sub> and A₄, A₅ vanish — now <code>flies</code> <em>is</em> justified. Adding the fact <code>penguin</code> <em>retracts</em> a previously-justified conclusion. No classical, monotonic logic can do that.</p>
 <p class="rise note">Exercise: move <code>bird</code> into K<sub>n</sub> (make it an axiom). Which attacks disappear? (Answer: none change here — bird was never undermined — but A₁ becomes immune in principle.)</p>`,

/* 59 — Deep dive B: algorithm */
`<div class="rise sec"><b>Deep dive B</b> · the grounded algorithm, in general</div>
 <h2 class="rise">Iterate to the least fixed point — the <span class="em">executable</span> semantics.</h2>
 <div class="codebox rise">grounded(F):
    S ← ∅
    repeat
        S′ ← F<sub>def</sub>(S)          <span class="c"># {a | every attacker of a is attacked by S}</span>
        if S′ = S: return S       <span class="c"># fixpoint reached</span>
        S ← S′
    <span class="c"># equivalently as a labelling: mark unattacked IN, propagate OUT,</span>
    <span class="c"># repeat; whatever never settles is UNDEC.</span></div>
 <p class="rise" style="margin-top:1rem;max-width:66ch">Round 0 admits the unattacked arguments. Each later round admits whatever the current set now defends. On a finite AF this halts in ≤ |A| rounds, because S strictly grows until it can't — exactly what we watched happen with Tweety.</p>
 <p class="rise note">The next slide proves this loop is <em>correct</em>: that its result really is the ⊆-least complete extension.</p>`,

/* 60 — Deep dive B: the proof */
`<div class="rise sec"><b>Deep dive B</b> · why the iteration is the least fixpoint</div>
 <h2 class="rise">Knaster–Tarski, spelled all the way out.</h2>
 <div class="box thm rise"><span class="lab">Claim</span>
   <p class="stmt">⋃ₙ F<sub>def</sub>ⁿ(∅) is the ⊆-least fixed point of F<sub>def</sub>, hence the grounded extension.</p>
   <p class="pf"><b>1. Monotonicity.</b> S ⊆ T ⟹ F<sub>def</sub>(S) ⊆ F<sub>def</sub>(T): more defenders can only counter more attackers, so anything defended by S is defended by T.<br>
   <b>2. Ascending chain.</b> ∅ ⊆ F<sub>def</sub>(∅) trivially; apply monotonicity n times ⟹ F<sub>def</sub>ⁿ(∅) ⊆ F<sub>def</sub>ⁿ⁺¹(∅). The images form an increasing chain.<br>
   <b>3. Limit is a fixpoint.</b> Finite A (or Scott-continuity) ⟹ the chain stabilizes at some G with F<sub>def</sub>(G) = G.<br>
   <b>4. Leastness.</b> Let P be any fixpoint. ∅ ⊆ P; monotonicity ⟹ F<sub>def</sub>ⁿ(∅) ⊆ F<sub>def</sub>ⁿ(P) = P for all n; take the union ⟹ G ⊆ P. So G is below every fixpoint. ∎</p>
 </div>
 <p class="rise note" style="margin-top:.8rem">Steps 1–2 are the whole reason grounded is deterministic and unique. In a Lean development this is the <code>grounded_stable</code> / <code>grounded_fixpoint</code> pair, iterating over a finite subset lattice.</p>`,

/* 61 — Deep dive C: two liftings recalled */
`<div class="rise sec"><b>Deep dive C</b> · lifting a rule order to an argument order</div>
 <h2 class="rise">Weakest-link vs last-link — a concrete comparison.</h2>
 <p class="rise" style="max-width:68ch">Recall the two recipes from §10. Take one argument that chains a weak rule into a strong one and see how differently they score it:</p>
 <div class="two tight" style="margin-top:.5rem">
   <div class="box def rise" style="margin:0"><span class="lab">Weakest-link</span>
     <p>Strength = the <em>weakest</em> defeasible rule / premise anywhere in the tree.</p></div>
   <div class="box def rise" style="margin:0"><span class="lab">Last-link</span>
     <p>Strength = the <em>last</em> (top-most) defeasible rule(s) only — earlier steps don't count.</p></div>
 </div>
 <div class="codebox rise sm" style="margin-top:.9rem">A = ( p ⇒ q ) ⇒ r     rules used: d₁ = (p⇒q) weak,  d₂ = (q⇒r) strong
weakest-link:  strength(A) = weak         <span class="c">the weak d₁ caps it</span>
last-link:     strength(A) = strong       <span class="c">only the final d₂ matters</span></div>`,

/* 62 — Deep dive C: why it matters */
`<div class="rise sec"><b>Deep dive C</b> · why the choice matters</div>
 <h2 class="rise">It changes <span class="em">who defeats whom</span> — and whether postulates hold.</h2>
 <div class="two tight">
   <div class="rise">
     <ul>
       <li><strong>Last-link</strong> suits <em>defaults chained onto strict knowledge</em>: strict sub-steps are transparent, only the defeasible "last mile" is weighed. Common in legal and default reasoning.</li>
       <li><strong>Weakest-link</strong> is more conservative: one weak input anywhere caps the whole argument. Matches "evidence is only as good as its shakiest premise."</li>
     </ul>
   </div>
   <div class="box thm rise" style="margin:0;border-left-color:var(--bad)"><span class="lab" style="color:var(--bad)">The catch</span>
     <p class="stmt">The two liftings yield different defeat relations, hence different extensions — and the rationality postulates (§12) are proved only under specific pairings of lifting + order properties.</p>
     <p class="pf">Modgil–Prakken give the exact side-conditions (e.g. the order must be a "reasonable" strict partial order). Pick a lifting and you <em>owe</em> the matching well-formedness proof — a real obligation in a mechanization, not a free choice.</p>
   </div>
 </div>`,

/* 63 — Deep dive D: contraries */
`<div class="rise sec"><b>Deep dive D</b> · contrariness, in full generality</div>
 <h2 class="rise">Asymmetric contraries model <span class="em">assumptions.</span></h2>
 <div class="two tight">
   <div class="rise">
     <p style="margin-bottom:.5rem">Recall ‾·‾ need not be symmetric:</p>
     <div class="codebox sm">symmetric:   p ∈ ‾¬p‾  ∧  ¬p ∈ ‾p‾     <span class="c">contradiction</span>
asymmetric:  φ ∈ ‾ψ‾  but  ψ ∉ ‾φ‾      <span class="c">φ is a contrary of ψ</span></div>
     <p style="margin-top:.8rem">An <strong>assumption</strong> is a formula ψ that holds until its contrary φ is derived — φ defeats ψ, but deriving ψ does nothing against φ. The asymmetry is exactly "innocent until proven guilty."</p>
   </div>
   <div class="box def rise" style="margin:0"><span class="lab">Why this generalizes negation</span>
     <p>Classical logic forces an involutive ¬. ASPIC⁺ needs only a conflict relation — so it captures paraconsistent settings, default negation, and named-rule undercuts uniformly.</p>
     <p class="pf" style="font-style:normal">Modal intuition: read ‾·‾ as a primitive <em>incompatibility</em> accessibility, not a connective.</p></div>
 </div>`,

/* 64 — Deep dive D: ABA */
`<div class="rise sec"><b>Deep dive D</b> · recovering ABA</div>
 <h2 class="rise">Assumption-based argumentation is a <span class="em">special case.</span></h2>
 <div class="box thm rise"><span class="lab">ABA as a fragment of ASPIC⁺</span>
   <p class="stmt">Take R<sub>d</sub> = ∅ (all rules strict), let the only attackable elements be a distinguished set of <em>assumptions</em>, and let each assumption have a single contrary. Then ASPIC⁺ defeat = ABA attack, and the two theories' semantics coincide.</p>
 </div>
 <div class="codebox rise sm" style="margin-top:.9rem">ASPIC⁺ ingredient          ABA counterpart
────────────────────       ─────────────────
ordinary premise K<sub>p</sub>          assumption
contrary  φ ∈ ‾ψ‾           contrary(ψ) = φ
strict rule  →             inference rule
undermining                the ONLY attack (no rebut/undercut needed)</div>
 <p class="rise" style="margin-top:.9rem;max-width:66ch">With no defeasible rules there is nothing to undercut and no defeasible conclusion to rebut, so all conflict collapses onto <strong>undermining assumptions</strong>. ABA, ASPIC⁺, and (via §11) Dung are thus three views of one theory — which is why a claim-status result proved against one transfers to the others.</p>`,

/* ===================== PRACTICE ===================== */

/* 65 — practice divider */
`<div class="rise sec"><b>Practice</b> · build the muscle</div>
 <p class="rise hook">Five puzzles. <span class="em">Work each before flipping.</span></p>
 <p class="rise lead" style="margin-top:1.3rem;max-width:50ch">Everything you need is already in Parts I–II. Each answer slide walks the reasoning one line at a time — no step skipped.</p>
 <p class="rise note">Grab paper. Draw the graph, mark who attacks whom, then check yourself against the next slide. If an answer surprises you, re-read the definition it names.</p>`,

/* 66 — P1 question */
`<div class="rise sec"><b>Practice 1</b> · conflict-free &amp; admissible</div>
 <h2 class="rise">Warm-up: two attackers, one victim.</h2>
 <p class="rise" style="max-width:64ch">The whole graph is two edges: <code>a → b</code> and <code>c → b</code>. So <strong>b has two attackers</strong> (a and c); a and c are attacked by nobody; there are no other edges.</p>
 <div class="codebox rise sm" style="margin-top:.6rem">    a ──▶ b ◀── c        <span class="c">a attacks b; c attacks b; nothing else</span></div>
 <ul class="rise" style="margin-top:.9rem">
   <li>Is <code>{a, c}</code> conflict-free? Is it admissible?</li>
   <li>Is <code>{a, b}</code> conflict-free?</li>
   <li>What is the grounded extension of this graph?</li>
 </ul>
 <p class="rise note">Definitions to lean on: conflict-free (slide 8), defense/admissible (slides 9–11), grounded (slide 16). Remember: an argument with <em>no</em> attackers is defended by every set, vacuously.</p>`,

/* 67 — P1 answer */
`<div class="rise sec"><b>Practice 1</b> · worked answer</div>
 <h2 class="rise">Grounded here is <span class="em">{a, c}</span>; b is out.</h2>
 <ul class="rise">
   <li><strong>{a, c} conflict-free?</strong> Yes. The only edges point <em>at</em> b. Neither a nor c attacks the other, so no member of the set attacks another member.</li>
   <li><strong>{a, c} admissible?</strong> Yes. Admissible = conflict-free + defends every member. a has no attacker → defended vacuously. c has no attacker → defended vacuously. Nothing to counter, so the defense clause is free.</li>
   <li><strong>{a, b} conflict-free?</strong> <span class="r">No.</span> a → b is an edge <em>inside</em> the set — you'd be endorsing an argument and its attacker at once.</li>
 </ul>
 <div class="graph rise" style="justify-content:flex-start;margin-top:.6rem">
   <div class="gnode in"><div class="nd">a</div><span class="tag">in</span></div>
   <div class="gnode out" style="margin-left:1.2rem"><div class="nd">b</div><span class="tag">out</span></div>
   <div class="gnode in" style="margin-left:1.2rem"><div class="nd">c</div><span class="tag">in</span></div>
 </div>
 <p class="rise" style="margin-top:.7rem;max-width:66ch"><strong>Grounded:</strong> a and c are unattacked, so they are forced <span class="g">in</span> immediately. b is attacked by a (which is in) and has no defender, so b is <span class="r">out</span>. Result <code>{a, c}</code> — the same set we just checked was admissible, now shown to be the maximally-skeptical one.</p>`,

/* 68 — P2 question */
`<div class="rise sec"><b>Practice 2</b> · run the grounded algorithm by hand</div>
 <h2 class="rise">A four-argument chain.</h2>
